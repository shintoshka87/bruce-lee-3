<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Брюс Ли 6.0</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url("fonts/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:600;src:url("fonts/Inter-SemiBold.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("fonts/Inter-Bold.otf")}
@font-face{font-family:"Inter";font-weight:800;src:url("fonts/Inter-ExtraBold.otf")}
@font-face{font-family:"Inter Display";font-weight:800;src:url("fonts/InterDisplay-ExtraBold.otf")}
/* Layout: a gym logbook app. Bottom tab bar; the Day screen is a stack of interactive sections; one timer bar docks above the tabs.
   Guide colours follow competition plates: Гайд 100 — yellow 15 kg, Гайд 150 — green 10 kg, Гайд 200 — blue 20 kg; heavy sets — red 25 kg. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E8E2; --ink:#16201B; --muted:#56635C; --line:#D3D9D1;
  --g0:#B88700; --g1:#1D7560; --g2:#2456A6; --heavy:#B8352A; --dl:#7E8781;
  --ok:#1D7560; --warn:#9A6A0B; --bad:#A23E27; --timer:#16201B; --timer-ink:#EEF0EC; --p0:#5F7180;
  --f-display:"Inter Display","Inter",Roboto,system-ui,sans-serif;
  --f-body:"Inter",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --g0:#E2B44E; --g1:#55C3A2; --g2:#7FA8EC; --heavy:#EE8073; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; --p0:#9DB0BF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --g0:#E2B44E; --g1:#55C3A2; --g2:#7FA8EC; --heavy:#EE8073; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; --p0:#9DB0BF; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:14px 190px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
.chip.fill{background:var(--c);color:var(--bg);border-color:var(--c)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar button{border:0;background:none;padding:9px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button b{font-family:var(--f-display);font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] b{color:var(--g1)}

/* timer bar */
.tbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 10px 8px}
.tbar-in{max-width:740px;margin:0 auto;background:var(--timer);color:var(--timer-ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tbar .tl{font-size:14px;font-weight:700;line-height:1.25}
.tbar .tt{font-size:12.5px;opacity:.8;line-height:1.3}
.tbar .tc{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;text-align:right}
.tbar .tb{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tbar .tb button{flex:1;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;min-width:0}
.tbar.work .tbar-in{background:var(--heavy);color:#fff}
.tbar.warm .tbar-in,.tbar.easy .tbar-in{background:var(--p0);color:#fff}
.tbar.done .tbar-in{background:var(--ok);color:#fff}
.tbar .prog{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.tbar .prog i{display:block;height:100%;background:currentColor;width:0}

/* ruler of 37 cycles and 8-day rota */
.ruler{display:grid;grid-template-columns:repeat(37,minmax(0,1fr));gap:2px;margin-top:12px}
.cell{border:0;padding:0;height:30px;border-radius:4px;background:var(--pc);opacity:.35;position:relative}
.cell.past{opacity:.6}
.cell[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.cell .tst{position:absolute;left:50%;top:-5px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);background:var(--heavy)}
.cell.today::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-bottom-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.weekhead{margin-top:12px;display:grid;gap:6px}
.weekhead .row h2{font-size:20px}
.rota{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:8px}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 1px 5px;display:grid;justify-items:center;gap:1px;min-width:0}
.dayb .n{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.dayb .k{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;max-width:100%}
.dayb .k b{display:block;font-family:var(--f-display);font-size:14px;color:var(--pc)}
.dayb .dt{font-size:10px;color:var(--muted)}
.dayb.work{background:var(--sunk)}
.dayb.work .k b{color:var(--muted)}
.dayb[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dayb.done .n::after{content:" ✓";color:var(--ok)}
.dayb.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* day */
.day{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-top{padding:16px 14px 14px;border-top:6px solid var(--pc);display:grid;gap:8px}
.day-top .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.day-top .big h2{font-size:30px;line-height:1.05}
.day-top h3{font-family:var(--f-body);font-weight:800;font-size:18px}
.tmline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--sunk);border-radius:9px;padding:8px 10px}
.tmline b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.sec > h4{margin:0;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
details.sec > summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:800}
details.sec[open] > summary::after{content:"−"}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.step .sb{display:grid;gap:6px;min-width:0}
.step.on .st{opacity:.55}
.st b{font-weight:700}
.foot{font-size:13.5px;color:var(--muted)}

/* exercise */
.group{display:grid;gap:8px;border-left:3px solid var(--pc);padding-left:9px}
.group.single{border-left-color:transparent;padding-left:0}
.gl{font-size:12.5px;color:var(--muted);font-weight:700}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0}
.ex.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ex.main{border-left:4px solid var(--pc)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 9px;align-items:start}
.lab{font-weight:800;font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 6px;color:var(--pc);font-variant-numeric:tabular-nums}
.ex-name{font-weight:800;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.ex-name .pg{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;background:var(--sunk);color:var(--muted)}
.tag.swap{color:var(--g2)}
.sets{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;max-width:7.5em;text-wrap:balance}
.ex-load{font-size:14px}
.ex-rest{font-size:13px;color:var(--muted)}
.ex-note{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.sugg{font-size:14px;border-left:3px solid var(--ok);padding:4px 0 4px 9px}
.sugg b{font-size:16px}
.ex details{font-size:14px}
.ex details summary{cursor:pointer;color:var(--muted);font-weight:700}
.ex details > div{display:grid;gap:6px;margin-top:6px}
.setlist{display:grid;gap:6px}
.set{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 76px 42px;gap:6px;align-items:center}
.set.nowt{grid-template-columns:58px minmax(0,1fr) 76px 42px}
.set.norpe{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 44px}
.set.nowt.norpe{grid-template-columns:58px minmax(0,1fr) 44px}
.set .sl{font-size:12px;line-height:1.2;color:var(--muted);font-weight:700;min-width:0}
.set .sl b{display:block;color:var(--ink);font-size:13px}
.set.hv .sl b{color:var(--heavy)}
.set.skip{opacity:.5}
.set input,.set select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums;text-align:center}
.set select{padding:8px 2px}
.set .ok{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px}
.set.isdone .ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.isdone input,.set.isdone select{background:var(--sunk)}
.set.miss input{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.rowhint{grid-column:1 / -1;font-size:12px;color:var(--heavy);font-weight:600;margin-top:-2px}
.cond{border:1px solid var(--pc);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.cond .ch{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.cond ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.seglist{display:grid;gap:2px;max-height:220px;overflow:auto;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.seglist div{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;border-radius:5px}
.seglist div.cur{background:var(--sunk);font-weight:800}
.seglist div.past{opacity:.45}
.journal textarea,.field textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}

/* panels */
.panel{display:grid;gap:14px}
.panel h2{font-size:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-body);font-size:17px;font-weight:800}
.card.alert{border-color:var(--warn)}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;width:100%}
.field small{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:280px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.ex-grid{display:grid;gap:10px}
@media (min-width:700px){.ex-grid{grid-template-columns:1fr 1fr}}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.colors button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px}
.colors button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface)}
.banner{border-left:4px solid var(--c);background:var(--sunk);padding:9px 11px;border-radius:8px;font-size:14px}
.ztbl td.r{font-weight:700}
.log{display:grid;gap:4px;font-size:13.5px}
.log div{display:flex;gap:8px}
.log b.up{color:var(--ok)} .log b.dn{color:var(--bad)} .log b{min-width:52px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
@media (max-width:380px){.set{grid-template-columns:50px minmax(0,1fr) minmax(0,1fr) 60px 40px;gap:4px}.dayb .k{font-size:9.5px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="tbar" id="tbar" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <button type="button" data-tab="day"><b>Д</b>День</button>
  <button type="button" data-tab="progress"><b>↗</b>Прогресс</button>
  <button type="button" data-tab="ref"><b>Т</b>Техника</button>
  <button type="button" data-tab="profile"><b>П</b>Профиль</button>

рудь в последней трети.","alt":"Нет страхующего — жим с опусканием за 4 с и паузой на груди, 70% от максимума."},"board":{"name":"Жим лёжа с бруска ~10 см","group":"Жим лёжа","page":"🟡 как базовый жим","wt":"bar","how":"Брусок около 10 см лежит на груди. Опускай штангу до касания бруска и мощно выжимай. Траектория как в жиме, запястья прямые, ноги не переставляешь. Учит проходить «мёртвую точку» и привыкать к большим весам.","err":"Класть брусок на живот и менять траекторию.","alt":"Нет бруска — жим от упоров силовой рамы, выставленных на ~10 см выше груди."},"board15":{"name":"Жим лёжа с бруска 15 см","group":"Жим лёжа","page":"🟡 как базовый жим","wt":"bar","how":"Брусок около 15 см на груди или упоры рамы на этой высоте. Вес выше обычного — ЦНС привыкает к нему в короткой амплитуде.","err":"","alt":"Слингшот, если он у тебя есть."},"sling":{"name":"Жим в слингшоте","group":"Жим лёжа","page":"⚪ по желанию","wt":"bar","how":"Только при мягком слингшоте и страхе больших весов — так советует сам гайд. Слингшот надевается на локти и помогает внизу. Страхующий обязателен.","err":"","alt":"Нет слингшота или страха веса — пропусти."},"cg_bench":{"name":"Жим узким хватом","group":"Грудь и трицепс","page":"🟡 как базовый жим","wt":"bar","how":"Хват чуть уже плеч, локти вдоль корпуса. Опускай к низу груди и выжимай без отбива; вверху без рывка в локтях. Стопы — как в основном жиме.","err":"Локти расходятся в стороны — нагрузка уходит в грудь.","alt":"Ноют запястья — EZ-гриф или гантели нейтральным хватом."},"mg_bench":{"name":"Жим средним хватом","group":"Грудь и трицепс","page":"🟡 как базовый жим","wt":"bar","how":"Хват на ладонь уже соревновательного: нагрузка поровну на грудь и трицепс. Паузу на груди можно не делать, но без отбива.","err":"","alt":""},"wg_bench":{"name":"Жим широким хватом","group":"Грудь и трицепс","page":"🟡 как базовый жим","wt":"bar","how":"Хват на ладонь шире обычного: амплитуда короче, больше работают грудные и плечи. Без отбива и рывков.","err":"","alt":""},"incl_bench":{"name":"Жим штанги на скамье 30°","group":"Грудь и трицепс","page":"🟡 без прогиба","wt":"bar","how":"Скамья 30°, лопатки сведены, ягодицы на скамье. Гриф опускается к верху груди, движение вертикальное, без отрыва груди и таза. Стопы на полу или на подставке — поясница не прогибается. Удобно в Смите с ограничителями.","err":"Прогиб в пояснице и поднятые к ушам плечи.","alt":"Жим в Смите на скамье 30°."},"db_bench":{"name":"Жим гантелей лёжа","group":"Грудь и трицепс","page":"🟢 скамья и гантели","wt":"db","how":"Сядь, гантели на бёдрах, ляг назад, прижимая их к груди. Жми вверх, сводя гантели над грудью, локти 45–60°. Опускай до лёгкого растяжения груди. После подхода — гантели на грудь и сядь вместе с ними.","err":"Рывок гантелей коленями в исходное положение с прогибом поясницы.","alt":"Гантели стало трудно заносить — тренажёр горизонтального жима."},"incl_db":{"name":"Жим гантелей на скамье 30°","group":"Грудь и трицепс","page":"🟢 скамья и гантели","wt":"db","how":"Скамья 30°, гантели над верхом груди, локти 45–60°. Опускай до лёгкого растяжения, жми вверх по дуге. Ягодицы и лопатки прижаты.","err":"Прогиб в пояснице на последних повторах.","alt":"Тренажёр наклонного жима."},"db_fly":{"name":"Разводка гантелей лёжа","group":"Грудь и трицепс","page":"🟢 скамья и гантели","wt":"db","how":"Руки над грудью, локти слегка согнуты и смотрят вниз. На вдохе разводи гантели в стороны до уровня скамьи, на выдохе своди. Медленно, без рывков.","err":"Руки сгибаются всё сильнее — вес велик, это уже жим.","alt":"Сведение рук в кроссовере."},"incl_db_fly":{"name":"Разводка гантелей на скамье 30°","group":"Грудь и трицепс","page":"🟢 скамья и гантели","wt":"db","how":"Как разводка лёжа, но на скамье 30°. Локти к полу, поясница не прогибается.","err":"","alt":"Сведение рук в кроссовере снизу вверх."},"cg_pushups":{"name":"Отжимания от пола узкие","group":"Грудь и трицепс","page":"🟢 свой вес","wt":"bw","how":"Ладони чуть уже плеч, локти вдоль корпуса. Тело — прямая линия: ягодицы и пресс напряжены, поясница не провисает. Опускайся почти до пола.","err":"Провисшая поясница.","alt":"Поясница провисает — отжимания от скамьи."},"french":{"name":"Французский жим лёжа (EZ-гриф)","group":"Грудь и трицепс","page":"🟢 лёжа на скамье","wt":"pl","how":"Лёжа, гриф над лбом на прямых руках. Плечи неподвижны: сгибай только локти, опуская гриф ко лбу, пауза 1 с, разгибай. Вес записывай вместе с грифом.","err":"Локти разъезжаются в стороны.","alt":"Ноют локти — разгибание на блоке с канатом."},"ohp_seat":{"name":"Жим штанги сидя, спинка 75–80°","group":"Плечи","page":"🟡 спина прижата","wt":"bar","how":"Спинку поставь на 75–80°, не вертикально — так поясница меньше прогибается. Ягодицы и лопатки прижаты, рёбра опущены. Опускай гриф к верху груди, выжимай над головой, голову не запрокидывай. Удобнее в Смите.","err":"Поясница отходит от спинки, грудь выталкивается вперёд — это уже жим стоя.","alt":"Поясница не держится — спинка 60° или жим гантелей сидя."},"db_seated":{"name":"Жим гантелей сидя, спинка 75–80°","group":"Плечи","page":"🟡 спина прижата","wt":"db","how":"Спинка 75–80°, гантели у плеч, локти чуть впереди корпуса. Жми вверх, не стукая гантели. Поясница прижата к спинке, рёбра опущены.","err":"Прогиб в пояснице на последних повторах.","alt":"Тренажёр жима сидя."},"lat_raise":{"name":"Махи гантелями в стороны сидя","group":"Плечи","page":"🟢 сидя","wt":"db","how":"Сидя на скамье, гантели по бокам. Поднимай руки в стороны до уровня плеч, локти чуть согнуты, плечи не тянутся к ушам. Опускай 2 с.","err":"Раскачка корпусом и подъём выше плеч.","alt":"Подъём руки в сторону в кроссовере."},"rev_curl":{"name":"Сгибание обратным хватом (EZ)","group":"Руки","page":"🟢 опора","wt":"pl","how":"Хват сверху, локти у боков. Сгибай только в локтях, без толчка бёдрами. Удобнее на скамье Скотта. Вес записывай вместе с грифом.","err":"Локти уходят вперёд, корпус раскачивается.","alt":"Сгибание на нижнем блоке обратным хватом."},"db_curl":{"name":"Сгибание с гантелями сидя","group":"Руки","page":"🟢 сидя со спинкой","wt":"db","how":"Сидя, спина на спинке. Сгибай руки с супинацией (мизинец вверх), локти неподвижны, опускай 2 с.","err":"Раскачка корпусом.","alt":""},"hammer":{"name":"Молотки сидя","group":"Руки","page":"🟢 сидя со спинкой","wt":"db","how":"Сидя, спина на спинке, гантели нейтральным хватом. Сгибай вместе или поочерёдно, локти неподвижны, без раскачки.","err":"","alt":"Молотки на скамье Скотта."},"wrist_curl":{"name":"Сгибание кистей со штангой сидя","group":"Руки","page":"🟢 сидя","wt":"pl","how":"Предплечья на бёдрах или на скамье, кисти свисают. Сгибай кисти вверх, опускай до растяжения. Медленно, без рывков.","err":"","alt":""},"ez_empty":{"name":"Сгибание на бицепс — пустой гриф","group":"Руки","page":"🟢 без веса","wt":"bw","how":"Гриф без блинов, быстро вверх, медленно вниз. Прокачка крови, не нагрузка.","err":"","alt":""},"seatrow":{"name":"Горизонтальная тяга блока","group":"Спина","page":"🟢 блок","wt":"mc","how":"Сидя, стопы в упоре, колени чуть согнуты, корпус вертикален и неподвижен. Тяни рукоять к поясу, сводя лопатки, пауза 1 с; отпускай до прямых рук без наклона вперёд.","err":"Раскачка корпусом вперёд-назад — работает поясница.","alt":"Рычажная тяга сидя."},"cs_db_row":{"name":"Тяга гантели лёжа грудью на скамье","group":"Спина","page":"🟢 с упором грудью","wt":"db","how":"Ляг грудью на скамью 30–45°, гантели в опущенных руках. Тяни к поясу, сводя лопатки, локти вдоль корпуса, пауза 1 с. Грудь не отрывается от скамьи. Одной рукой — поочерёдно, двумя — одновременно.","err":"Отрыв груди и рывок поясницей.","alt":"Рычажная тяга одной рукой."},"pullup_cg":{"name":"Подтягивания узким хватом","group":"Спина","page":"🟢 или в гравитроне","wt":"gv","how":"Нейтральный или узкий хват. Из виса с опущенными плечами тянись грудью к перекладине, опускайся 2 с до прямых рук, без раскачки. Не выходит нужное число — гравитрон: впиши противовес, приложение будет его убавлять.","err":"Рывки, «кипинг», неполная амплитуда.","alt":"Вертикальная тяга узким хватом."},"pullup_wg":{"name":"Подтягивания широким хватом","group":"Спина","page":"🟢 или в гравитроне","wt":"gv","how":"Хват шире плеч, тянись грудью к перекладине, локти к бокам, лопатки сводятся. Только к груди, не за голову. Не выходит нужное число — гравитрон: впиши противовес.","err":"Подтягивания за голову — при шейных протрузиях запрещены.","alt":"Вертикальная тяга широким хватом."},"pullup_neg":{"name":"Негативные подтягивания","group":"Спина","page":"🟢 свой вес","wt":"bw","how":"Запрыгни или встань на опору так, чтобы подбородок был над перекладиной, и опускайся 4–5 с до прямых рук.","err":"Падение вниз в конце.","alt":"Гравитрон с медленным опусканием."},"leg_ext":{"name":"Разгибание ног в тренажёре","group":"Ноги и ягодицы","page":"🟢 тренажёр","wt":"mc","how":"Спинку настрой так, чтобы колени упирались в край сиденья, а крестец был прижат к спинке. Валик — над стопой. Разгибай ноги без подскоков и инерции, пауза вверху.","err":"Отрыв таза от сиденья на тяжёлых повторах.","alt":""},"leg_curl":{"name":"Сгибание ног лёжа","group":"Ноги и ягодицы","page":"🟢 тренажёр","wt":"mc","how":"Лёжа лицом вниз, валик чуть выше пяток, таз прижат. Сгибай ноги к ягодицам, короткая пауза, опускай медленно.","err":"Таз поднимается, поясница прогибается.","alt":"Сгибание ног сидя или на фитболе."},"goblet_box":{"name":"Гоблет-присед на скамью","group":"Ноги и ягодицы","page":"🟡 гиря у груди","wt":"kb","how":"Гиря или гантель у груди, скамья на высоте колена. Садись назад и вниз, мягко касаешься скамьи — встаёшь. Спина ровная, колени над стопами.","err":"Плюхнуться на скамью и округлить поясницу.","alt":"Приседания без веса на скамью."},"box_squat":{"name":"Приседания без веса на скамью","group":"Ноги и ягодицы","page":"🟢 свой вес","wt":"bw","how":"Скамья на высоте колена. Садись медленно, касание — и вставай мощно. Колени не заваливаются внутрь, спина ровная.","err":"","alt":""},"meditation":{"name":"Медитация в зале","group":"Кор и спина","page":"🟢","wt":"none","how":"Пришёл в зал, 10 минут лёгкого велосипеда, разминка суставов, ушёл. В гайде это «тренировка воли» перед проходкой: ты пришёл, несмотря ни на что.","err":"","alt":""},"tbar_cs":{"name":"Тяга Т-грифа с упором грудью","group":"Спина","page":"🟢 зелёный список — главная тяга","wt":"pl","how":"Грудь плотно на подушке, стопы на платформе. Нейтральный хват, сведи лопатки и тяни к низу груди, локти вдоль корпуса. Пауза 1 с вверху, опускай под контролем до прямых рук, не отрывая грудь от подушки.","err":"Отрыв груди от подушки и рывок поясницей.","alt":"Тренажёр занят — рычажная тяга."},"latpd":{"name":"Тяга верхнего блока к груди","group":"Спина","page":"🟢 зелёный список — блок","wt":"mc","how":"Бёдра под валиками, корпус вертикален или с наклоном назад до 10°. Тяни рукоять к верху груди, опуская лопатки; вверху выпрямляй руки полностью. Хват — как в жиме лёжа, если в плане не сказано иначе. Только к груди, никогда за голову.","err":"Раскачка и откидывание корпуса назад, чтобы «досадить» вес.","alt":"Нет широкой рукояти — нейтральный хват."},"dips_grav":{"name":"Брусья в гравитроне","group":"Грудь и трицепс","page":"🟡 неглубоко, только с противовесом","wt":"gv","how":"Колени на платформе, корпус вертикален, плечи опущены. Опускайся, пока плечо не станет параллельно полу, — не глубже; выжимайся без раскачки. Прогресс — меньше противовеса. Ноют плечи — упражнение пропускается.","err":"Слишком глубокое опускание и поднятые к ушам плечи.","alt":"Болят плечи — разгибание на трицепс с канатом."},"tri_rope":{"name":"Разгибание рук на блоке с канатом","group":"Грудь и трицепс","page":"🟢 зелёный список — блок","wt":"mc","how":"Стоя у верхнего блока, локти прижаты к бокам. Разгибай руки, разводя концы каната внизу, пауза 1 с. Корпус неподвижен, без наклона.","err":"Локти уходят вперёд, работает корпус.","alt":"Разгибание с прямой рукоятью."},"ez_scott":{"name":"Сгибание EZ-грифа на скамье Скотта","group":"Руки","page":"🟢 зелёный список — опора","wt":"pl","how":"Подмышки на краю подушки, локти на подушке. Сгибай руки, опускай 3 с почти до прямых, не разгибая полностью под весом. Вес записывай вместе с грифом.","err":"Отрыв локтей и рывок корпусом.","alt":"Сгибание на нижнем блоке."},"hipthrust":{"name":"Ягодичный мост со штангой (Смит)","group":"Ноги и ягодицы","page":"🟡 с подушкой, без прогиба","wt":"sm","how":"Спина на краю скамьи на уровне лопаток, гриф на мягкой подушке в сгибе бёдер, стопы на ширине таза. Подкрути таз, выдохни и подними таз до прямой линии плеч, таза и коленей; голени вертикальны. Вверху таз подкручен, поясница не прогибается. Опускайся под контролем.","err":"Переразгибание поясницы вверху вместо работы ягодиц.","alt":"Нет Смита — штанга с толстой подушкой. Ноет поясница — ягодичный мост на полу с гантелью на бёдрах. Упражнение — в списке для согласования с врачом."},"split_db":{"name":"Сплит-присед с гантелями","group":"Ноги и ягодицы","page":"🟡 гантели в опущенных руках","wt":"db","how":"Длинный шаг, гантели в опущенных руках, корпус вертикален. Опускайся прямо вниз, пока заднее колено почти не коснётся пола; переднее колено над стопой. Поднимайся за счёт передней ноги. На старте суммарный вес гантелей — до 30% веса тела.","err":"Наклон вперёд и толчок задней ногой.","alt":"Ноет поясница — без гантелей или придерживаясь за стойку. Упражнение — в списке для согласования с врачом."},"bridge":{"name":"Ягодичный мост со жгутом","group":"Ноги и ягодицы","page":"🟢 зелёный список","wt":"band","how":"Лёжа на спине, стопы на ширине таза, жгут над коленями. Подкрути таз, выдохни и подними его за счёт ягодиц до прямой линии плеч, таза и коленей. Колени давят в жгут наружу. Вверху пауза, опускайся медленно.","err":"Подъём слишком высоко с прогибом в пояснице — ягодицы при этом выключаются.","alt":"Нет жгута — без него, сжимая ягодицы вверху."},"bridge_sl":{"name":"Ягодичный мост на одной ноге","group":"Ноги и ягодицы","page":"🟢 зелёный список","wt":"bw","how":"Одна стопа на полу, вторая нога согнута и поднята. Подкрути таз и подними его на опорной ноге до прямой линии, таз не перекашивается. Вверху пауза.","err":"Перекос таза и прогиб.","alt":"Тяжело — мост на двух ногах с паузой 3 с."},"fitball_curl":{"name":"Сгибание ног на фитболе в мосте","group":"Ноги и ягодицы","page":"🟢 зелёный список — фитбол","wt":"bw","how":"Лёжа на спине, пятки на фитболе. Подними таз до прямой линии и, удерживая таз, подкати мяч пятками к себе, затем откати. Таз не опускается и не прогибается. Сложнее — откатывай 3 с.","err":"Таз проваливается на каждом повторе.","alt":"Тяжело — таз опускается между повторами."},"curlup":{"name":"Скручивание по Макгиллу (curl-up)","group":"Кор и спина","page":"🟢 зелёный список — вместо скручиваний","wt":"bw","how":"Лёжа на спине, одна нога согнута, другая прямая; ладони под поясницей, чтобы сохранить её естественный изгиб. Напряги пресс, как перед ударом в живот, и приподними голову и плечи на 2–3 см как одно целое — без сгибания шеи и поясницы. Держи 10 с, дыши коротко. Схема 6-4-2: 6 удержаний, отдых, 4, отдых, 2; на середине поменяй ноги. Сложнее — локти подняты над полом; ещё сложнее — глубокий вдох и выдох прямо во время удержания.","err":"Подбородок к груди и подъём корпуса высоко — это уже обычное скручивание.","alt":"Тянет шею (протрузии в шейном отделе) — голова остаётся на полу, напрягается только пресс."},"splank":{"name":"Боковая планка","group":"Кор и спина","page":"🟢 зелёный список — вместо тренажёра для косых","wt":"bw","how":"Лёжа на боку, локоть под плечом. Подними таз, чтобы голова, таз и колени (или стопы) были на одной линии; живот напряжён, таз не уходит назад. Держи 10 с, опусти на 2–3 с и повтори. С колен — колени согнуты; полная — опора на стопы, верхняя впереди; сложный вариант — с поднятой верхней ногой.","err":"Таз проваливается или уходит назад, плечо «висит».","alt":"Болит плечо — стоя у стены, опираясь на неё предплечьем."},"birddog":{"name":"«Птица-собака» (bird dog)","group":"Кор и спина","page":"🟢 зелёный список — var GCOL = ["var(--g0)", "var(--g1)", "var(--g2)"];
var NATIVE = (typeof window.Android !== "undefined" && window.Android) ? window.Android : null;
var TOOL = {bench:"bar", bench_speed:"bar", bench_neg:"bar", board:"bar", board15:"bar", sling:"bar"};
function toolOf(it){ if(it.role === "gv" || it.role === "farewell") return "gv"; return TOOL[it.ex] || (EX[it.ex] && EX[it.ex].wt) || "bw"; }
function gDays(gi){ var a = 0; for(var i = 0; i < gi; i++) a += G[i].weeks; return {from:a * 8 + 1, to:(a + G[gi].weeks) * 8}; }

/* ================= хранение ================= */
var LS = "bl6-app-v1", LS5 = "bl5-app-v1", LS4 = "bl4-app-v1";
var S = {v:6, profile:{start:"", startOk:false, max100:"105", max150:"", max200:"", mode:"adapt", feet:"floor", rhr:"", age:"39", hrmax:"", bw:"", stepDb:2, stepMc:5, htRef:"120", sound:true, watch:"rest"}, days:{}, body:[]};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
var MIGRATED = false;
(function load(){
  try{
    var raw = JSON.parse(lsGet(LS) || "null");
    if(raw){ S.profile = Object.assign(S.profile, raw.profile || {}); S.days = raw.days || {}; S.body = raw.body || []; return; }
    var old = JSON.parse(lsGet(LS5) || "null") || JSON.parse(lsGet(LS4) || "null");
    if(old){
      var op = old.profile || {};
      ["rhr","age","hrmax","bw","stepDb","stepMc","sound","watch"].forEach(function(k){ if(op[k] !== undefined && op[k] !== null && op[k] !== "") S.profile[k] = op[k]; });
      S.body = old.body || []; MIGRATED = true;
    }
  }catch(e){}
})();
function key(d){ return "s" + String(d).padStart(3, "0"); }
function rec(d){ var k = key(d); if(!S.days[k]) S.days[k] = {done:false, note:"", sets:{}, steps:{}, cond:{}, extra:{}, color:""}; var r = S.days[k]; r.sets = r.sets || {}; r.steps = r.steps || {}; r.cond = r.cond || {}; r.extra = r.extra || {}; return r; }
function persist(){ lsSet(LS, JSON.stringify(S)); }

/* облако (только в веб-версии внутри Claude) */
var CLOUD = {db:null, uid:null, timers:{}, chains:{}};
function save(docId){
  CACHE = {}; persist();
  if(!CLOUD.db) return;
  clearTimeout(CLOUD.timers[docId]);
  CLOUD.timers[docId] = setTimeout(function(){ delete CLOUD.timers[docId]; pushDoc(docId); }, 800);
}
function docBody(id){ if(id === "settings") return {profile:S.profile}; if(id === "body") return {list:S.body}; return S.days[id] || {}; }
function pushDoc(id){
  if(!CLOUD.db) return;
  var ref; try{ ref = CLOUD.db.collection("data6/users/" + CLOUD.uid).doc(id); }catch(e){ return; }
  var body = JSON.parse(JSON.stringify(docBody(id)));
  CLOUD.chains[id] = (CLOUD.chains[id] || Promise.resolve()).then(function(){ return ref.set(body); }).catch(function(){});
}
function connectCloud(){
  if(NATIVE || !window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1]; if(!db || !user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      CLOUD.db = db; CLOUD.uid = uid; var first = true;
      db.collection("data6/users/" + uid).onSnapshot(function(snap){
        var have = {};
        snap.docs.forEach(function(doc){
          have[doc.id] = true; if(CLOUD.timers[doc.id]) return;
          var b = doc.data(); if(!b) return;
          if(doc.id === "settings"){ if(b.profile) S.profile = Object.assign(S.profile, b.profile); }
          else if(doc.id === "body"){ S.body = b.list || []; }
          else if(/^s\d{3}$/.test(doc.id)){ S.days[doc.id] = b; }
        });
        if(first){
          first = false;
          Object.keys(S.days).forEach(function(id){ if(!have[id]) pushDoc(id); });
          if(!have.settings) pushDoc("settings");
          if(!have.body && S.body.length) pushDoc("body");
        }
        CACHE = {}; persist(); if(!busyTyping()) render(true);
      }, function(){ CLOUD.db = null; });
    });
  }).catch(function(){});
}
function busyTyping(){ var a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"); }

/* ================= мелочи ================= */
function fkg(x){ if(x == null || x === "" || !isFinite(x)) return ""; return String(Math.round(x * 100) / 100).replace(".", ","); }
function pnum(v){ if(v === "" || v == null) return null; var x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : null; }
function r1(x){ return Math.round(x * 10) / 10; }
function nearest(x, st){ return Math.max(0, Math.round(Math.ceil(x / st - 0.5 - 1e-9) * st * 100) / 100); } /* ничьи — вниз: не жадничай */
function floorTo(x, st){ return Math.max(0, Math.round(Math.floor(x / st + 1e-9) * st * 100) / 100); }
function stepOf(tool){ if(tool === "db") return +S.profile.stepDb || 2; if(tool === "mc" || tool === "gv") return +S.profile.stepMc || 5; if(tool === "kb") return 4; return 2.5; }

/* ================= план ================= */
function itemsOf(day){ if(day.kind !== "gym") return []; return DATA.prog[G[day.g].id][day.w - 1][day.gd].items; }
function rowsOf(it){
  if(it._rows) return it._rows;
  var out = [];
  if(it.P) it.P.forEach(function(x){ for(var i = 0; i < x[2]; i++) out.push({p:x[0], r:x[1]}); });
  else if(it.W) for(var i = 0; i < it.W[1]; i++) out.push({r:it.W[0]});
  else if(it.B) for(var j = 0; j < it.B[1]; j++) out.push({r:it.B[0]});
  it._rows = out; return out;
}
function setKey(it, idx){ return idx + ":" + it.ex; }
function allRows(day, it, idx){ var base = rowsOf(it); if(it.role !== "test") return base; var n = rec(day.d).extra[setKey(it, idx)] || 0, out = base.slice(); for(var i = 0; i < n; i++) out.push({p:null, r:1, extra:true}); return out; }
function rirOf(it){ var n = it.n || ""; if(/очень легко/i.test(n)) return 5; if(/легко/i.test(n)) return 4; if(/аккуратно/i.test(n)) return 3; return it.rir != null ? it.rir : 2; }
function nameOf(it){ return it.name || (EX[it.ex] ? EX[it.ex].name : it.ex === "core" ? "Тройка Макгилла" : it.ex); }

/* ================= расчёт: таблица «повторы до отказа → % от максимума» ================= */
var P10 = [0,100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.7,69.4,67.2,65,62.8,60.6,58.4,56.2,54,51.8,49.6];
function pctAt(n){ n = Math.max(1, Math.min(21, n)); var lo = Math.floor(n), hi = Math.ceil(n); return P10[lo] + (P10[hi] - P10[lo]) * (n - lo); }
function e1(w, r, q){ return w * 100 / pctAt(r + (q == null ? 0 : q)); }
function repsAt(p){ for(var n = 1; n < 21; n++){ if(P10[n + 1] < p) return n + (P10[n] - p) / (P10[n] - P10[n + 1]); } return 21; }
function expQ(p, r){ return repsAt(p) - r; }

var CACHE = {};
/* рабочий максимум гайда: старт — из профиля или проходки; дальше (адаптивный режим) — поправки после каждой жимовой тренировки */
function testInfo(gi){
  var k = "test" + gi; if(k in CACHE) return CACHE[k];
  var rng = gDays(gi), best = null;
  for(var d = rng.from; d <= rng.to; d++){
    var day = DAYS[d - 1], r = S.days[key(d)]; if(!day.test || !r) continue;
    itemsOf(day).forEach(function(it, idx){ if(it.role !== "test") return; (r.sets[setKey(it, idx)] || []).forEach(function(s){ if(s && s.done && s.w && s.r >= 1 && (!best || s.w > best.w)) best = {w:s.w, d:d}; }); });
  }
  return (CACHE[k] = best);
}
function guideBase(gi){
  var man = pnum(S.profile["max" + G[gi].id]);
  if(gi === 0) return man ? {v:man, why:"из профиля"} : {v:105, why:"стартовая оценка"};
  if(man) return {v:man, why:"из профиля"};
  var t = testInfo(gi - 1); if(t) return {v:t.w, why:"проходка " + G[gi - 1].name};
  var prev = tmState(gi - 1).end; return {v:prev, why:"проходки ещё нет — итог гайда " + G[gi - 1].id};
}
function tmState(gi){
  var k = "tm" + gi; if(k in CACHE) return CACHE[k];
  var base = guideBase(gi), tm = base.v, ev = [], rng = gDays(gi);
  if(S.profile.mode !== "strict"){
    for(var d = rng.from; d <= rng.to; d++){
      var day = DAYS[d - 1], r = S.days[key(d)]; if(day.kind !== "gym" || !r || !r.sets) continue;
      var v = benchVerdict(day, r, tm); if(!v) continue;
      if(v.delta) tm = Math.round((tm + v.delta) * 100) / 100;
      ev.push({d:d, delta:v.delta, after:tm, why:v.why});
    }
  }
  return (CACHE[k] = {base:base, ev:ev, end:tm});
}
function tmAt(d){
  var day = DAYS[d - 1], st = tmState(day.g), tm = st.base.v, log = [];
  st.ev.forEach(function(e){ if(e.d < d){ tm = e.after; log.push(e); } });
  return {tm:tm, base:st.base, log:log};
}
function benchVerdict(day, r, tm){
  var miss = 0, est = null, lb = null, n = 0, sample = "";
  itemsOf(day).forEach(function(it, idx){
    if(it.role !== "main" || it.ex !== "bench") return;
    var arr = r.sets[setKey(it, idx)] || [];
    rowsOf(it).forEach(function(row, i){
      var s = arr[i]; if(!s || !s.done || !s.w || s.r == null) return; n++;
      if(s.r < row.r) miss++;
      if(s.q == null) return;
      if(s.q <= 3){ var e = e1(s.w, s.r, s.q); if(est == null || e > est){ est = e; sample = fkg(s.w) + " × " + s.r + ", запас " + s.q; } }
      else { var l = e1(s.w, s.r, 4); if(lb == null || l > lb){ lb = l; if(est == null) sample = fkg(s.w) + " × " + s.r + ", запас 4+"; } }
    });
  });
  if(!n) return null;
  var yellow = r.color === "y";
  if(miss >= 2) return {delta:-5, why:"недобор повторов в " + miss + " подходах"};
  if(miss === 1) return {delta:-2.5, why:"недобор повторов в одном подходе"};
  if(est != null){
    if(est >= tm + 5 && !yellow) return {delta:2.5, why:sample + " → максимум ≈ " + fkg(r1(est)) + " кг, выше расчётного"};
    if(est <= tm - 7.5) return {delta:-2.5, why:sample + " → максимум ≈ " + fkg(r1(est)) + " кг, ниже расчётного"};
    return {delta:0, why:sample + " → максимум ≈ " + fkg(r1(est)) + " кг, всё по плану"};
  }
  if(lb != null && lb >= tm + 5 && !yellow) return {delta:2.5, why:"все подходы с запасом 4+ — расчётный максимум занижен"};
  return {delta:0, why:"повторы выполнены; отметь «запас» — тогда приложение точнее оценит максимум"};
}

/* история упражнения */
function lastSessions(ex, beforeD, max){
  var out = [];
  for(var d = beforeD - 1; d >= 1 && out.length < (max || 2); d--){
    var day = DAYS[d - 1], r = S.days[key(d)]; if(day.kind !== "gym" || !r || !r.sets) continue;
    var items = itemsOf(day);
    for(var idx = 0; idx < items.length; idx++){
      var it = items[idx]; if(it.ex !== ex || it.role === "main" || it.role === "test" || it.role === "farewell") continue;
      var arr = r.sets[setKey(it, idx)] || [];
      if(arr.some(function(s){ return s && s.done && (s.w != null || s.r != null); })){ out.push({d:d, it:it, sets:arr, rows:rowsOf(it), rir:rirOf(it)}); break; }
    }
  }
  return out;
}
function sessE(s){
  var best = null;
  s.sets.forEach(function(x, i){ if(!x || !x.done || !x.w || !x.r) return; var e = e1(x.w, x.r, x.q != null ? x.q : s.rir); if(best == null || e > best) best = e; });
  return best;
}
function accEst(ex, beforeD){
  var k = "acc" + ex + ":" + beforeD; if(k in CACHE) return CACHE[k];
  var ss = lastSessions(ex, beforeD, 2), res = null;
  if(ss.length){
    var E0 = sessE(ss[0]);
    if(E0 != null){
      if(ss[1]){ var E1 = sessE(ss[1]); if(E1) E0 = Math.max(E1 * 0.92, Math.min(E1 * 1.08, E0)); }
      res = {est:E0, s:ss[0]};
    }
  }
  return (CACHE[k] = res);
}
function sessLine(s){
  var x = s.sets.filter(function(q){ return q && q.done && q.w; })[0]; if(!x) return "";
  var tool = toolOf(s.it);
  return "день " + s.d + ": " + (tool === "db" ? "2×" : "") + fkg(x.w) + " кг × " + x.r + (x.q != null ? ", запас " + (x.q >= 4 ? "4+" : x.q) : "");
}
function lastWorkW(s){ var x = s.sets.filter(function(q){ return q && q.done && q.w; }); return x.length ? x[0].w : null; }
function sessMiss(s){ return s.sets.some(function(x, k){ return x && x.done && x.r != null && s.rows[k] && x.r < s.rows[k].r; }); }

/* подстройка внутри тренировки — по уже сделанным подходам этого упражнения */
function inSession(day, it, idx, i, st, rir){
  var arr = rec(day.d).sets[setKey(it, idx)] || [], rows = rowsOf(it), first = null, last = null, lastJ = -1;
  for(var j = 0; j < i; j++){ var s = arr[j]; if(s && s.done && s.w != null){ if(!first) first = {s:s, j:j}; last = s; lastJ = j; } }
  if(!last) return null;
  var row = rows[lastJ] || {}, miss = last.r != null && row.r != null && last.r < row.r;
  if(miss || (last.q != null && last.q <= rir - 2)) return {w:floorTo(last.w * 0.9, st), why:"прошлый подход тяжелее цели — −10%"};
  if(first.j === lastJ && last.q != null && last.q >= rir + 2) return {w:Math.round((last.w + st) * 100) / 100, why:"первый подход легче цели — +" + fkg(st) + " кг"};
  return {w:last.w, why:"как прошлый подход"};
}

/* подсказка веса для подхода i */
function suggest(day, it, idx, i){
  var rows = allRows(day, it, idx), row = rows[i] || rows[0], tool = toolOf(it), st = stepOf(tool), dr = rec(day.d), yellow = dr.color === "y";
  var T = tmAt(day.d), tm = T.tm, rir = rirOf(it);
  if(it.role === "main" || it.role === "test"){
    if(row.extra){
      var arr = dr.sets[setKey(it, idx)] || [], prev = null;
      for(var j = i - 1; j >= 0; j--){ if(arr[j] && arr[j].done && arr[j].w){ prev = arr[j]; break; } }
      if(!prev) return {w:nearest(tm * 1.025, 2.5), why:"попытка выше максимума"};
      if(prev.r < 1 || prev.q === 0) return {w:prev.w, stop:true, why:"прошлая попытка на пределе — на сегодня хватит"};
      return {w:Math.round((prev.w + 2.5) * 100) / 100, why:"+2,5 кг к прошлой попытке, пока штанга идёт быстро"};
    }
    var w = tm * row.p / 100, why = fkg(row.p) + "% от " + fkg(tm) + " кг", skip = false;
    if(yellow){ w *= 0.9; why += " · жёлтый день −10%"; if(row.p >= 90) skip = true; }
    var a = mainAdj(day, it, idx, i);
    if(a.mult !== 1){ w *= a.mult; why += " · " + a.why; }
    if(a.skip){ skip = true; why = a.why; }
    return {w:nearest(w, st), why:why, skip:skip, heavy:row.p >= 90 && it.ex !== "board" && it.ex !== "board15" && it.ex !== "sling"};
  }
  if(it.role === "gv" || it.role === "farewell") return gvSuggest(day, it, idx, i, st);
  if(it.role === "bw" || it.role === "core" || it.role === "note") return null;
  /* оценка разового максимума упражнения: по записям или стартовая */
  var A = accEst(it.ex, day.d), est, src;
  if(A){ est = A.est; src = "по " + sessLine(A.s) + " → 1ПМ ≈ " + fkg(Math.round(est)) + " кг"; }
  else {
    if(it.role === "own") est = (pnum(S.profile.htRef) || 120);
    else est = (ENG[it.ex] || 0) * tm / 105;
    src = "стартовая оценка — первый подход проверочный";
  }
  var w2, why2;
  if(it.role === "pct" && row.p != null){
    var raw = tm * row.p / 100, capW = est * pctAt(row.r + 2) / 100;
    if(raw > capW){ w2 = floorTo(capW, st); why2 = "в гайде " + fkg(row.p) + "% = " + fkg(nearest(raw, st)) + " кг, но это тяжелее «запаса 2» по твоей оценке (" + src + ")"; }
    else { w2 = nearest(raw, st); why2 = fkg(row.p) + "% от " + fkg(tm) + " кг"; }
  } else if(it.role === "dbpct" && row.p != null){
    var rawd = tm * row.p / 100 / 2, capd = est * pctAt(row.r + 2) / 100;
    w2 = floorTo(Math.min(rawd, capd), st); why2 = rawd > capd ? "в гайде " + fkg(row.p) + "% на пару гантелей, ограничено «запасом 2» (" + src + ")" : fkg(row.p) + "% от " + fkg(tm) + " кг на пару гантелей";
  } else if(it.role === "own" && row.p != null){
    w2 = nearest(est * row.p / 100, 2.5); why2 = fkg(row.p) + "% от оценки максимума " + fkg(Math.round(est)) + " кг" + (A ? " (" + sessLine(A.s) + ")" : " — стартовая, проверь первым подходом");
  } else {
    w2 = floorTo(est * pctAt(row.r + rir) / 100, st); why2 = src + "; сегодня " + row.r + " повт. с запасом " + (rir >= 4 ? rir + " (легко)" : rir);
    if(A){
      var lw = lastWorkW(A.s), lr = A.s.rows[0] ? A.s.rows[0].r : null;
      if(lw != null && lr === row.r){ w2 = Math.min(w2, lw + st); w2 = Math.max(w2, lw - 2 * st); }
      if(lw != null && sessMiss(A.s) && lr != null && lr <= row.r){ w2 = Math.min(w2, lw); why2 += " · в прошлый раз был недобор — вес не растёт"; }
    }
  }
  var a2 = inSession(day, it, idx, i, st, rir);
  if(a2){ w2 = a2.w; why2 = a2.why; }
  else if(yellow){ w2 = floorTo(w2 * 0.9, st); why2 += " · жёлтый день −10%"; }
  if(tool === "kb") w2 = Math.max(8, Math.min(32, Math.round(w2 / 4) * 4));
  if(tool === "db") w2 = Math.max(st, w2);
  return {w:w2, why:why2};
}
function mainAdj(day, it, idx, i){
  var arr = rec(day.d).sets[setKey(it, idx)] || [], rows = rowsOf(it), row = rows[i], res = {mult:1, skip:false, why:""};
  for(var j = 0; j < i; j++){
    var s = arr[j], pr = rows[j]; if(!s || !s.done || !pr || pr.p == null) continue;
    var miss = s.r != null && s.r < pr.r, hard = s.q != null && s.q <= Math.max(0, Math.floor(expQ(pr.p, pr.r)) - 3);
    if(!(miss || hard) || pr.p > row.p + 1e-9) continue;
    if(miss && pr.p >= 90 && row.p >= 90){ res.skip = true; res.why = "подход " + (j + 1) + " не дошёл — тяжёлые подходы на сегодня закончены"; }
    else if(res.mult === 1){ res.mult = 0.95; res.why = "−5%: подход " + (j + 1) + " шёл тяжелее плана"; }
  }
  return res;
}
function gvSuggest(day, it, idx, i, st){
  var row = rowsOf(it)[i] || {}, arr = rec(day.d).sets[setKey(it, idx)] || [];
  for(var j = i - 1; j >= 0; j--){ if(arr[j] && arr[j].done && arr[j].w != null){ var p = arr[j], pr = rowsOf(it)[j] || {}; if(p.r != null && pr.r && p.r < pr.r) return {w:p.w + st, why:"прошлый подход не дошёл — противовес на ступень больше"}; return {w:p.w, why:"как прошлый подход"}; } }
  var s = lastSessions(it.ex, day.d, 1)[0];
  if(!s && it.role === "farewell") return {w:null, why:"50 подтягиваний за сколько угодно подходов. Сам — оставь вес пустым; с гравитроном — впиши противовес. В поле повторов — сколько всего получилось."};
  if(s && it.role === "farewell"){ var fw = (s.sets.filter(function(x){ return x && x.done && x.w != null; })[0] || {}).w; return {w:fw != null ? fw : null, why:"противовес как в последних подтягиваниях (день " + s.d + ")"}; }

function safeVersion(){ try{ return NATIVE.version(); }catch(e){ return ""; } }
function exportOld(lsKey, app, prefix){

}
function exportData(){
  var json = JSON.stringify({app:"bl6", v:1, saved:new Date().toISOString(), data:S});
  var name = "bruce-lee-6-" + isoToday() + ".json";
  if(NATIVE){ var p = ""; try{ p = NATIVE.saveBackup(json, name); }catch(e){} toast(p ? "Сохранено: " + p : "Не удалось сохранить файл"); return; }
  var ta = document.getElementById("bk-text"); if(ta){ ta.value = json; ta.select(); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function(){ toast("Копия скопирована в буфер обмена"); }, function(){ toast("Текст копии в поле ниже — скопируй его"); });
  else toast("Текст копии в поле ниже — скопируй его");
}
function importData(txt){
  try{
    var o = JSON.parse(txt), d = o && o.data ? o.data : o;
    if(!d || !d.profile) throw new Error("bad");
    var mine = !o.app || o.app === "bl6";
    if(mine){ S.profile = Object.assign(S.profile, d.profile || {}); var days = d.days || {}; Object.keys(days).forEach(function(k){ if(/^s\d{3}$/.test(k)) S.days[k] = days[k]; }); }
    else { ["rhr","age","hrmax","bw","stepDb","stepMc","sound","watch"].forEach(function(k){ if(d.profile[k] != null && d.profile[k] !== "") S.profile[k] = d.profile[k]; }); }
    if(d.body && d.body.length) S.body = d.body;
    ZT = null; CACHE = {}; persist(); if(CLOUD.db){ Object.keys(S.days).forEach(pushDoc); pushDoc("settings"); pushDoc("body"); }
    toast(mine ? "Копия загружена" : "Из копии старой версии перенесены профиль и вес"); render();
  }catch(e){ toast("Не похоже на резервную копию"); }
}

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Брюс Ли 6.1</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url("fonts/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:600;src:url("fonts/Inter-SemiBold.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("fonts/Inter-Bold.otf")}
@font-face{font-family:"Inter";font-weight:800;src:url("fonts/Inter-ExtraBold.otf")}
@font-face{font-family:"Inter Display";font-weight:800;src:url("fonts/InterDisplay-ExtraBold.otf")}
/* Layout: a gym logbook app. Bottom tab bar; the Day screen is a stack of interactive sections; one timer bar docks above the tabs.
   Guide colours follow competition plates: Гайд 100 — yellow 15 kg, Гайд 150 — green 10 kg, Гайд 200 — blue 20 kg; heavy sets — red 25 kg. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E8E2; --ink:#16201B; --muted:#56635C; --line:#D3D9D1;
  --g0:#B88700; --g1:#1D7560; --g2:#2456A6; --heavy:#B8352A; --dl:#7E8781;
  --ok:#1D7560; --warn:#9A6A0B; --bad:#A23E27; --timer:#16201B; --timer-ink:#EEF0EC; --p0:#5F7180; --seg-ink:#FFFFFF;
  --f-display:"Inter Display","Inter",Roboto,system-ui,sans-serif;
  --f-body:"Inter",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --g0:#E2B44E; --g1:#55C3A2; --g2:#7FA8EC; --heavy:#EE8073; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; --p0:#9DB0BF; --seg-ink:#101412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --g0:#E2B44E; --g1:#55C3A2; --g2:#7FA8EC; --heavy:#EE8073; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; --p0:#9DB0BF; --seg-ink:#101412; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:14px 190px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
.chip.fill{background:var(--c);color:var(--bg);border-color:var(--c)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar button{border:0;background:none;padding:9px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button b{font-family:var(--f-display);font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] b{color:var(--g1)}

/* timer bar */
.tbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 10px 8px}
.tbar-in{max-width:740px;margin:0 auto;background:var(--timer);color:var(--timer-ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tbar .tl{font-size:14px;font-weight:700;line-height:1.25}
.tbar .tt{font-size:12.5px;opacity:.8;line-height:1.3}
.tbar .tc{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;text-align:right}
.tbar .tb{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tbar .tb button{flex:1;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;min-width:0}
.tbar.work .tbar-in{background:var(--heavy);color:var(--seg-ink)}
.tbar.warm .tbar-in,.tbar.easy .tbar-in{background:var(--p0);color:var(--seg-ink)}
.tbar.prep .tbar-in{background:var(--warn);color:var(--seg-ink)}
.tbar.done .tbar-in{background:var(--ok);color:var(--seg-ink)}
.tbar .tb .pp{flex:2}
/* big player for home routines: readable from the floor */
.tbar.big .tbar-in{padding:12px 14px 12px;gap:6px 12px}
.tbar .te{grid-column:1 / -1;font-size:13px;font-weight:800;letter-spacing:.02em;opacity:.85}
.tbar.big .tl{font-size:21px;line-height:1.2;align-self:center}
.tbar.big .tc{font-size:56px;grid-row:auto}
.tbar.big .tt{grid-column:1 / -1;font-size:16.5px;line-height:1.35;opacity:.95}
.tbar .tn{grid-column:1 / -1;display:flex;justify-content:space-between;gap:10px;font-size:13px;opacity:.85}
.tbar .tn span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbar.big .tb button{padding:10px 4px;font-size:15px}
.tbar.big .tb .pp{flex:1 0 100%;padding:12px 4px;font-size:18px}
body.tbig .wrap{padding-bottom:460px}
.tbar .prog{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.tbar .prog i{display:block;height:100%;background:currentColor;width:0}

/* ruler of 37 cycles and 8-day rota */
.ruler{display:grid;grid-template-columns:repeat(37,minmax(0,1fr));gap:2px;margin-top:12px}
.cell{border:0;padding:0;height:30px;border-radius:4px;background:var(--pc);opacity:.35;position:relative}
.cell.past{opacity:.6}
.cell[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.cell .tst{position:absolute;left:50%;top:-5px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);background:var(--heavy)}
.cell.today::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-bottom-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.weekhead{margin-top:12px;display:grid;gap:6px}
.weekhead .row h2{font-size:20px}
.rota{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:8px}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 1px 5px;display:grid;justify-items:center;gap:1px;min-width:0}
.dayb .n{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.dayb .k{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;max-width:100%}
.dayb .k b{display:block;font-family:var(--f-display);font-size:14px;color:var(--pc)}
.dayb .dt{font-size:10px;color:var(--muted)}
.dayb.work{background:var(--sunk)}
.dayb.work .k b{color:var(--muted)}
.dayb[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dayb.done .n::after{content:" ✓";color:var(--ok)}
.dayb.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* day */
.day{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-top{padding:16px 14px 14px;border-top:6px solid var(--pc);display:grid;gap:8px}
.day-top .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.day-top .big h2{font-size:30px;line-height:1.05}
.day-top h3{font-family:var(--f-body);font-weight:800;font-size:18px}
.tmline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:var(--sunk);border-radius:9px;padding:8px 10px}
.tmline b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.sec > h4{margin:0;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
details.sec > summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:800}
details.sec[open] > summary::after{content:"−"}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.step .sb{display:grid;gap:6px;min-width:0}
.step.on .st{opacity:.55}
.step.cur{background:var(--sunk);border-radius:10px;border-bottom-color:transparent;box-shadow:inset 4px 0 0 var(--pc);padding-inline:10px 6px;scroll-margin-top:12px}
.step .dur{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepshead{display:grid;gap:6px}
.st b{font-weight:700}
.foot{font-size:13.5px;color:var(--muted)}

/* exercise */
.group{display:grid;gap:8px;border-left:3px solid var(--pc);padding-left:9px}
.group.single{border-left-color:transparent;padding-left:0}
.gl{font-size:12.5px;color:var(--muted);font-weight:700}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0}
.ex.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ex.main{border-left:4px solid var(--pc)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 9px;align-items:start}
.lab{font-weight:800;font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 6px;color:var(--pc);font-variant-numeric:tabular-nums}
.ex-name{font-weight:800;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.ex-name .pg{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px;background:var(--sunk);color:var(--muted)}
.tag.swap{color:var(--g2)}
.sets{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;max-width:7.5em;text-wrap:balance}
.ex-load{font-size:14px}
.ex-rest{font-size:13px;color:var(--muted)}
.ex-note{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.sugg{font-size:14px;border-left:3px solid var(--ok);padding:4px 0 4px 9px}
.sugg b{font-size:16px}
.ex details{font-size:14px}
.ex details summary{cursor:pointer;color:var(--muted);font-weight:700}
.ex details > div{display:grid;gap:6px;margin-top:6px}
.setlist{display:grid;gap:6px}
.set{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 76px 42px;gap:6px;align-items:center}
.set.nowt{grid-template-columns:58px minmax(0,1fr) 76px 42px}
.set.norpe{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 44px}
.set.nowt.norpe{grid-template-columns:58px minmax(0,1fr) 44px}
.set .sl{font-size:12px;line-height:1.2;color:var(--muted);font-weight:700;min-width:0}
.set .sl b{display:block;color:var(--ink);font-size:13px}
.set.hv .sl b{color:var(--heavy)}
.set.skip{opacity:.5}
.set input,.set select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums;text-align:center}
.set select{padding:8px 2px}
.set .ok{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px}
.set.isdone .ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.isdone input,.set.isdone select{background:var(--sunk)}
.set.miss input{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.rowhint{grid-column:1 / -1;font-size:12px;color:var(--heavy);font-weight:600;margin-top:-2px}
.cond{border:1px solid var(--pc);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.cond .ch{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.cond ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.seglist{display:grid;gap:2px;max-height:220px;overflow:auto;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.seglist div{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;border-radius:5px}
.seglist div.cur{background:var(--sunk);font-weight:800}
.seglist div.past{opacity:.45}
.journal textarea,.field textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}

/* panels */
.panel{display:grid;gap:14px}
.panel h2{font-size:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-body);font-size:17px;font-weight:800}
.card.alert{border-color:var(--warn)}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;width:100%}
.field small{font-size:12px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:280px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.ex-grid{display:grid;gap:10px}
@media (min-width:700px){.ex-grid{grid-template-columns:1fr 1fr}}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.colors button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px}
.colors button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface)}
.banner{border-left:4px solid var(--c);background:var(--sunk);padding:9px 11px;border-radius:8px;font-size:14px}
.ztbl td.r{font-weight:700}
.log{display:grid;gap:4px;font-size:13.5px}
.log div{display:flex;gap:8px}
.log b.up{color:var(--ok)} .log b.dn{color:var(--bad)} .log b{min-width:52px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
@media (max-width:380px){.set{grid-template-columns:50px minmax(0,1fr) minmax(0,1fr) 60px 40px;gap:4px}.dayb .k{font-size:9.5px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="tbar" id="tbar" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <button type="button" data-tab="day"><b>Д</b>День</button>
  <button type="button" data-tab="progress"><b>↗</b>Прогресс</button>
  <button type="button" data-tab="ref"><b>Т</b>Техника</button>
  <button type="button" data-tab="profile"><b>П</b>Профиль</button>

длился — подход закончен.","err":"Отбив от груди ради скорости.","alt":""},"bench_neg":{"name":"Негативный жим лёжа","group":"Жим лёжа","page":"🟡 только со страхующим","wt":"bar","how":"Страхующий помогает снять штангу. Ты опускаешь её на грудь за 3–4 с по траектории жима, затем страхующий поднимает её вместе с тобой.","err":"Бросить штангу на грудь в последней трети.","alt":"Нет страхующего — жим с опусканием за 4 с и паузой на груди, 70% от максимума."},"board":{"name":"Жим лёжа с бруска ~10 см","group":"Жим лёжа","page":"🟡 как базовый жим","wt":"bar","how":"Брусок около 10 см лежит на груди. Опускай штангу до касания бруска и мощно выжимай. Траектория как в жиме, запястья прямые, ноги не переставляешь. Учит проходить «мёртвую точку» и привыкать к большим весам.","err":"Класть брусок на живот и менять траекторию.","alt":"Нет бруска — жим от упоров силовой рамы, выставленных на ~10 см выше груди."},"board15":{"name":"Жим лёжа с бруска 15 см","group":"Жим лёжа","page":"🟡 как базовый жим","wt":"bar","how":"Брусок около 15 см на груди или упоры рамы на этой высоте. Вес выше обычного — ЦНС привыкает к нему в короткой амплитуде.","err":"","alt":"Слингшот, если он у тебя есть."},"sling":{"name":"Жим в слингшоте","group":"Жим лёжа","page":"⚪ по желанию","wt":"bar","how":"Только при мягком слингшоте и страхе больших весов — так советует сам гайд. Слингшот надевается на локти и помогает внизу. Страхующий обязателен.","err":"","alt":"Нет слингшота или страха веса — пропусти."},"cg_bench":{"name":"Жим узким хватом","group":"Грудь и трицепс","page":"🟡 как базовый жим","wt":"bar","how":"Хват чуть уже плеч, локти вдоль корпуса. Опускай к низу груди и выжимай без отбива; вверху без рывка в локтях. Стопы — как в основном жиме.","err":"Локти расходятся в стороны — нагрузка уходит в грудь.","alt":"Ноют запястья — EZ-гриф или гантели нейтральным хватом."},"mg_bench":{"name":"Жим средним хватом","group":"Грудь и трицепс","page":"🟡 как базовый жим","wt":"bar","how":"Хват на ладонь уже епс","page":"🟢 скамья и гантели","wt":"db","how":"Как разводка лёжа, но на скамье 30°. Локти к полу, поясница не прогибается.","err":"","alt":"Сведение рук в кроссовере снизу вверх."},"cg_pushups":{"name":"Отжимания от пола узкие","group":"Грудь и трицепс","page":"🟢 свой вес","wt":"bw","how":"Ладони чуть уже плеч, локти вдоль корпуса. Тело — прямая линия: ягодицы и пресс напряжены, поясница не провисает. Опускайся почти до пола.","err":"Провисшая поясница.","alt":"Поясница провисает — отжимания от скамьи."},"french":{"name":"Французский жим лёжа (EZ-гриф)","group":"Грудь и трицепс","page":"🟢 лёжа на скамье","wt":"pl","how":"Лёжа, гриф над лбом на прямых руках. Плечи неподвижны: сгибай только локти, опуская гриф ко лбу, пауза 1 с, разгибай. Вес записывай вместе с грифом.","err":"Локти разъезжаются в стороны.","alt":"Ноют локти — разгибание на блоке с канатом."},"ohp_seat":{"name":"Жим штанги сидя, спинка 75–80°","group":"Плечи","page":"🟡 спина прижата","wt":"bar","how":"Спинку поставь на 75–80°, не вертикально — так поясница меньше прогибается. Ягодицы и лопатки прижаты, рёбра опущены. Опускай гриф к верху груди, выжимай над головой, голову не запрокидывай. Удобнее в Смите.","err":"Поясница отходит от спинки, грудь выталкивается вперёд — это уже жим стоя.","alt":"Поясница не держится — спинка 60° или жим гантелей сидя."},"db_seated":{"name":"Жим гантелей сидя, спинка 75–80°","group":"Плечи","page":"🟡 спина прижата","wt":"db","how":"Спинка 75–80°, гантели у плеч, локти чуть впереди корпуса. Жми вверх, не стукая гантели. Поясница прижата к спинке, рёбра опущены.","err":"Прогиб в пояснице на последних повторах.","alt":"Тренажёр жима сидя."},"lat_raise":{"name":"Махи гантелями в стороны сидя","group":"Плечи","page":"🟢 сидя","wt":"db","how":"Сидя на скамье, гантели по бокам. Поднимай руки в стороны до уровня плеч, локти чуть согнуты, плечи не тянутся к ушам. Опускай 2 с.","err":"Раскачка корпусом и подъём выше плеч.","alt":"Подъём руки в сторону в кроссовере."},"rev_curl":{"name":"Сгибание обратным хватом (EZ)","group":"Руки","page":"🟢 опора","wt":"pl","how":"Хват сверху, локти у боков. Сгибай только в локтях, без толчка бёдрами. Удобнее на скамье Скотта. Вес записывай вместе с грифом.","err":"Локти уходят вперёд, корпус раскачивается.","alt":"Сгибание на нижнем блоке обратным хватом."},"db_curl":{"name":"Сгибание с гантелями сидя","group":"Руки","page":"🟢 сидя со спинкой","wt":"db","how":"Сидя, спина на спинке. Сгибай руки с супинацией (мизинец вверх), локти неподвижны, опускай 2 с.","err":"Раскачка корпусом.","alt":""},"hammer":{"name":"Молотки сидя","group":"Руки","page":"🟢 сидя со спинкой","wt":"db","how":"Сидя, спина на спинке, гантели нейтральным хватом. Сгибай вместе или поочерёдно, локти неподвижны, без раскачки.","err":"","alt":"Молотки на скамье Скотта."},"wrist_curl":{"name":"Сгибание кистей со штангой сидя","group":"Руки","page":"🟢 сидя","wt":"pl","how":"Предплечья на бёдрах или на скамье, кисти свисают. Сгибай кисти вверх, опускай до растяжения. Медленно, без рывков.","err":"","alt":""},"ez_empty":{"name":"Сгибание на бицепс — пустой гриф","group":"Руки","page":"🟢 без веса","wt":"bw","how":"Гриф без блинов, быстро вверх, медленно вниз. Прокачка крови, не нагрузка.","err":"","alt":""},"seatrow":{"name":"Горизонтальная тяга блока","group":"Спина","page":"🟢 блок","wt":"mc","how":"Сидя, стопы в упоре, колени чуть согнуты, корпус вертикален и неподвижен. Тяни рукоять к поясу, сводя лопатки, пауза 1 с; отпускай до прямых рук без наклона вперёд.","err":"Раскачка корпусом вперёд-назад — работает поясница.","alt":"Рычажная тяга сидя."},"cs_db_row":{"name":"Тяга гантели лёжа грудью на скамье","group":"Спина","page":"🟢 с упором грудью","wt":"db","how":"Ляг грудью на скамью 30–45°, гантели в опущенных руках. Тяни к поясу, сводя лопатки, локти вдоль корпуса, пауза 1 с. Грудь не отрывается от скамьи. Одной рукой — поочерёдно, двумя — одновременно.","err":"Отрыв груди и рывок поясницей.","alt":"Рычажная тяга одной рукой."},"pullup_cg":{"name":"Подтягивания узким хватом","group":"Спина","page":"🟢 или в гравитроне","wt":"gv","how":"Нейтральный или узкий хват. Из виса с опущенными плечами тянись грудью к перекладине, опускайся 2 с до прямых рук, без раскачки. Не выходит нужное число — гравитрон: впиши противовес, приложение будет его убавлять.","err":"Рывки, «кипинг», неполная амплитуда.","alt":"Вертикальная тяга узким хватом."},"pullup_wg":{"name":"Подтягивания широким хватом","group":"Спина","page":"🟢 или в гравитроне","wt":"gv","how":"Хват шире плеч, тянись грудью к перекладине, локти к бокам, лопатки сводятся. Только к груди, не за голову. Не выходит нужное число — гравитрон: впиши противовес.","err":"Подтягивания за голову — при шейных протрузиях запрещены.","alt":"Вертикальная тяга широким хватом."},"pullup_neg":{"name":"Негативные подтягивания","group":"Спина","page":"🟢 свой вес","wt":"bw","how":"Запрыгни или встань на опору так, чтобы подбородок был над перекладиной, и опускайся 4–5 с до прямых рук.","err":"Падение вниз в конце.","alt":"Гравитрон с медленным опусканием."},"leg_ext":{"name":"Разгибание ног в тренажёре","group":"Ноги и ягодицы","page":"🟢 тренажёр","wt":"mc","how":"Спинку настрой так, чтобы колени упирались в край сиденья, а крестец был прижат к спинке. Валик — над стопой. Разгибай ноги без подскоков и инерции, пауза вверху.","err":"Отрыв таза от сиденья на тяжёлых повторах.","alt":""},"leg_curl":{"name":"Сгибание ног лёжа","group":"Ноги и ягодицы","page":"🟢 тренажёр","wt":"mc","how":"Лёжа лицом вниз, валик чуть выше пяток, таз прижат. Сгибай ноги к ягодицам, короткая пауза, опускай медленно.","err":"Таз поднимается, поясница прогибается.","alt":"Сгибание ног сидя или на фитболе."},"goblet_box":{"name":"Гоблет-присед на скамью","group":"Ноги и ягодицы","page":"🟡 гиря у груди","wt":"kb","how":"Гантель держи вертикально: обе ладони под верхним блином, как чашу, гантель прижата к груди, локти смотрят вниз — так удерживается 30–40 кг (гирю — за рога). Скамья на высоте колена. Садись назад и вниз, мягко касаешься скамьи — встаёшь. Спина ровная, колени над стопами. Стало легко, а тяжелее не удержать — не гонись за весом, замедлись: 3 с вниз, пауза 2 с на скамье без расслабления, вверх; или пятки на блины 2,5 кг. Запас отмечай честно.","err":"Плюхнуться на скамью и округлить поясницу.","alt":"Приседания без веса на скамью."},"meditation":{"name":"Медитация в зале","group":"Кор и спина","page":"🟢","wt":"none","how":"Пришёл в зал, 10 минут лёгкого велосипеда, разминка суставов, ушёл. В гайде это «тренировка воли» перед проходкой: ты пришёл, несмотря ни на что.","err":"","alt":""},"tbar_cs":{"name":"Тяга Т-грифа с упором грудью","group":"Спина","page":"🟢 зелёный список — главная тяга","wt":"pl","how":"Грудь плотно на подушке, стопы на платформе. Нейтральный хват, сведи лопатки и тяни к низу груди, локти вдоль корпуса. Пауза 1 с вверху, опускай под контролем до прямых рук, не отрывая грудь от подушки.","err":"Отрыв груди от подушки и рывок поясницей.","alt":"Тренажёр занят — рычажная тяга."},"latpd":{"name":"Тяга верхнего блока к груди","group":"Спина","page":"🟢 зелёный список — блок","wt":"mc","how":"Бёдра под валиками, корпус вертикален или с наклоном назад до 10°. Тяни рукоять к верху груди, опуская лопатки; вверху выпрямляй руки полностью. Хват — как в жиме лёжа, если в плане не сказано иначе. Только к груди, никогда за голову.","err":"Раскачка и откидывание корпуса назад, чтобы «досадить» вес.","alt":"Нет широкой рукояти — нейтральный хват."},"dips_grav":{"name":"Брусья в гравитроне","group":"Грудь и трицепс","page":"🟡 неглубоко, только с противовесом","wt":"gv","how":"Колени на платформе, корпус вертикален, плечи опущены. Опускайся, пока плечо не станет параллельно полу, — не глубже; выжимайся без раскачки. Прогресс — меньше противовеса. Ноют плечи — упражнение пропускается.","err":"Слишком глубокое опускание и поднятые к ушам плечи.","alt":"Болят плечи — разгибание на трицепс с канатом."},"tri_rope":{"name":"Разгибание рук на блоке с канатом","group":"Грудь и трицепс","page":"🟢 зелёный список — блок","wt":"mc","how":"Стоя у верхнего блока, локти прижаты к бокам. Разгибай руки, разводя концы каната внизу, пауза 1 с. Корпус неподвижен, без наклона.","err":"Локти уходят вперёд, работает корпус.","alt":"Разгибание с прямой рукоятью."},"ez_scott":{"name":"Сгибание EZ-грифа на скамье Скотта","group":"Руки","page":"🟢 зелёный список — опора","wt":"pl","how":"Подмышки на краю подушки, локти на подушке. Сгибай руки, опускай 3 с почти до прямых, не разгибая полностью под весом. Вес записывай вместе с грифом.","err":"Отрыв локтей и рывок корпусом.","alt":"Сгибание на нижнем блоке."},"hipthrust":{"name":"Ягодичный мост со штангой (Смит)","group":"Ноги и ягодицы","page":"🟡 с подушкой, без прогиба","wt":"sm","how":"Спина на краю скамьи на уровне лопаток, гриф на мягкой подушке в сгибе бёдер, стопы на ширине таза. Подкрути таз, выдохни и подними таз до прямой линии плеч, таза и коленей; голени вертикальны. Вверху таз подкручен, поясница не прогибается. Опускайся под контролем.","err":"Переразгибание поясницы вверху вместо работы ягодиц.","alt":"Нет Смита — штанга с толстой подушкой. Ноет поясница — ягодичный мост на полу с гантелью на бёдрах. Упражнение — в списке для согласования с врачом."},"split_db":{"name":"Сплит-присед с гантелями","group":"Ноги и ягодицы","page":"🟡 гантели в опущенных руках","wt":"db","how":"Длинный шаг, гантели в опущенных руках, корпус вертикален. Опускайся прямо вниз, пока заднее колено почти не коснётся пола; переднее колено над стопой. Поднимайся за счёт передней ноги. На старте суммарный вес гантелей — до 30% веса тела.","err":"Наклон вперёд и толчок задней ногой.","alt":"Ноет поясница — без гантелей или придерживаясь за стойку. Упражнение — в списке для согласования с врачом."},"wide_box_squat":{"name":"Широкий присед на скамью","group":"Ноги и ягодицы","page":"🟡 по желанию в профиле — до 60–70 кг, гриф не на шее","wt":"bar","how":"Скамья на высоте колена. Стопы шире плеч, носки развёрнуты на 30–45°. Гриф — специальный для приседа (safety squat bar), если он есть в зале; если нет — низко на трапециях, не на шее. Вдохни животом и напряги пресс, садись назад и вниз до мягкого касания скамьи, не расслабляясь на ней, и вставай, разводя колени и сжимая ягодицы. Вверху рёбра опущены, поясница не прогибается. Все подходы с запасом 3–4, без отказа.","err":"Плюхнуться на скамью и расслабить корпус; прогнуть поясницу или откинуться назад вверху.","alt":"Что-то отдаёт в ногу или на следующий день боль в спине выше 3 из 10 — сразу обратно на сплит-присед: Профиль → Присед."},"band_pullapart":{"name":"Разведение жгута перед грудью","group":"Плечи","page":"🟢 зелёный список — жгут","wt":"band","how":"Стоя, жгут в прямых руках на уровне плеч, хват на ширине плеч. Разведи руки в стороны до касания жгутом груди: лопатки сводятся и опускаются, плечи не поднимаются к ушам. Медленно верни. Тренирует середину спины и заднюю дельту — опору для жима.","err":"Прогиб в пояснице и поднятые плечи.","alt":"Нет жгута — то же движение с лёгкими гантелями лёжа грудью на наклонной скамье."},"band_facepull":{"name":"Тяга жгута к лицу","group":"Плечи","page":"🟢 зелёный список — жгут","wt":"band","how":"Жгут закреплён на уровне лица. Тяни концы к лицу, разводя локти в стороны и держа их выше кистей; в конце разверни кисти назад, как в позе «двойной бицепс». Пауза 1 с. Задняя дельта и вращательная манжета — то, что разгружает плечи после жима.","err":"Тянуть локтями вниз и откидываться корпусом назад.","alt":"В зале — то же движение на блоке с канатом."},"band_er":{"name":"Наружная ротация плеча со жгутом","group":"Плечи","page":"🟢 зелёный список — жгут","wt":"band","how":"Стоя боком к закреплённому жгуту, локоть прижат к боку и согнут под 90°, между локтем и корпусом свёрнутое полотенце. Разворачивай предплечье наружу, не отрывая локоть, и медленно возвращай. Лёгкое сопротивление, без боли.","err":"Локоть уходит от корпуса, движение делает спина.","alt":"Нет жгута — лёжа на боку с гантелью 1–2 кг."},"bridge":{"name":"Ягодичный мост со жгутом","group":"Ноги и ягодицы","page":"🟢 зелёный список","wt":"band","how":"Лёжа на спине, стопы на ширине таза, жгут над коленями. Подкрути таз, выдохни и подними его за счёт ягодиц до прямой линии плеч, таза и коленей. Колени давят в жгут наружу. Вверху пауза, опускайся медленно.","err":"Подъём слишком высоко с прогибом в пояснице — ягодицы при этом выключаются.","alt":"Нет жгута — без него, сжимая ягодицы вверху."},"fitball_curl":{"name":"Сгибание ног на фитболе в мосте","group":"Ноги и ягодицы","page":"🟢 зелёный список — фитбол","wt":"bw","how":"Лёжа на спине, пятки на фитболе. Подними таз до прямой линии и, удерживая таз, подкати мяч пятками к себе, затем откати. Таз не опускается и не прогибается. Сложнее — откатывай 3 с.","err":"Таз проваливается на каждом повторе.","alt":"Тяжело — таз опускается между повторами."},"curlup":{"name":"Скручивание по Макгиллу (curl-up)","group":"Кор и спина","page":"🟢 зелёный список — вместо скручиваний","wt":"bw","how":"Лёжа на спине, одна нога согнута, другая прямая; ладони под поясницей, чтобы сохранить её естественный изгиб. Напряги пресс, как перед ударом в живот, и приподними голову и плечи на 2–3 см как одно целое — без сгибания шеи и поясницы. Держи 10 с, дыши коротко. Схема 6-4-2: 6 удержаний, отдых, 4, отдых, 2; на середине поменяй ноги. Сложнее — локти подняты над полом; ещё сложнее — глубокий вдох и выдох прямо во время удержания.","err":"Подбородок к груди и подъём корпуса высоко — это уже обычное скручивание.","alt":"Тянет шею (протрузии в шейном отделе) — голова остаётся на полу, напрягается только пресс."},"splank":{"name":"Боковая планка","group":"Кор и спина","page":"🟢 зелёный список — вместо тренажёра для косых","wt":"bw","how":"Лёжа на боку, локоть под плечом. Подними таз, чтобы голова, таз и колени (или стопы) были на одной линии; живот напряжён, таз не уходит назад. Держи 10 с, опусти на 2–3 с и повтори. С колен — колени согнуты; полная — опора на стопы, верхняя впереди; сложный вариант — с поднятой верхней ногой.","err":"Таз проваливается или уходит назад, плечо «висит».","alt":"Болит плечо — стоя у стены, опираясь на неё предплечьем."},"birddog":{"name":"«Птица-собака» (bird dog)","group":"Кор и спина","page":"🟢 зелёный список — вместо гиперэкстензий","wt":"bw","how":"На четвереньках, ладони под плечами, колени под тазом, спина ровная. Напряги пресс и вытяни вперёд руку, а назад противоположную ногу — до горизонтали, не выше. Держи 8 с, сжимая кулак и ягодицу, верни и поменяй стороны. Сложнее — «квадраты»: рисуй рукой и ногой небольшие квадраты, не двигая поясницей.","err":"Нога выше горизонтали, прогиб в пояснице, таз поворачивается.","alt":"Трудно держать равновесие — поднимай только ногу."},"breath9090":{"name":"Дыхание 90/90 у стены","group":"Мобильность","page":"🟢 зелёный список","wt":"none","how":"Лёжа на спине, стопы на стене, колени и бёдра согнуты под 90°. Слегка прижми пятки к стене и подкрути таз — поясница мягко ложится на пол. Вдох носом 4 с, рёбра расходятся в стороны, а не вверх; выдох ртом 6–8 с до конца, рёбра опускаются; пауза 2 с. Вариант со жгутом над коленями — колени мягко давят в стороны.","err":"Прогиб в пояснице на вдохе и подъём рёбер к подбородку.","alt":"Нет стены — голени на стуле или диване."},"hipflex":{"name":"Растяжка сгибателя бедра в полувыпаде","group":"Мобильность","page":"🟢 зелёный список","wt":"none","how":"Колено задней ноги на мягком, передняя стопа впереди, корпус вертикален. Подкрути таз (копчик вниз) и сожми ягодицу задней ноги — растяжение появится спереди бедра. Подавайся вперёд на 2–3 см, не прогибая поясницу. Сложнее — наклон корпуса в сторону передней ноги.","err":"Подача таза вперёд с прогибом в пояснице: растягивается поясница, а не мышца.","alt":"Больно колену — подложи сложенное полотенце или делай стоя у опоры."},"couch":{"name":"Растяжка у дивана с подкрученным тазом","group":"Мобильность","page":"🟢 зелёный список","wt":"none","how":"Колено задней ноги у спи йда 150. Норвежские 4 × 4 сильнее всего поднимают МПК (VO2max), а он лучше всего показывает, насколько здорово сердце.","<b>Сколько.<\/b> Минута интервалов идёт за две минуты спокойной работы. Без крутилки за цикл выходит около 2 часов кардио — 105–115 минут в неделю. С лёгкой крутилкой после первых смен — 135–150 минут в неделю, почти норма ВОЗ: 150 минут умеренной нагрузки в неделю.","<b>Смена кардио не заменяет:<\/b> 12 часов работы держат пульс высоким без отдыха, а сердце крепнет от тренировки с восстановлением после неё.","<b>Как понять, что работает:<\/b> за 2–3 месяца пульс покоя по утрам снижается на 3–8 ударов, а тот же темп на велосипеде даётся при меньшем пульсе. Записывай пульс покоя в профиль раз в цикл."],"restWhy":"Сегодня без зала: между силовыми три дня, и перед сменами спине нужен свежий день. Прогулка разгоняет кровь и «кормит» диски, мостик и тройка Макгилла держат ягодицы и корпус в тонусе.","layout":3}</script>

/* ================= план =================

   с цикла from — гайд 150 заново столько кругов, сколько выбрано; проходка каждого круга — максимум следующего. */
var DG = DATA.guides, DDAYS = DATA.days;

function applyPlan(){
  var p = S.profile.plan;
  if(!p || p.type !== "150"){
    G = DG.map(function(g, i){ return {id:g.id, key:g.id, name:g.name, weeks:g.weeks, len:g.weeks, col:i}; });
    DAYS = DDAYS;
  } else {
    var st = [], days = [], c = 0, rounds = Math.max(1, Math.min(6, (p.rounds | 0) || 3)), pre = Math.max(0, (p.from | 0) - 1), a = 0;
    /* аэробная база: если гайд 100 пройден меньше чем на 8 циклов, первые 4 кардио круга 1 — зона 2 (45 → 60 мин), как в гайде 100, интервалы — потом */
    var base = pre < 8;
    var push = function(stage, src){
      var gi = st.length; st.push(stage);
      for(var w = 1; w <= stage.len; w++){
        c++;
        for(var i = 0; i < 8; i++){
          var o = DDAYS[(src + w - 2) * 8 + i], x = Object.assign({}, o, {d:(c - 1) * 8 + i + 1, c:c, g:gi, w:w});
          if(base && stage.round === 1 && w <= 4 && o.kind === "cardio"){

            x.cardio = z.cardio; x.title = z.title; x.why = "Перед интервалами — месяц спокойной зоны 2: сердце и сосуды привыкают к нагрузке. Интервалы 4 × 4 начнутся с 5-го цикла круга."; x.red = z.red;

    DG.forEach(function(g, i){ var n = Math.max(0, Math.min(g.weeks, pre - a)); if(n) push({id:g.id, key:g.id, name:g.name, weeks:g.weeks, len:n, col:i}, a + 1); a += g.weeks; });
    var w150 = DG.filter(function(g){ return g.id === "150"; })[0].weeks, s150 = dStart("150");
    for(var r = 1; r <= rounds; r++) push({id:"150", key:r === 1 ? "150" : "150r" + r, name:"Гайд 150 · круг " + r, weeks:w150, len:w150, col:1, round:r}, s150 + 1);
    G = st; DAYS = days;

/* ================= мелочи ================= */
function fkg(x){ if(x == null || x === "" || !isFinite(x)) return ""; return String(Math.round(x * 100) / 100).replace(".", ","); }
function pnum(v){ if(v === "" || v == null) return null; var x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : null; }
function r1(x){ return Math.round(x * 10) / 10; }
function nearest(x, st){ return Math.max(0, Math.round(Math.ceil(x / st - 0.5 - 1e-9) * st * 100) / 100); } /* ничьи — вниз: не жадничай */

var WIDE = {};
function itemsOf(day){

  if(S.profile.squat !== "wide" || !base.some(function(it){ return it.wide; })) return base;

}
function rowsOf(it){
  if(it._rows) return it._rows;

  if(it.P) it.P.forEach(function(x){ for(var i = 0; i < x[2]; i++) out.push({p:x[0], r:x[1]}); });
  else if(it.W) for(var i = 0; i < it.W[1]; i++) out.push({r:it.W[0]});
  else if(it.B) for(var j = 0; j < it.B[1]; j++) out.push({r:it.B[0]});

}
function setKey(it, idx){ return idx + ":" + it.ex; }
function allRows(day, it, idx){ var base = rowsOf(it); if(it.role !== "test") return base; var n = rec(day.d).extra[setKey(it, idx)] || 0, out = base.slice(); for(var i = 0; i < n; i++) out.push({p:null, r:1, extra:true}); return out; }

function nameOf(it){ return it.name || (EX[it.ex] ? EX[it.ex].name : it.ex === "core" ? "Тройка Макгилла" : it.ex); }

/* ================= расчёт: таблица «повторы до отказа → % от максимума» ================= */
var P10 = [0,100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.7,69.4,67.2,65,62.8,60.6,58.4,56.2,54,51.8,49.6];
function pctAt(n){ n = Math.max(1, Math.min(21, n)); var lo = Math.floor(n), hi = Math.ceil(n); return P10[lo] + (P10[hi] - P10[lo]) * (n - lo); }
function e1(w, r, q){ return w * 100 / pctAt(r + (q == null ? 0 : q)); }
function repsAt(p){ for(var n = 1; n < 21; n++){ if(P10[n + 1] < p) return n + (P10[n] - p) / (P10[n] - P10[n + 1]); } return 21; }

var CACHE = {};
/* рабочий максимум гайда: старт — из профиля или проходки; дальше (адаптивный режим) — поправки после каждой жимовой тренировки */
function testInfo(gi){
  var k = "test" + gi; if(k in CACHE) return CACHE[k];
  var rng = gDays(gi), best = null;
  for(var d = rng.from; d <= rng.to; d++){
    var day = DAYS[d - 1], r = S.days[key(d)]; if(!day.test || !r) continue;
    itemsOf(day).forEach(function(it, idx){ if(it.role !== "test") return; (r.sets[setKey(it, idx)] || []).forEach(function(s){ if(s && s.done && s.w && s.r >= 1 && (!best || s.w > best.w)) best = {w:s.w, d:d}; }); });
  }
  return (CACHE[k] = best);
}
function guideBase(gi){
  var man = pnum(S.profile["max" + (G[gi].key || G[gi].id)]);
  if(man) return {v:man, why:"из профиля"};
  if(gi === 0){ var m0 = pnum(S.profile.max100); return m0 ? {v:m0, why:"из профиля"} : {v:105, why:"стартовая оценка"}; }
  var t = testInfo(gi - 1); if(t) return {v:t.w, why:"проходка: " + G[gi - 1].name};
  var prev = tmState(gi - 1).end, pg = G[gi - 1];
  return {v:prev, why:(pg.len < pg.weeks ? "максимум на момент перехода с гайда " + pg.id : "проходки ещё нет — итог: " + pg.name)};
}
function tmState(gi){
  var k = "tm" + gi; if(k in CACHE) return CACHE[k];
  var base = guideBase(gi), tm = base.v, ev = [], rng = gDays(gi);
  if(S.profile.mode !== "strict"){
    for(var d = rng.from; d <= rng.to; d++){
      var day = DAYS[d - 1], r = S.days[key(d)]; if(day.kind !== "gym" || !r || !r.sets) continue;
      var v = benchVerdict(day, r, tm); if(!v) continue;
      if(v.delta) tm = Math.round((tm + v.delta) * 100) / 100;
      ev.push({d:d, delta:v.delta, after:tm, why:v.why});
    }
  }
  return (CACHE[k] = {base:base, ev:ev, end:tm});
}
function tmAt(d){
  var day = DAYS[d - 1], st = tmState(day.g), tm = st.base.v, log = [];
  st.ev.forEach(function(e){ if(e.d < d){ tm = e.after; log.push(e); } });
  return {tm:tm, base:st.base, log:log};
}
function benchVerdict(day, r, tm){
  var miss = 0, est = null, lb = null, n = 0, sample = "";
  itemsOf(day).forEach(function(it, idx){
    if(it.role !== "main" || it.ex !== "bench") return;
    var arr = r.sets[setKey(it, idx)] || [];
    rowsOf(it).forEach(function(row, i){
      var s = arr[i]; if(!s || !s.done || !s.w || s.r == null) return; n++;
      if(s.r < row.r) miss++;
      if(s.q == null) return;
      if(s.q <= 3){ var e = e1(s.w, s.r, s.q); if(est == null || e > est){ est = e; sample = fkg(s.w) + " × " + s.r + ", запас " + s.q; } }
      else { var l = e1(s.w, s.r, 4); if(lb == null || l > lb){ lb = l; if(est == null) sample = fkg(s.w) + " × " + s.r + ", запас 4+"; } }
    });

    if(est >= tm + 5 && !yellow) return {delta:2.5, why:sample + " → максимум ≈ " + fkg(r1(est)) + " кг, выше расчётного"};
    if(est <= tm - 7.5) return {delta:-2.5, why:sample + " → максимум ≈ " + fkg(r1(est)) + " кг, ниже расчётного"};
    return {delta:0, why:sample + " → максимум ≈ " + fkg(r1(est)) + " кг, всё по плану"};
  }
  if(lb != null && lb >= tm + 5 && !yellow) return {delta:2.5, why:"все подходы с запасом 4+ — расчётный максимум занижен"};
  return {delta:0, why:"повторы выполнены; отметь «запас» — тогда приложение точнее оценит максимум"};
}

/* история упражнения */
function lastSessions(ex, beforeD, max){
  var out = [];
  for(var d = beforeD - 1; d >= 1 && out.length < (max || 2); d--){
    var day = DAYS[d - 1], r = S.days[key(d)]; if(day.kind !== "gym" || !r || !r.sets) continue;
    var items = itemsOf(day);
    for(var idx = 0; idx < items.length; idx++){
      var it = items[idx]; if(it.ex !== ex || it.role === "main" || it.role === "test" || it.role === "farewell") continue;
      var arr = r.sets[setKey(it, idx)] || [];
      if(arr.some(function(s){ return s && s.done && (s.w != null || s.r != null); })){ out.push({d:d, it:it, sets:arr, rows:rowsOf(it), rir:rirOf(it)}); break; }
    }
  }
  return out;
}
function sessE(s){
  var best = null;
  s.sets.forEach(function(x, i){ if(!x || !x.done || !x.w || !x.r) return; var e = e1(x.w, x.r, x.q != null ? x.q : s.rir); if(best == null || e > best) best = e; });
  return best;
}
function accEst(ex, beforeD){
  var k = "acc" + ex + ":" + beforeD; if(k in CACHE) return CACHE[k];
  var ss = lastSessions(ex, beforeD, 2), res = null;
  if(ss.length){
    var E0 = sessE(ss[0]);
    if(E0 != null){
      if(ss[1]){ var E1 = sessE(ss[1]); if(E1) E0 = Math.max(E1 * 0.92, Math.min(E1 * 1.08, E0)); }
      res = {est:E0, s:ss[0]};
    }
  }
  return (CACHE[k] = res);
}
function sessLine(s){
  var x = s.sets.filter(function(q){ return q && q.done && q.w; })[0]; if(!x) return "";
  var tool = toolOf(s.it);
  return "день " + s.d + ": " + (tool === "db" ? "2×" : "") + fkg(x.w) + " кг × " + x.r + (x.q != null ? ", запас " + (x.q >= 4 ? "4+" : x.q) : "");
}
function lastWorkW(s){ var x = s.sets.filter(function(q){ return q && q.done && q.w; }); return x.length ? x[0].w : null; }
function sessMiss(s){ return s.sets.some(function(x, k){ return x && x.done && x.r != null && s.rows[k] && x.r < s.rows[k].r; }); }

/* подстройка внутри тренировки — по уже сделанным подходам этого упражнения */
function inSession(day, it, idx, i, st, rir){
  var arr = rec(day.d).sets[setKey(it, idx)] || [], rows = rowsOf(it), first = null, last = null, lastJ = -1;
  for(var j = 0; j < i; j++){ var s = arr[j]; if(s && s.done && s.w != null){ if(!first) first = {s:s, j:j}; last = s; lastJ = j; } }
  if(!last) return null;
  var row = rows[lastJ] || {}, miss = last.r != null && row.r != null && last.r < row.r;
  if(miss || (last.q != null && last.q <= rir - 2)) return {w:floorTo(last.w * 0.9, st), why:"прошлый подход тяжелее цели — −10%"};
  if(first.j === lastJ && last.q != null && last.q >= rir + 2) return {w:Math.round((last.w + st) * 100) / 100, why:"первый подход легче цели — +" + fkg(st) + " кг"};
  return {w:last.w, why:"как прошлый подход"};
}

/* подсказка веса для подхода i */

  return "Отдых " + restRange(vals) + (it.rk === "bm" && Math.max.apply(null, vals) > Math.min.apply(null, vals) ? " — чем тяжелее подход, тем дольше" : "") + ". Тяжёлый подход — таймер добавит";

  if(lsGet(LS5)) oldBtns.appendChild(h("button", {type:"button", class:"btn ghost sm", text:"Сохранить записи версии 5", onclick:function(){ exportOld(LS5, "bl5", "bruce-lee-5-records-"); }}));

  panel.appendChild(h("div", {class:"card"}, [h("h3", {text:"Резервная копия"}), h("p", {class:"small muted", text:NATIVE ? "Записи хранятся в телефоне. Делай копию раз в неделю: она сохранится в «Загрузки». Обновления приложения записи не стирают, а удаление — стирает." : "Копия нужна, чтобы перенести записи в Android-приложение."}),
    h("div", {class:"row"}, [h("button", {type:"button", class:"btn", text:"Сохранить копию", onclick:exportData}), h("button", {type:"button", class:"btn ghost", text:"Загрузить из файла", onclick:function(){ imp.click(); }}), imp]),
    h("div", {class:"field"}, [ta]), h("div", {class:"row"}, [h("button", {type:"button", class:"btn ghost sm", text:"Загрузить из текста", onclick:function(){ importData(ta.value); }})]), oldBtns.childNodes.length ? oldBtns : null]));
  panel.appendChild(h("p", {class:"tiny muted", text:"Брюс Ли 6.1 · жим по Сарычеву на графике 2/2" + (NATIVE ? " · версия " + safeVersion() : " · веб-версия")}));

function safeVersion(){ try{ return NATIVE.version(); }catch(e){ return ""; } }
function exportOld(lsKey, app, prefix){
  var old = null; try{ old = JSON.parse(lsGet(lsKey) || "null"); }catch(e){}
  if(!old){ toast("Записей нет"); return; }
  var json = JSON.stringify({app:app, v:1, saved:new Date().toISOString(), data:old});

function exportData(){
  var json = JSON.stringify({app:"bl6", v:1, saved:new Date().toISOString(), data:S});
  var name = "bruce-lee-6-" + isoToday() + ".json";
  if(NATIVE){ var p = ""; try{ p = NATIVE.saveBackup(json, name); }catch(e){} toast(p ? "Сохранено: " + p : "Не удалось сохранить файл"); return; }

function importData(txt){
  try{
    var o = JSON.parse(txt), d = o && o.data ? o.data : o;

    var mine = !o.app || o.app === "bl6";

    else { ["rhr","age","hrmax","bw","stepDb","stepMc","sound","watch"].forEach(function(k){ if(d.profile[k] != null && d.profile[k] !== "") S.profile[k] = d.profile[k]; }); }
    if(d.body && d.body.length) S.body = d.body;

  }catch(e){ toast("Не похоже на резервную копию"); }
}

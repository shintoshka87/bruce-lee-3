<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Брюс Ли 4.0</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url("fonts/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:600;src:url("fonts/Inter-SemiBold.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("fonts/Inter-Bold.otf")}
@font-face{font-family:"Inter";font-weight:800;src:url("fonts/Inter-ExtraBold.otf")}
@font-face{font-family:"Inter Display";font-weight:800;src:url("fonts/InterDisplay-ExtraBold.otf")}
/* Layout: a gym logbook app. Bottom tab bar; the Day screen is a stack of interactive sections; one timer bar docks above the tabs. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E8E2; --ink:#16201B; --muted:#56635C; --line:#D3D9D1;
  --p0:#5F7180; --p1:#1D7560; --p2:#A23E27; --p3:#9A6A0B; --dl:#7E8781;
  --ok:#1D7560; --warn:#9A6A0B; --bad:#A23E27; --timer:#16201B; --timer-ink:#EEF0EC;
  --f-display:"Inter Display","Inter",Roboto,system-ui,sans-serif;
  --f-body:"Inter",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:14px 190px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
.chip.fill{background:var(--c);color:var(--bg);border-color:var(--c)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar button{border:0;background:none;padding:9px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button b{font-family:var(--f-display);font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] b{color:var(--p1)}

/* timer bar */
.tbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 10px 8px}
.tbar-in{max-width:740px;margin:0 auto;background:var(--timer);color:var(--timer-ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tbar .tl{font-size:14px;font-weight:700;line-height:1.25}
.tbar .tt{font-size:12.5px;opacity:.8;line-height:1.3}
.tbar .tc{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;text-align:right}
.tbar .tb{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tbar .tb button{flex:1;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;min-width:0}
.tbar.work .tbar-in{background:var(--p2);color:#fff}
.tbar.warm .tbar-in,.tbar.easy .tbar-in{background:var(--p0);color:#fff}
.tbar.done .tbar-in{background:var(--ok);color:#fff}
.tbar .prog{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.tbar .prog i{display:block;height:100%;background:currentColor;width:0}

/* ruler of 9 blocks, grid of 5 cycles × 4 days */
.ruler{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin-top:12px}
.cell{border:0;padding:0;height:38px;border-radius:6px;background:var(--pc);opacity:.42;position:relative;font-size:13px;font-weight:800;color:var(--bg)}
.cell[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.cell .dlm{position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);background:var(--bg)}
.cell.today::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.weekhead{margin-top:14px;display:grid;gap:6px}
.weekhead .row h2{font-size:20px}
.cycgrid{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}
.cyl{font-size:11px;font-weight:800;color:var(--muted);display:grid;place-items:center;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.cyl.dlc{color:var(--dl)}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 2px 5px;display:grid;justify-items:center;gap:1px;min-width:0}
.dayb .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.dayb .k{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.dayb .k b{display:block;font-family:var(--f-display);font-size:14px;color:var(--pc)}
.dayb .dt{font-size:10px;color:var(--muted)}
.dayb[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dayb.done{background:var(--sunk)} .dayb.done .n::after{content:" ✓";color:var(--ok)}
.dayb.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* day */
.day{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-top{padding:16px 14px 14px;border-top:6px solid var(--pc);display:grid;gap:8px}
.day-top .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.day-top .big h2{font-size:34px;line-height:1}
.day-top h3{font-family:var(--f-body);font-weight:800;font-size:18px}
.goal{max-width:65ch}
.sec{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.sec > h4{margin:0;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
details.sec > summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:800}
details.sec[open] > summary::after{content:"−"}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.step .sb{display:grid;gap:6px;min-width:0}
.step.on .st{opacity:.55}
.st b{font-weight:700}
.foot{font-size:13.5px;color:var(--muted)}

/* exercise */
.hdr{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:10px;border-top:1px dashed var(--line)}
.hdr:first-child{border-top:0;padding-top:0}
.group{display:grid;gap:8px;border-left:3px solid var(--pc);padding-left:9px}
.group.single{border-left-color:transparent;padding-left:0}
.gl{font-size:12.5px;color:var(--muted);font-weight:700}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0}
.ex.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 9px;align-items:start}
.lab{font-weight:800;font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 6px;color:var(--pc);font-variant-numeric:tabular-nums}
.ex-name{font-weight:800;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.ex-name .pg{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sets{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;max-width:7.5em;text-wrap:balance}
.ex-load{font-size:14px}
.ex-rest{font-size:13px;color:var(--muted)}
.ex-note{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.sugg{font-size:14px;border-left:3px solid var(--ok);padding:4px 0 4px 9px}
.sugg b{font-size:16px}
.ex details{font-size:14px}
.ex details summary{cursor:pointer;color:var(--muted);font-weight:700}
.ex details > div{display:grid;gap:6px;margin-top:6px}
.setlist{display:grid;gap:6px}
.set{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 76px 42px;gap:6px;align-items:center}
.set.nowt{grid-template-columns:58px minmax(0,1fr) 76px 42px}
.set.norpe{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 44px}
.set.nowt.norpe{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}
.set.only{grid-template-columns:minmax(0,1fr) 44px}
.set .sl{font-size:12px;line-height:1.2;color:var(--muted);font-weight:700;min-width:0}
.set .sl b{display:block;color:var(--ink);font-size:13px}
.set input,.set select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums;text-align:center}
.set select{padding:8px 2px}
.set .ok{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px}
.set.isdone .ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.isdone input,.set.isdone select{background:var(--sunk)}
.set .tbtn{height:40px;border-radius:9px;border:1px solid var(--ink);background:var(--surface);font-weight:800}
.hint{font-size:12.5px;color:var(--muted)}
.cond{border:1px solid var(--pc);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.cond .ch{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.cond ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.seglist{display:grid;gap:2px;max-height:220px;overflow:auto;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.seglist div{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;border-radius:5px}
.seglist div.cur{background:var(--sunk);font-weight:800}
.seglist div.past{opacity:.45}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.trow b{font-size:15px}
.trow input,.trow select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;text-align:center}
.trow.has input,.trow.has select{border-color:var(--ok)}
.journal textarea,.field textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}

/* panels */
.panel{display:grid;gap:14px}
.panel h2{font-size:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-body);font-size:17px;font-weight:800}
.card.alert{border-color:var(--warn)}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:280px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.ex-grid{display:grid;gap:10px}
@media (min-width:700px){.ex-grid{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
@media (max-width:380px){.set{grid-template-columns:50px minmax(0,1fr) minmax(0,1fr) 58px 40px;gap:4px}.dayb .k{font-size:9.5px}.trow{grid-template-columns:minmax(0,1fr) 104px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="tbar" id="tbar" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <button type="button" data-tab="day"><b>Д</b>День</button>
  <button type="button" data-tab="progress"><b>↗</b>Прогресс</button>
  <button type="button" data-tab="ref"><b>Т</b>Техника</button>
  <button type="button" data-tab="profile"><b>П</b>Профиль</button>

<script id="plan-data" type="application/json">{"ex":{"morning":{"name":"«Утренний комплекс»","group":"Разминка и суставы","page":"с. 214","wt":"bw","how":"В постели, до подъёма, около 3 мин: потянись всем телом 5 раз (3 с тянешься, 2 с отдых); прогни спину 5 раз; напряги ноги 12 раз и пресс 10 раз (3 с напряжение, 2 с отдых); сядь и коснись пальцев ног 5 раз; подними согнутые ноги 5 раз.","err":"Рывком тянуться к носкам сразу после сна: утром диски чувствительны к сгибанию, всё делай плавно.","alt":"Нет времени — хотя бы потягивания и напряжение пресса."},"joints":{"name":"Суставная гимнастика","group":"Разминка и суставы","page":"с. 45, 47, 111–112","wt":"bw","how":"Голова — медленные полукруги от плеча к плечу через подбородок вниз (у Ли полные круги, с. 112; назад не запрокидываем). «Вращение плечами» вперёд и назад (с. 47). «Расслабление плеч» — подними плечи к ушам и урони, обмякнув (с. 111–112). Вращения запястьями (с. 111). «Вращение в талии» с палкой (с. 45). Таз, колени, стопы — по 5–8 кругов в каждую сторону.","err":"Быстрые размашистые круги головой и запрокидывание назад.","alt":""},"shoulders":{"name":"«Вращение плечами» и «расслабление плеч»","group":"Разминка и суставы","page":"с. 47, 111–112, 186","wt":"bw","how":"Руки на бёдрах, плечи по кругу: вверх — назад — вниз, потом в обратную сторону; сначала обоими, потом каждым по очереди. «Расслабление плеч»: подними плечи к ушам, помогая локтями, колени чуть согнуты, — и «урони» плечи и голову, полностью обмякнув.","err":"Крутить руками вместо плеч, напрягать шею.","alt":""},"swings":{"name":"«Высокий удар ногой» и махи в сторону","group":"Разминка и суставы","page":"с. 45, 47, 186, 211","wt":"bw","how":"Прямая нога маховым движением вперёд и вверх, опорное колено можно чуть согнуть; затем махи прямой ногой в сторону, корпус прямой. Высота растёт от маха к маху. У Ли передняя поверхность бедра касалась груди.","err":"Рывок в верхней точке, наклон корпуса навстречу ноге.","alt":"Теряешь равновесие — держись рукой за опору."},"split_jump":{"name":"«Попеременный шпагат»","group":"Разминка и суставы","page":"с. 47, 99","wt":"bw","how":"Ноги на ширине плеч, руки на бёдрах. Резко правую ногу вперёд, левую назад, колени чуть согнуты, и одновременно левую руку вперёд, правую назад; затем смена. В Фазе 1 — шагом, с Фазы 2 — ноги меняются прыжком, приземление мягкое и тихое.","err":"Жёсткое приземление на прямые ноги, колено уходит внутрь.","alt":"Ноет ахилл или колено — шагом, без прыжка."},"dand":{"name":"«Данд» — индийское отжимание","group":"Разминка и суставы","page":"с. 44","wt":"bw","how":"Упор лёжа, таз высоко вверху. Сгибая руки, проведи грудь вперёд у самого пола и выпрями руки с прогибом, затем снова таз вверх. Медленно: волна идёт от таза через грудь к рукам. Ли взял его у индийского борца Гамы — «кошачье потягивание».","err":"Провал поясницы внизу, быстрые рывки.","alt":"Тяжело — с колен или руками на скамье."},"ext_rot":{"name":"Наружная ротация плеча с резиной","group":"Разминка и суставы","page":"не из книги","wt":"band","how":"Локоть прижат к боку и согнут под прямым углом, предплечье поперёк живота. Поворачивай предплечье наружу против лёгкой резины, пауза, медленно назад. Единственная вставка не из книги в разминке — страховка плеча после лет жима лёжа.","err":"Локоть отходит от корпуса, разворот всем телом.","alt":"Нет резины — лёжа на боку с бутылкой воды 0,5 л."},"split_squat":{"name":"Болгарские сплит-приседания","group":"Ноги","page":"не из книги","wt":"db","how":"Задняя нога носком на скамье, передняя — на шаг впереди. Опускайся вертикально, пока бедро передней ноги не станет почти параллельно полу; колено над стопой, корпус прямой. Сначала без веса, потом с гантелями.","err":"Колено передней ноги уходит внутрь или далеко вперёд, корпус заваливается.","alt":"Тяжело держать равновесие — выпады назад."},"squat":{"name":"«Приседания» со штангой","group":"Ноги","page":"с. 37, 40, 94","wt":"bar","how":"Штанга на плечах за головой, стопы на ширине плеч, носки вперёд. Глубокий вдох — и вниз до параллели бёдер с полом, сразу вверх, выдох наверху (с. 94). Спина прямая, таз не поднимается раньше плеч, пятки на полу.","err":"Таз поднимается раньше плеч, пятки отрываются, колени уходят внутрь.","alt":"Штанга занята — то же движение с двумя гантелями на плечах."},"jump_squat":{"name":"«Прыжок из приседа»","group":"Ноги","page":"с. 47","wt":"bw","how":"Без веса: из полуприседа выпрыгни вверх на максимум и приземлись мягко на чуть согнутые ноги, колени над стопами. У Ли — из полного приседа; вариант со штангой (с. 94) не делаем.","err":"Жёсткое приземление на прямые ноги, колени внутрь.","alt":"Ноет ахилл или колено — пропусти."},"calf":{"name":"«Поднимание пяток» со штангой","group":"Ноги","page":"с. 97–98","wt":"bar","how":"Штанга на плечах, носки на бруске 8–10 см. Поднимись на носки как можно выше, пауза 2 с, медленно вниз; корпус строго вертикально. Ли делал подходы носками внутрь, наружу и прямо. Правило Ли (с. 97): дошёл до 3 × 10 — прибавь 10 фунтов (≈ 5 кг) и снова с 3 × 8.","err":"Пружинить внизу, неполная амплитуда.","alt":"Нет стойки — на одной ноге на ступеньке с гантелью."},"calf_seat":{"name":"«Поднимание пяток сидя»","group":"Ноги","page":"с. 98–99","wt":"bar","how":"Сидя, штанга или груз на коленях над стопами, носки на бруске. Подними пятки, задержись, опусти ниже уровня носков.","err":"Быстрые неполные повторы.","alt":"Нет тренажёра — сидя на скамье, гантели на коленях."},"face_pull":{"name":"Тяга резины к лицу","group":"Спина и всё тело","page":"не из книги","wt":"band","how":"Резина закреплена на уровне лица. Тяни концы к лицу, разводя локти в стороны и назад; в конце сведи лопатки, 1 с пауза. Делается в отдыхе между подходами приседаний — бережёт плечевой сустав и выпрямляет осанку.","err":"Тянуть поясницей и шеей, поднимать плечи к ушам.","alt":"Нет резины — разведения лёгких гантелей в наклоне."},"deadlift":{"name":"«Тяжёлая штанга» — становая тяга","group":"Спина и всё тело","page":"с. 88","wt":"bar","how":"Стопы на ширине плеч, носки вперёд, гриф касается голеней; хват на ширине плеч, руки прямые; спина прямая, таз опущен, плечи над грифом. Поднимай, выпрямляя ноги и спину одновременно; гриф идёт вдоль ног. Каждый повтор — с пола, без рывка.","err":"Круглая спина, рывок с пола, таз взлетает раньше плеч.","alt":"Штанга занята — две тяжёлые гантели по бокам, то же движение."},"hyper":{"name":"«Гиперрастяжение»","group":"Спина и всё тело","page":"с. 87–88","wt":"plate","how":"На скамье для гиперэкстензии, таз на краю, ноги закреплены. Опусти корпус и поднимись до прямой линии тела. У Ли блин за головой; в плане — у груди, так меньше нагрузка на шею и поясницу.","err":"Подъём выше линии тела с прогибом в пояснице.","alt":"Нет скамьи — лёжа на животе, «качание спинных мышц» (с. 186)."},"bb_row":{"name":"«Гребля» согнувшись над штангой","group":"Спина и всё тело","page":"с. 38, 83","wt":"bar","how":"Ноги примерно на 20 см друг от друга, наклон вперёд с прямой спиной. Тяни штангу к нижним рёбрам, отводя локти назад «как при гребле на лодке».","err":"Рывки корпусом, круглая спина.","alt":"Гантель одной рукой с опорой."},"db_row":{"name":"«Гребля гантелью одной рукой»","group":"Спина и всё тело","page":"с. 83–84","wt":"db","how":"Рука и колено одной стороны на скамье, корпус параллельно полу. Гантель от пола к боку, локоть назад, наверху — лёгкое движение плечом вверх; медленно вниз до полного растяжения.","err":"Скручивание корпуса, рывок.","alt":"Штанга в наклоне."},"pullup":{"name":"«Переднее подтягивание»","group":"Спина и всё тело","page":"с. 86","wt":"bw","how":"Верхний хват чуть шире плеч, тело не раскачивается; подбородок выше перекладины, у Ли — грудь к перекладине. Ли: «Если вам удастся сделать 3 подхода от 8 до 10 повторений, считайте, что это отличный результат»; дальше — вес на поясе.","err":"Раскачка, полуамплитуда, плечи к ушам.","alt":"Меньше 4 раз — прыжком наверх и медленное опускание за 5 с, 3 × 3."},"mb_rot":{"name":"Бросок медбола с разворотом","group":"Спина и всё тело","page":"не из книги","wt":"none","how":"Боком к стене в 1–1,5 м, мяч 4–6 кг у заднего бедра. Разворот начинается с задней ноги и таза — как в боковом ударе, руки только передают силу. Бросок в стену на уровне груди, поймал отскок — сразу следующий. 5 бросков, потом другая сторона — это один подход.","err":"Бросок одними руками без разворота таза; круглая спина; слишком тяжёлый мяч — движение становится медленным.","alt":"Нет медбола — разворот с резиновой лентой на уровне груди, взрывно; или броски лёгкого мяча."},"mb_chest":{"name":"Толчок медбола от груди","group":"Спина и всё тело","page":"не из книги","wt":"none","how":"Лицом к стене в 2–3 м, стойка как для удара. Мяч 4–6 кг у груди; толчок двумя руками взрывно, с шагом вперёд — сила идёт от ног. Поймал отскок — вернулся в стойку.","err":"Толчок одними руками, локти в стороны, корпус заваливается назад.","alt":"Нет медбола — отжимания с отрывом ладоней от пола."},"bench":{"name":"«Жим на скамье»","group":"Грудь, плечи, руки","page":"с. 38, 79","wt":"bar","how":"Плечи прижаты к скамье, хват широкий, ступни на полу. Опускай штангу к груди, а не к животу, и выжимай на прямые руки. Вдох при опускании, выдох при выжимании. Вес — в процентах от твоего лучшего жима, вверх — взрывно, без «мостика» в пояснице.","err":"Большой мост, отбив от груди, отрыв ягодиц.","alt":"Скамья занята — жим гантелей лёжа тем же числом повторов."},"milpress":{"name":"«Жим штанги стоя» — «военный»","group":"Грудь, плечи, руки","page":"с. 76","wt":"bar","how":"Штанга на груди, хват на ширине плеч. Выжми над головой до прямых рук, ягодицы и пресс напряжены, поясница не прогибается.","err":"Прогиб в пояснице, отклонение назад.","alt":"Не получается без прогиба — гантели стоя."},"lat_raise":{"name":"«Боковое поднятие гантелей стоя»","group":"Грудь, плечи, руки","page":"с. 78","wt":"db","how":"Прямые руки через стороны до уровня плеч, пауза 2 с, медленно вниз; вдох при подъёме. У Ли — дальше над головой с разворотом ладоней вверх; в плане — до уровня плеч, плечу так спокойнее.","err":"Раскачка корпусом, плечи к ушам.","alt":""},"curl":{"name":"«Жим для бицепсов» — подъём штанги","group":"Грудь, плечи, руки","page":"с. 41","wt":"bar","how":"Штанга хватом снизу на ширине плеч, колени чуть согнуты. Подними до верха груди, короткая пауза, медленно вниз.","err":"Раскачка корпусом, локти уходят вперёд.","alt":"Две гантели."},"conc_curl":{"name":"«Жим с концентрацией»","group":"Грудь, плечи, руки","page":"с. 31, 90","wt":"db","how":"Наклон вперёд почти до горизонтали, гантель в одной руке. Подъём к плечу с разворотом ладони внутрь, пауза 2 с наверху, медленно вниз.","err":"Помогать корпусом.","alt":""},"french":{"name":"«Французский жим» лёжа","group":"Грудь, плечи, руки","page":"с. 31, 92","wt":"bar","how":"У Ли стоя или сидя, с опусканием за шею. В плане — лёжа на скамье: штанга от прямых рук ко лбу и обратно, локти смотрят вверх и не расходятся, двигаются только предплечья.","err":"Локти расходятся в стороны.","alt":"Одна гантель двумя руками."},"tri_ext":{"name":"«Растяжение трицепсов» — гантель из-за головы","group":"Грудь, плечи, руки","page":"с. 32","wt":"db","how":"Гантель в прямой руке над головой; опусти за затылок, держа бицепс у уха, и выпрями руку сокращением трицепса.","err":"Локоть уходит в сторону, прогиб в пояснице.","alt":""},"farmer":{"name":"Прогулка фермера","group":"Предплечья и хват","page":"не из книги","wt":"db","how":"Тяжёлые гантели в опущенных руках, плечи вниз и назад, корпус прямой; ровный шаг 30–40 с. Хват, предплечья, трапеции и мышцы корпуса — за несколько минут.","err":"Сутулиться, раскачиваться, поднимать плечи.","alt":"Нет места ходить — стой с гантелями то же время."},"plank":{"name":"Планка на локтях","group":"Пресс и кор","page":"не из книги","wt":"bw","how":"Локти под плечами, тело — прямая линия от пяток до макушки, ягодицы и пресс напряжены, дыхание ровное.","err":"Провисает поясница или задран таз.","alt":"Тяжело — с колен."},"side_plank":{"name":"Боковая планка","group":"Пресс и кор","page":"не из книги","wt":"bw","how":"Опора на локоть под плечом и на ребро стопы, тело — одна линия, таз не провисает. Стороны по очереди.","err":"Таз проваливается, плечо уходит к уху.","alt":"Тяжело — с колен."},"dead_bug":{"name":"«Мёртвый жук»","group":"Пресс и кор","page":"не из книги","wt":"bw","how":"Лёжа на спине, руки вверх, колени над тазом под прямым углом, поясница прижата к полу. Медленно опускай руку за голову и противоположную ногу к полу на выдохе, вернись и смени стороны.","err":"Поясница отрывается от пола, движение рывком.","alt":""},"hang_knee":{"name":"Подъём коленей в висе","group":"Пресс и кор","page":"не из книги","wt":"bw","how":"Вис на перекладине, плечи активны. Медленно подтяни колени к груди, подкрути таз, опусти под контролем — без раскачки.","err":"Раскачка, рывки.","alt":"Вис пока тяжёл — лёжа на спине, колени к груди."},"pallof":{"name":"Паллоф-пресс","group":"Пресс и кор","page":"не из книги","wt":"band","how":"Резина закреплена сбоку на уровне груди. Встань боком, держи конец у груди двумя руками, выжми руки вперёд и 2 с не давай корпусу развернуться к опоре, верни. Косые мышцы работают на удержание — без нагрузки на скручивание поясницы.","err":"Корпус поворачивается к опоре, руки опускаются.","alt":""},"pushup_wide":{"name":"«Отжимания» — широкое положение рук","group":"Общефизическая программа Ли","page":"с. 186","wt":"bw","how":"Из «общефизической программы Джун Фан» Ли: ладони шире плеч, корпус прямой от пяток до макушки, грудь почти касается пола, вверх — на выдохе.","err":"Провисающая поясница, полуамплитуда, локти точно в стороны.","alt":"Меньше 5 раз — с колен или от скамьи."},"clap_pushup":{"name":"Отжимания с хлопком","group":"Общефизическая программа Ли","page":"с. 186","wt":"bw","how":"У Ли — «широкое положение рук (с одним/двумя хлопками)». Мощный толчок — ладони отрываются от пола, хлопок, мягкое приземление на чуть согнутые руки и сразу следующий повтор.","err":"Жёсткое приземление на прямые руки, провисание поясницы.","alt":"Не получается хлопок — взрывное отжимание с отрывом ладоней."},"half_squat":{"name":"«1/4 и 1/2 приседа»","group":"Общефизическая программа Ли","page":"с. 186","wt":"bw","how":"Без веса, стопы на ширине плеч: опустись на четверть или на половину глубины и сразу встань. Колени смотрят туда же, куда носки, пятки на полу.","err":"Колени уходят внутрь, пятки отрываются.","alt":""},"squat4":{"name":"Приседания «на четыре счёта»","group":"Общефизическая программа Ли","page":"с. 186","wt":"bw","how":"Раз — присед, ладони на пол; два — ноги назад в упор лёжа; три — обратно в присед; четыре — встать. «На четыре счёта и прыжок» — вместо «встать» выпрыгнуть вверх.","err":"Провисание поясницы в упоре лёжа, жёсткое приземление.","alt":"Ноет колено — шагом назад и вперёд, без прыжка."},"slow_leg":{"name":"Медленный подъём ноги «с контролем»","group":"Общефизическая программа Ли","page":"с. 187","wt":"bw","how":"В общефизической программе Ли: «поднимание колена… с контролем: медленное движение с горизонтальным коленом». Держись рукой за опору, подними колено до горизонтали, за 3–4 с выпрями ногу вперёд или в сторону, задержи на 1 с и так же медленно верни. Сила бедра и равновесие.","err":"Махать ногой с размаха, заваливать корпус.","alt":""},"jumps":{"name":"Прыжки в стороны и вверх","group":"Общефизическая программа Ли","page":"с. 187","wt":"bw","how":"«Прыжки в стороны» — низко, с ноги на ногу или двумя ногами через линию; «прыжки вверх» — с места на максимум; «с широко расставленными ногами» — звёздочкой. Приземление мягкое, на переднюю часть стопы.","err":"Приземление на прямые ноги, колени внутрь.","alt":"Ноет ахилл или колено — шаги в стороны без прыжка."},"iso_neck":{"name":"Изометрия шеи рукой","group":"Изометрия","page":"не из книги","wt":"bw","how":"Ладонь на лбу, затылке, левом и правом виске; голова давит в руку на 30–50% усилия по 10 с, без движения. Вместо борцовского мостика Ли (с. 75).","err":"Давить в полную силу, задерживать дыхание.","alt":""},"shadow":{"name":"Бой с тенью","group":"Раунды: тень, скакалка, груша","page":"с. 129–132","wt":"bw","how":"Режимы из книги: «разминка в сдержанном темпе»; «с полной выкладкой, заставлять себя — скорость/мощь»; «быстрее, но экономичнее в движениях»; «в темпе разминки». Двигайся без остановок, руки у головы: удары руками и ногами в воздух, наклоны, шаги — интервальная работа для плеч, ног и сердца.","err":"Стоять на месте, опускать руки.","alt":""},"light_bag":{"name":"Лёгкая груша","group":"Раунды: тень, скакалка, груша","page":"с. 129–130","wt":"bw","how":"Быстрые одиночные удары и короткие связки руками: ритм, точность, возврат руки.","err":"","alt":"Нет лёгкой груши — бой с тенью в том же темпе."},"bag_hands":{"name":"Тяжёлая груша — руки","group":"Раунды: тень, скакалка, груша","page":"с. 123–126","wt":"bw","how":"Раунды по времени, удары не считаем: бьёшь без остановок прямыми и хуками, руки после удара возвращаются к голове, дыхание не задерживаешь. Кулак сжат в момент удара, запястье прямое — предплечье продолжается в кулак. Сила — по плану: в первых блоках 50–60%, потом 70–80%; в Фазе 2 последние 15–20 с раунда — на максимум. Бинты и перчатки всегда (с. 123).","err":"Бить согнутым запястьем, опускать вторую руку, задерживать дыхание.","alt":"Нет груши — бой с тенью то же время."},"bag_kicks":{"name":"Тяжёлая груша — ноги","group":"Раунды: тень, скакалка, груша","page":"с. 123, 215","wt":"bw","how":"Раунды по времени, ноги по очереди: прямой — колено вверх, толчок пяткой; боковой — колено к груди, разворот опорной стопы, удар ребром стопы или пяткой; хук ногой — по дуге голенью с разворотом на опорной ноге. Низко и в средний уровень, после удара нога сразу на пол.","err":"Удар носком, колено выпрямляется до упора, корпус заваливается.","alt":"Нет груши — те же удары в воздух, без резкого выпрямления колена."},"bag_speed":{"name":"Скоростные раунды на груше","group":"Раунды: тень, скакалка, груша","page":"с. 215–216","wt":"bw","how":"По мотивам программы Ли «для развития взрывной скорости»: внутри 2-минутного раунда 15–20 с — удары на максимальной скорости, 10–15 с — легко, и снова. Скорость важнее силы: рука или нога расслаблена до контакта.","err":"Вкладывать силу вместо скорости, напрягать плечи заранее.","alt":"Нет груши — то же в воздух."},"hartsell":{"name":"Программа Ли для Хартселла","group":"Раунды: тень, скакалка, груша","page":"с. 128–129","wt":"bw","how":"Раунды с отдыхом 1 мин: кикбоксинг с тенью 3 мин в сдержанном темпе → 3 мин с полной выкладкой → скакалка 3–5 мин «на ходу» (после неё отдых 1,5 мин) → тяжёлая груша 3 мин руками → 3 мин ногами → лёгкая груша 3 мин → бой с тенью 2 мин в темпе разминки.","err":"","alt":"Нет груши — бой с тенью с тем же числом раундов."},"lee_program":{"name":"Личная программа Ли","group":"Раунды: тень, скакалка, груша","page":"с. 130","wt":"bw","how":"Бой с тенью 3 мин «разминка, все типы», 2 мин «скорость и ещё раз скорость», 2 мин «на пределе сил (быстрее, но экономичнее в движениях)»; скакалка 5 мин «в движении»; тяжёлая груша 3 мин ногами и 3 мин руками; лёгкая груша 3 мин; бой с тенью 3 мин в темпе разминки. Отдых 1 мин.","err":"","alt":"Нет груши — бой с тенью с тем же числом раундов."},"rope":{"name":"Скакалка","group":"Бег и кардио","page":"с. 44, 129–132, 207","wt":"bw","how":"Прыжки низкие, на передней части стопы, локти у корпуса, вращают кисти. Режимы Ли: «в движении» и «стараться выполнять на ходу» — с перемещением по залу.","err":"Высокие прыжки, приземление на пятки.","alt":"Ноет ахилл — велотренажёр то же время."},"run_series":{"name":"Интервалы в горку или на велотренажёре","group":"Бег и кардио","page":"с. 129","wt":"bw","how":"Серия: 1 мин легко → 30 с быстро → 1 мин легко; от 2 до 8 серий. В Фазе 2 «быстро» — на 80–85% (на дорожке уклон 6–8% и +3–4 км/ч, на велотренажёре — сопротивление выше и каденс 100+), в Фазе 3 — спринт на 90–95% (уклон 8–10% или максимум оборотов). По ровному не спринтуем: в горку и на велотренажёре меньше риск для задней поверхности бедра и ахилла.","err":"Спринт без разогрева.","alt":"Ахилл, икры или задняя поверхность бедра «тянут» — только велотренажёр."},"incline_walk":{"name":"Ходьба в горку","group":"Бег и кардио","page":"с. 120","wt":"bw","how":"Быстрая ходьба по дорожке с уклоном 3–6%. Ли: «бежать вверх тяжело, но хорошо развиваются сила ног и выносливость».","err":"","alt":"Велотренажёр."},"bike":{"name":"Велотренажёр","group":"Бег и кардио","page":"с. 99, 207","wt":"bw","how":"Главный тренажёр Зоны 2 после смены: ровная езда, пульс 108–126, каденс 80–90 оборотов в минуту, без ударной нагрузки на ноги. После силовой — 10 минут заминки в Зоне 1–2.","err":"","alt":"Быстрая ходьба на дорожке в горку."},"stretch":{"name":"Растяжка — правила","group":"Растяжка и дыхание","page":"с. 103–105","wt":"bw","how":"Медленно входи в растяжение до лёгкого натяжения, чуть отпусти и держи; без боли и пружинения, дыхание ровное. После тренировки — 5 минут по 30 с на позицию, длинная спокойная растяжка — в день восстановления. Восстановление растяжка почти не ускоряет, она нужна для подвижности суставов.","err":"Пружинить и тянуть через боль.","alt":""},"belly":{"name":"Дыхание животом","group":"Растяжка и дыхание","page":"с. 118","wt":"bw","how":"Ли: «Для сохранения жизненных сил следует учиться постоянно дышать животом». Ладонь на животе, вдох носом 4 с — поднимается живот, а не грудь; выдох 6 с.","err":"","alt":""},"box":{"name":"Квадратное дыхание","group":"Растяжка и дыхание","page":"не из книги","wt":"bw","how":"Вдох 4 с, пауза 4 с, выдох 4 с, пауза 4 с; 3 мин перед тренировкой. Закружилась голова — сократи паузы.","err":"","alt":""}},"groups":["Разминка и суставы","Ноги","Спина и всё тело","Грудь, плечи, руки","Предплечья и хват","Пресс и кор","Общефизическая программа Ли","Изометрия","Раунды: тень, скакалка, груша","Бег и кардио","Растяжка и дыхание"],"blocks":[{"m":1,"P":1,"cycles":[1,2,3,4,5],"days":[1,20],"note":"Первые 20 дней — вход. После первой смены — Зона <script>
(function(){
"use strict";
/* ================= данные ================= */
var DATA = JSON.parse(document.getElementById("plan-data").textContent);
var EX = DATA.ex, DAYS = DATA.days, SECS = DATA.secs, BLOCKS = DATA.blocks, PH = DATA.phases, N = DAYS.length;
var PCOL = ["var(--p0)","var(--p1)","var(--p2)","var(--p3)"];
var NATIVE = (typeof window.Android !== "undefined" && window.Android) ? window.Android : null;
var MAINLIFT = {squat:1, deadlift:1, bench:1, milpress:1};
var BIGSTEP = {squat:1, deadlift:1, calf:1, calf_seat:1};
var KIND = {C:["С1","Зона 2"], R:["С2","отдых"], F:["Раунды","выходной"], A:["А","сила"], B:["Б","сила"], T:["Т","тесты"]};
function whereOf(day){ var p = (day.d - 1) % 4; return ["Смена 1","Смена 2","Выходной 1","Выходной 2"][p]; }
function secsOf(day){ return day.secs.map(function(i){ return SECS[i]; }); }
function itemsOf(day){ var out = []; secsOf(day).forEach(function(s){ if(s.t === "ex") s.items.forEach(function(it){ if(it.ex) out.push(it); }); }); return out; }

/* ================= хранение ================= */
var LS = "bl4-app-v1", LS_OLD = "bl3-app-v2";
var S = {profile:{start:"", bench:"", bw:"", stepDb:2, sound:true, watch:"rest", startOk:false}, days:{}, c0:{tests:{}, checks:{}}, body:[]};
var LEGACY_D0 = null; // поля «Дня 0» старой версии: в облаке не трогаем
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function load(){
  try{
    var raw = JSON.parse(lsGet(LS) || "null");
    if(raw){ S.profile = Object.assign(S.profile, raw.profile || {}); S.days = raw.days || {}; S.c0 = Object.assign(S.c0, raw.c0 || {}); S.body = raw.body || []; }
    else {
      var old = JSON.parse(lsGet(LS_OLD) || "null");
      if(old){
        var op = old.profile || {};
        ["start","bench","bw","stepDb","sound","watch"].forEach(function(k){ if(op[k] !== undefined && op[k] !== null) S.profile[k] = op[k]; });
        S.profile.startOk = false; S.body = old.body || [];
      }
    }
    S.c0.tests = S.c0.tests || {}; S.c0.checks = S.c0.checks || {};
  }catch(e){}
})();
function key(d){ return "n" + String(d).padStart(3, "0"); }
function rec(d){ var k = key(d); if(!S.days[k]) S.days[k] = {done:false, note:"", sets:{}, steps:{}, cond:{}, tests:{}}; var r = S.days[k]; r.sets = r.sets || {}; r.steps = r.steps || {}; r.cond = r.cond || {}; r.tests = r.tests || {}; return r; }
function persist(){ lsSet(LS, JSON.stringify(S)); }

/* облако (только в веб-версии внутри Claude) */
var CLOUD = {db:null, uid:null, timers:{}, chains:{}};
function save(docId){
  persist();
  if(!CLOUD.db) return;
  clearTimeout(CLOUD.timers[docId]);
  CLOUD.timers[docId] = setTimeout(function(){ delete CLOUD.timers[docId]; pushDoc(docId); }, 800);
}
function docBody(id){
  if(id === "settings") return {profile:S.profile, d0:LEGACY_D0 || {}};
  if(id === "body") return {list:S.body};
  if(id === "cycle0") return {tests:S.c0.tests, checks:S.c0.checks};
  return S.days[id] || {};
}
function pushDoc(id){
  if(!CLOUD.db) return;
  var ref; try{ ref = CLOUD.db.collection("data/users/" + CLOUD.uid).doc(id); }catch(e){ return; }
  var body = JSON.parse(JSON.stringify(docBody(id)));
  CLOUD.chains[id] = (CLOUD.chains[id] || Promise.resolve()).then(function(){ return ref.set(body); }).catch(function(){});
}
function connectCloud(){
  if(NATIVE || !window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1]; if(!db || !user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      CLOUD.db = db; CLOUD.uid = uid; var first = true;
      db.collection("data/users/" + uid).onSnapshot(function(snap){
        var have = {};
        snap.docs.forEach(function(doc){
          have[doc.id] = true; if(CLOUD.timers[doc.id]) return;
          var b = doc.data(); if(!b) return;
          if(doc.id === "settings"){ if(b.profile) S.profile = Object.assign(S.profile, b.profile); LEGACY_D0 = b.d0 || LEGACY_D0; }
          else if(doc.id === "body"){ S.body = b.list || []; }
          else if(doc.id === "cycle0"){ S.c0 = {tests:b.tests || {}, checks:b.checks || {}}; }
          else if(/^n\d{3}$/.test(doc.id)){ S.days[doc.id] = b; }
        });
        if(first){
          first = false;
          Object.keys(S.days).forEach(function(id){ if(!have[id]) pushDoc(id); });
          if(!have.settings) pushDoc("settings");
          if(!have.body && S.body.length) pushDoc("body");
          if(!have.cycle0 && (Object.keys(S.c0.tests).length || Object.keys(S.c0.checks).length)) pushDoc("cycle0");
        }
        persist(); if(!busyTyping()) render(true);
      }, function(){ CLOUD.db = null; });
    });
  }).catch(function(){});
}
function busyTyping(){ var a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"); }

/* ================= расчёт веса ================= */
var P10 = [0,100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.7,69.4,67.2,65,62.8,60.6,58.4,56.2,54,51.8,49.6];
function pct(reps, rpe){
  if(!reps) return null; rpe = rpe || 8;
  var x = Math.max(1, Math.min(20, reps + (10 - rpe)));
  var lo = Math.floor(x), hi = Math.ceil(x);
  return P10[lo] + (P10[hi] - P10[lo]) * (x - lo);
}
var WEIGHTED = {bar:1, db:1, plate:1, belt:1, roller:1};
function stepFor(sp){ return sp.wt === "db" ? (+S.profile.stepDb || 2) : 2.5; }
function rnd(x, step, wt){ if(x == null || !isFinite(x)) return null; var v = Math.round(x / step) * step; if(wt === "bar") v = Math.max(20, v); return Math.max(0, Math.round(v * 100) / 100); }
function fkg(x){ if(x == null || x === "") return ""; return String(Math.round(x * 100) / 100).replace(".", ","); }
function pnum(v){ if(v === "" || v == null) return null; var x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : null; }
function setKey(it){ return it.lab + ":" + it.ex; }
function doneSets(arr){ return (arr || []).filter(function(s){ return s && s.done; }); }

function sessions(ex, beforeDay, max){
  var out = [];
  for(var d = beforeDay - 1; d >= 1; d--){
    var r = S.days[key(d)]; if(!r || !r.sets) continue;
    itemsOf(DAYS[d-1]).forEach(function(it){ if(it.ex !== ex || it.spec.light) return; var sets = r.sets[setKey(it)]; if(doneSets(sets).length) out.push({d:d, it:it, sets:sets}); });
    if(out.length >= (max || 6)) break;
  }
  return out;
}
function planW(row){ if(row.pct){ var bm = pnum(S.profile.bench); return bm ? bm * row.pct / 100 : null; } return row.pw != null ? row.pw : null; }
function factorFor(ex, day){
  var ss = sessions(ex, day, 4);
  for(var i = 0; i < ss.length; i++){
    var s = ss[i], ds = doneSets(s.sets).filter(function(x){ return x.w != null; });
    var row0 = s.it.spec.rows[0] || {}, plan = planW(row0);
    if(!ds.length || !plan) continue;
    var f = ds[0].w / plan, tgt = row0.rpe || 7;
    var rp = ds.map(function(x){ return x.rpe; }).filter(Boolean), avg = rp.length ? rp.reduce(function(a, b){ return a + b; }, 0) / rp.length : null;
    if(avg && avg <= tgt - 1) f *= 1.05; else if(avg && avg >= tgt + 1) f *= 0.95;
    return {f:Math.max(0.6, Math.min(1.4, f)), d:s.d, used:ds[0].w, plan:plan};
  }
  return null;
}
function e1rmOf(sess){
  var best = 0;
  (sess.sets || []).forEach(function(st, i){
    if(!st || !st.done || !st.w || !st.r) return;
    var row = (sess.it.spec.rows[i]) || {};
    var e = st.w / (pct(st.r, st.rpe || row.rpe || 8) / 100);
    if(e > best) best = e;
  });
  return best || null;
}
/* подсказка веса: план × личная поправка; внутри тренировки — правило плана */
function suggest(day, it, idx){
  var sp = it.spec, row = sp.rows[idx] || sp.rows[0], step = stepFor(sp);
  if(!WEIGHTED[sp.wt]) return null;
  var today = rec(day.d).sets[setKey(it)] || [];
  var firstW = null, prev = null;
  for(var j = 0; j < idx; j++){ if(today[j] && today[j].done && today[j].w != null){ if(firstW == null) firstW = today[j].w; prev = today[j]; } }
  if(prev){
    var tgt = row.rpe || 7, w = prev.w, why = "как прошлый подход";
    if(prev.rpe && row.rpe){
      var up = BIGSTEP[it.ex] ? 5 : step;
      if(prev.rpe <= tgt - 1 && prev.w <= firstW){ w = prev.w + up; why = "прошлый подход легче цели — +" + fkg(up) + " кг, одна ступень за тренировку"; }
      else if(prev.rpe >= tgt + 1){ w = rnd(prev.w * 0.9, step, sp.wt); why = "прошлый подход тяжелее цели — −10%"; }
    }
    return {w:w, why:why};
  }
  var pw = planW(row);
  if(pw == null) return row.pct ? {w:null, why:"Укажи лучший жим лёжа в профиле — посчитаю " + fkg(row.pct) + "% от него"} : null;
  if(pw === 0) return {w:0, why:"без веса"};
  var F = factorFor(it.ex, day.d);
  var chk = row.rpe ? "Первый подход — проверка: тяжелее, чем «запас " + rirTxt(row.rpe) + "», — сбрось 10%; заметно легче — прибавь ступень." : "";
  if(!F || Math.abs(F.f - 1) < 0.02) return {w:rnd(pw, step, sp.wt), why:(F ? "По плану: в прошлый раз ты попал в план. " : "По плану. ") + chk};
  return {w:rnd(pw * F.f, step, sp.wt), why:"план " + fkg(pw) + " кг с твоей поправкой: в день " + F.d + " ты работал с " + fkg(F.used) + " кг при плане " + fkg(F.plan)};
}
function rampFor(day){
  var its = itemsOf(day);
  for(var i = 0; i < its.length; i++){

  var p = ""; try{ p = NATIVE.saveBackup(json, "bruce-lee-3-records-" + isoToday() + ".json"); }catch(e){}
  toast(p ? "Сохранено: " + p : "Не удалось сохранить файл");
}
function exportData(){
  var json = JSON.stringify({app:"bl4", v:1, saved:new Date().toISOString(), data:S});
  var name = "bruce-lee-4-" + isoToday() + ".json";
  if(NATIVE){ var p = ""; try{ p = NATIVE.saveBackup(json, name); }catch(e){} toast(p ? "Сохранено: " + p : "Не удалось сохранить файл"); return; }
  var ta = document.getElementById("bk-text"); if(ta){ ta.value = json; ta.select(); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function(){ toast("Копия скопирована в буфер обмена"); }, function(){ toast("Текст копии в поле ниже — скопируй его"); });
  else toast("Текст копии в поле ниже — скопируй его");
}
function importData(txt){
  try{
    var o = JSON.parse(txt); var d = o && o.data ? o.data : o;
    if(!d || !d.profile) throw new Error("bad");
    S.profile = Object.assign(S.profile, d.profile || {});
    var days = d.days || {}; Object.keys(days).forEach(function(k){ if(/^n\d{3}$/.test(k)) S.days[k] = days[k]; });
    if(d.c0) S.c0 = {tests:Object.assign(S.c0.tests, d.c0.tests || {}), checks:Object.assign(S.c0.checks, d.c0.checks || {})};
    if(d.body && d.body.length) S.body = d.body;
    persist(); if(CLOUD.db){ Object.keys(S.days).forEach(pushDoc); pushDoc("settings"); pushDoc("body"); pushDoc("cycle0"); }
    toast(o.app === "bl3" ? "Из копии версии 3 перенесены профиль и вес" : "Копия загружена"); render();
  }catch(e){ toast("Не похоже на резервную копию"); }
}

render();
connectCloud();
})();
</script>

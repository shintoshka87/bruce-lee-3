<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Брюс Ли 3.0</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url("fonts/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:600;src:url("fonts/Inter-SemiBold.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("fonts/Inter-Bold.otf")}
@font-face{font-family:"Inter";font-weight:800;src:url("fonts/Inter-ExtraBold.otf")}
@font-face{font-family:"Inter Display";font-weight:800;src:url("fonts/InterDisplay-ExtraBold.otf")}
/* Layout: a gym logbook app. Bottom tab bar; the Day screen is a stack of interactive sections; one timer bar docks above the tabs. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E8E2; --ink:#16201B; --muted:#56635C; --line:#D3D9D1;
  --p0:#5F7180; --p1:#1D7560; --p2:#A23E27; --p3:#9A6A0B; --p4:#3A49A3; --dl:#7E8781;
  --ok:#1D7560; --warn:#9A6A0B; --bad:#A23E27; --timer:#16201B; --timer-ink:#EEF0EC;
  --f-display:"Inter Display","Inter",Roboto,system-ui,sans-serif;
  --f-body:"Inter",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --p4:#97A4FF; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --p4:#97A4FF; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:14px 190px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
.chip.fill{background:var(--c);color:var(--bg);border-color:var(--c)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar button{border:0;background:none;padding:9px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button b{font-family:var(--f-display);font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] b{color:var(--p1)}

/* timer bar */
.tbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 10px 8px}
.tbar-in{max-width:740px;margin:0 auto;background:var(--timer);color:var(--timer-ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tbar .tl{font-size:14px;font-weight:700;line-height:1.25}
.tbar .tt{font-size:12.5px;opacity:.8;line-height:1.3}
.tbar .tc{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;text-align:right}
.tbar .tb{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tbar .tb button{flex:1;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;min-width:0}
.tbar.work .tbar-in{background:var(--p2);color:#fff}
.tbar.warm .tbar-in,.tbar.easy .tbar-in{background:var(--p0);color:#fff}
.tbar.done .tbar-in{background:var(--ok);color:#fff}
.tbar .prog{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.tbar .prog i{display:block;height:100%;background:currentColor;width:0}

/* ruler & days */
.ruler{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;margin-top:12px}
.cell{border:0;padding:0;height:34px;border-radius:5px;background:var(--pc);opacity:.42;position:relative;font-size:10px;font-weight:800;color:var(--bg)}
.cell[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.cell .dlm{position:absolute;left:50%;bottom:3px;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);background:var(--bg)}
.cell.today::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.weekhead{margin-top:14px;display:grid;gap:6px}
.weekhead .row h2{font-size:20px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:8px}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 2px 5px;display:grid;justify-items:center;gap:1px;min-width:0}
.dayb .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.dayb .k{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.dayb .k b{display:block;font-family:var(--f-display);font-size:15px;color:var(--pc)}
.dayb .dt{font-size:10px;color:var(--muted)}
.dayb[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dayb.done{background:var(--sunk)} .dayb.done .n::after{content:" ✓";color:var(--ok)}
.dayb.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* day */
.day{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-top{padding:16px 14px 14px;border-top:6px solid var(--pc);display:grid;gap:8px}
.day-top .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.day-top .big h2{font-size:34px;line-height:1}
.day-top h3{font-family:var(--f-body);font-weight:800;font-size:18px}
.goal{max-width:65ch}
.sec{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.sec > h4{margin:0;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
details.sec > summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:800}
details.sec[open] > summary::after{content:"−"}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.step .sb{display:grid;gap:6px}
.step.on .st{opacity:.55}
.st b{font-weight:700}

/* exercise */
.group{display:grid;gap:8px;border-left:3px solid var(--pc);padding-left:9px}
.group.single{border-left-color:transparent;padding-left:0}
.gl{font-size:12.5px;color:var(--muted);font-weight:700}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0}
.ex.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 9px;align-items:start}
.lab{font-weight:800;font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 6px;color:var(--pc);font-variant-numeric:tabular-nums}
.ex-name{font-weight:800;line-height:1.25}
.sets{font-weight:800;font-size:15px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ex-load{font-size:14px}
.ex-rest{font-size:13px;color:var(--muted)}
.ex-note{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.sugg{font-size:14px;border-left:3px solid var(--ok);padding:4px 0 4px 9px}
.sugg b{font-size:16px}
.ex details{font-size:14px}
.ex details summary{cursor:pointer;color:var(--muted);font-weight:700}
.ex details > div{display:grid;gap:6px;margin-top:6px}
.setlist{display:grid;gap:6px}
.set{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 62px 44px;gap:6px;align-items:center}
.set.nowt{grid-template-columns:52px minmax(0,1fr) 62px 44px}
.set.norpe{grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 44px}
.set.nowt.norpe{grid-template-columns:52px minmax(0,1fr) 44px}
.set .sl{font-size:12px;line-height:1.15;color:var(--muted);font-weight:700}
.set .sl b{display:block;color:var(--ink);font-size:13px}
.set input,.set select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums;text-align:center}
.set select{padding:8px 2px}
.set .ok{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px}
.set.isdone .ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.isdone input,.set.isdone select{background:var(--sunk)}
.set .tbtn{height:40px;border-radius:9px;border:1px solid var(--ink);background:var(--surface);font-weight:800}
.hint{font-size:12.5px;color:var(--muted)}
.cond{border:1px solid var(--pc);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.cond .ch{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.cond ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.seglist{display:grid;gap:2px;max-height:220px;overflow:auto;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.seglist div{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;border-radius:5px}
.seglist div.cur{background:var(--sunk);font-weight:800}
.seglist div.past{opacity:.45}
.journal textarea,.field textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.startbar{display:grid;gap:8px}

/* panels */
.panel{display:grid;gap:14px}
.panel h2{font-size:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.card h3{font-family:var(--f-body);font-size:17px;font-weight:800}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:280px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.ex-grid{display:grid;gap:10px}
@media (min-width:700px){.ex-grid{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
@media (max-width:380px){.set{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 56px 40px;gap:4px}.dayb .k{font-size:9.5px}.ruler .cell{font-size:8.5px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tbar" id="tbar" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <button type="button" data-tab="day"><b>Д</b>День</button>
  <button type="button" data-tab="progress"><b>↗</b>Прогресс</button>
  <button type="button" data-tab="ref"><b>Т</b>Техника</button>
  <button type="button" data-tab="profile"><b>П</b>Профиль</button>
</nav>
<script id="plan-data" type="application/json">{"ex":{"squat":{"name":"Присед со штангой на спине","group":"Ноги","how":"Гриф на верхней части трапеций, хват чуть шире плеч, локти под грифом. Стопы на ширине плеч, носки развёрнуты на 15–30°. Вдохни «в живот и бока», напряги пресс, как перед ударом, и садись между пятками: колени идут по линии носков. Глубина — пока поясница не начинает подкручиваться (обычно бедро чуть ниже параллели). Вставай, толкая пол всей стопой; наверху ягодицы сжаты, рёбра опущены, без прогиба назад.","err":"Колени заваливаются внутрь, отрываются пятки, наверху прогиб в пояснице.","alt":"Присед в Смите (стопы на полшага впереди грифа) → гоблет-присед с самой тяжёлой гантелью.","wt":"bar"},"bench":{"name":"Жим лёжа","group":"Грудь","how":"Лопатки сведены и опущены, ягодицы на скамье, стопы на полу. Прогиб умеренный: под поясницу проходит ладонь, а не кулак — большой мост закрепляет гиперлордоз. Опускай штангу 2 с к низу груди, лёгкое касание без отбива, жим вверх и чуть назад. Локти 45–70° от корпуса.","err":"Большой мост, отбив от груди, отрыв ягодиц.","alt":"Жим в Смите → жим гантелей лёжа → тренажёр для горизонтального жима.","wt":"bar"},"rdl":{"name":"Румынская тяга со штангой","group":"Задняя цепь","how":"Сними штангу со стоек на уровне бедра. Колени чуть согнуты и дальше не сгибаются. Отводи таз назад, как будто закрываешь дверь ягодицами; гриф скользит по бёдрам. Спина ровная, рёбра опущены. Опускайся до сильного натяжения задней поверхности бедра (обычно гриф чуть ниже колен) и вернись, толкая таз вперёд. Наверху без отклонения назад.","err":"Округление спины, сгибание коленей в присед, отклонение назад наверху.","alt":"Румынская тяга с гантелями → гиперэкстензия 45° с гантелью у груди.","wt":"bar"},"deadlift":{"name":"Становая тяга","group":"Задняя цепь","how":"Стопы на ширине таза, гриф над серединой стопы. Наклонись, возьми гриф чуть шире ног и опусти таз, пока голени не коснутся грифа. Вдох, пресс напряжён, «сломай гриф» руками, чтобы включить широчайшие. Толкай пол ногами, гриф идёт по ногам. Наверху встань прямо, ягодицы сжаты, без отклонения назад. Каждый повтор начинай с пола заново, без отбива.","err":"Таз взлетает раньше плеч, спина округляется, рывок с пола.","alt":"Румынская тяга на 3–5 повторов → тяга с плинтов: подставь блины под блины, чтобы гриф был на 5–10 см выше.","wt":"bar"},"goblet":{"name":"Гоблет-присед","group":"Ноги","how":"Держи гантель вертикально у груди за верхний диск. Стопы чуть шире плеч, носки развёрнуты. Садись между пятками, локти проходят внутри коленей, внизу пауза 1 с. Вставай всей стопой, наверху сожми ягодицы и опусти рёбра.","err":"Отрыв пяток, колени внутрь, прогиб наверху.","alt":"Присед в Смите с лёгким весом → присед на скамью с гантелью (касание и встать).","wt":"db"},"bss":{"name":"Болгарский сплит-присед","group":"Ноги","how":"Встань в шаге перед скамьёй, носок задней ноги на скамье, гантели в руках. Ягодица задней ноги сжата, таз подкручен — так ещё и растягиваешь сгибатель бедра, это прямая работа против лордоза. Опускайся вертикально вниз, пока заднее колено почти не коснётся пола. Вставай за счёт передней ноги, давление на середину стопы и пятку. Все повторы на одну ногу, потом на другую.","err":"Колено передней ноги уходит внутрь, слишком короткая стойка, прогиб в пояснице.","alt":"Обратные выпады с гантелями → сплит-присед в Смите.","wt":"db"},"revlunge":{"name":"Обратные выпады с гантелями","group":"Ноги","how":"Гантели в руках, стоишь прямо. Шагни одной ногой назад и опустись, пока заднее колено почти не коснётся пола; корпус слегка наклонён вперёд. Вернись толчком передней ноги. Все повторы на одну ногу, потом на другую.","err":"Короткий шаг, колено внутрь, удар коленом об пол.","alt":"Болгарский сплит-присед → сплит-присед в Смите.","wt":"db"},"leg_curl":{"name":"Сгибания ног в тренажёре","group":"Ноги","how":"Колени на оси тренажёра, валик над пятками. Согни ноги до упора, наверху пауза 1 с, опускай 2–3 с. Таз прижат к сиденью или скамье, без рывков.","err":"Отрыв таза, рывки, неполная амплитуда.","alt":"Сгибание ноги на нижнем блоке с манжетой → лёжа на спине, пятки на полотенце: мост и подтягивание пяток к ягодицам.","wt":"mach"},"hip_thrust":{"name":"Ягодичный мост в тренажёре","group":"Задняя цепь","how":"Сядь в тренажёр, упор лопатками в подушку, ремень или валик на тазу. Стопы на ширине таза, в верхней точке голени вертикальны. Сначала подкрути таз (копчик к себе), потом поднимай таз, пока тело не выпрямится от колен до плеч. Наверху сожми ягодицы на 1–2 с, рёбра опущены, подбородок прижат. Опусти медленно.","err":"Подъём за счёт прогиба поясницы, запрокинутая голова.","alt":"Ягодичный мост со штангой с упором лопатками в скамью → гиперэкстензия 45° с акцентом на ягодицы.","wt":"mach"},"hyperext":{"name":"Гиперэкстензия 45°","group":"Задняя цепь","how":"Валик под тазобедренными суставами, а не под животом. Спина нейтральная, руки скрещены на груди. Опускайся, сгибаясь в тазу, и поднимайся до прямой линии тела — не выше. Работают ягодицы и задняя поверхность бедра.","err":"Подъём выше линии тела с прогибом в пояснице.","alt":"Ягодичный мост в тренажёре.","wt":"bw"},"calf":{"name":"Подъём на носки в тренажёре","group":"Икры и ахилл","how":"Носки на краю платформы, колени прямые, но не заблокированы. Опускай пятки 3 с до глубокого растяжения, пауза 2 с внизу, поднимись на максимум и задержись на 1 с. Медленный темп готовит ахилл к скакалке и прыжкам.","err":"Пружинить внизу, работать в полуамплитуде.","alt":"Подъём на носки в Смите с блином под носками → на одной ноге на ступеньке с гантелью.","wt":"mach"},"adductor":{"name":"Сведение ног в тренажёре","group":"Таз","how":"Сядь, колени на подушках, стартовую ширину выставь комфортной для паха. Сведи ноги за 1 с, пауза, разводи 2–3 с. Вес умеренный: это профилактика травм паха на выпадах и ударах.","err":"Слишком широкое разведение на старте, рывки.","alt":"Копенгагенская планка с коротким рычагом: лёжа на боку, колено верхней ноги на скамье, подними таз и держи 15–20 с.","wt":"mach"},"row_chest":{"name":"Тяга гантелей лёжа грудью на наклонной скамье","group":"Спина","how":"Скамья 30°, ложишься на неё грудью, гантели свисают. Сначала сведи и опусти лопатки «к задним карманам», затем тяни локти назад к поясу. Наверху пауза 1 с, медленно опусти. Упор грудью снимает нагрузку с поясницы. На этой же скамье делаешь и жим из пары, менять место не нужно.","err":"Плечи поднимаются к ушам, рывки, грудь отрывается от скамьи.","alt":"Тяга Т-грифа с упором грудью → рычажная тяга → тяга горизонтального блока.","wt":"db"},"tbar_cs":{"name":"Тяга Т-грифа с упором грудью","group":"Спина","how":"Грудь плотно на подушке, ноги в упорах. Хват средний. Сначала опусти и сведи лопатки, затем тяни рукояти к низу груди, локти идут назад под 30–45° к корпусу. Наверху пауза 1 с, опускай 2 с до полного растяжения спины. Отжимания из пары делаешь на полу рядом с тренажёром.","err":"Отрыв груди от подушки, рывки корпусом.","alt":"Рычажная тяга → тяга гантелей лёжа грудью на наклонной скамье → тяга горизонтального блока.","wt":"mach"},"row_one":{"name":"Тяга гантели одной рукой с упором в скамью","group":"Спина","how":"Колено и ладонь одной стороны на скамье, спина ровная, параллельна полу. Тяни гантель к поясу локтем назад, наверху пауза, медленно опусти до полного растяжения.","err":"Скручивание корпуса, рывок.","alt":"Тяга гантели в наклоне с упором рукой в стойку.","wt":"db"},"pullup":{"name":"Подтягивания в гравитроне","group":"Спина","how":"Подбери противовес так, чтобы сделать заданные повторы с нужным запасом. Хват чуть шире плеч или параллельный. Сначала опусти лопатки, потом тяни грудь к рукоятям, локти вниз к рёбрам. Внизу полностью выпрямляй руки. Каждый цикл старайся снять 2,5–5 кг противовеса. Когда выходит 8 чистых повторов без противовеса — подтягивайся без него, а потом с гантелью, зажатой между стоп.","err":"Раскачка, полуамплитуда, плечи к ушам.","alt":"Тяга верхнего блока → тяга верхнего блока одной рукой стоя на колене.","wt":"assist"},"cable_row":{"name":"Тяга горизонтального блока","group":"Спина","how":"Сядь, стопы в упорах, колени чуть согнуты, корпус вертикально. Тяни рукоять (параллельную или канат) к низу живота, сводя лопатки, локти вдоль корпуса. Пауза 1 с, медленно верни до растяжения спины, не заваливая корпус назад. Ролик из пары делаешь на полу рядом.","err":"Раскачка корпусом, тяга одними руками без лопаток.","alt":"Рычажная тяга → тяга гантели одной рукой с упором в скамью.","wt":"mach"},"incline_db":{"name":"Жим гантелей на наклонной скамье 30°","group":"Грудь","how":"Та же скамья, что для тяги из пары, угол 30°. Лопатки сведены, стопы на полу. Опусти гантели к верху груди, локти 45–60° к корпусу, и выжми вверх, слегка сводя гантели. Внизу без отбива.","err":"Слишком большой угол скамьи, локти разведены в стороны под 90°.","alt":"Жим на наклонной скамье в Смите → тренажёр для горизонтального жима.","wt":"db"},"pushup_pause":{"name":"Отжимания с паузой","group":"Грудь","how":"Ладони чуть шире плеч, тело прямое от пяток до макушки, ягодицы и пресс напряжены. Опустись до касания грудью кулака на полу, пауза 1 с внизу, выжмись вверх. Повторов — на 3 меньше, чем можешь (RIR 3).","err":"Провисание таза, локти в стороны под 90°.","alt":"Тренажёр для горизонтального жима, 2 × 10–12.","wt":"bw"},"hk_press":{"name":"Жим гантели одной рукой стоя на колене","group":"Плечи","how":"Встань на колено той же стороны, что и рабочая рука; ягодица этой ноги сжата, рёбра опущены. Гантель у плеча, ладонь внутрь. Выжми вверх и чуть вперёд до прямой руки, в конце дотянись плечом вверх. Корпус не отклоняется в сторону и назад. Жим над головой без помощи поясницы — работа и против лордоза, и на здоровье плеча жимовика. Делаешь прямо возле гравитрона, пока отдыхаешь от подтягиваний.","err":"Отклонение корпуса, раскрытие рёбер, прогиб.","alt":"Жим Т-грифа одной рукой (если Т-гриф на шарнире) → тренажёр для вертикального жима.","wt":"db"},"db_press_stand":{"name":"Жим гантелей стоя","group":"Плечи","how":"Стопы на ширине таза, ягодицы и пресс напряжены, рёбра опущены. Гантели у плеч, ладони внутрь или вперёд. Выжми вверх до прямых рук, голова чуть «проходит» вперёд под гантели. Корпус не отклоняется назад: если начинаешь прогибаться, вес слишком большой.","err":"Прогиб в пояснице, отклонение назад.","alt":"Жим гантелей сидя (спинка 75–80°) → тренажёр для вертикального жима.","wt":"db"},"push_press_db":{"name":"Жим гантелей стоя с подседом","group":"Плечи","how":"Как жим стоя, но старт с короткого подседа на 10–15 см и резкого выпрямления ног, которое «подбрасывает» гантели; руки дожимают. Опускай гантели к плечам под контролем, мягко амортизируя коленями. Ноги передают силу в руки — та же цепочка, что в ударе.","err":"Глубокий подсед, прогиб на дожиме.","alt":"Жимовой швунг со штангой из стоек → жим гантелей стоя.","wt":"db"},"face_pull":{"name":"Тяга каната к лицу","group":"Плечи","how":"Канатная насадка на верхнем блоке на уровне лба, хват сверху. Шаг назад, руки прямые. Тяни канат к переносице, разводя локти высоко и выворачивая кисти назад, как в позе «двойной бицепс». Пауза 1 с, медленно верни. Для жимовика с 12-летним стажем это обязательное упражнение: задняя дельта и вращатели плеча.","err":"Тяга к груди с опущенными локтями, рывки корпусом.","alt":"Обратные разведения в «бабочке» → разведения гантелей лёжа грудью на наклонной скамье.","wt":"mach"},"rear_fly":{"name":"Обратные разведения в «бабочке»","group":"Плечи","how":"Сядь лицом к тренажёру, рукояти на уровне плеч, руки почти прямые. Разведи руки назад до линии корпуса, в конце сведи лопатки, пауза 1 с, медленно верни. Вес лёгкий, плечи опущены.","err":"Плечи к ушам, рывок, слишком большой вес.","alt":"Разведения на верхних блоках крест-накрест → тяга каната к лицу.","wt":"mach"},"ext_rot":{"name":"Наружная ротация плеча на блоке","group":"Плечи","how":"Блок на уровне локтя, рукоять в дальней от блока руке. Локоть прижат к боку (зажми свёрнутое полотенце), предплечье поперёк живота. Разверни предплечье наружу на 60–90°, пауза, медленно верни. Вес очень лёгкий: работают маленькие мышцы плеча.","err":"Локоть отходит от корпуса, разворот всем корпусом.","alt":"То же с лёгкой гантелью лёжа на боку.","wt":"mach"},"zottman":{"name":"Сгибания Зоттмана","group":"Руки","how":"Любимое упражнение Брюса Ли для предплечий. Подними гантели хватом снизу, как на бицепс. Наверху разверни кисти ладонями вниз и медленно, за 3 с, опусти обратным хватом. Внизу верни хват снизу и повтори.","err":"Раскачка корпусом, быстрое опускание.","alt":"Сгибания с EZ-грифом обратным хватом.","wt":"db"},"preacher":{"name":"Сгибания на скамье Скотта","group":"Руки","how":"Тренажёр или скамья Скотта с EZ-грифом. Подмышки плотно на подушке. Согни руки до упора, пауза 1 с, опускай 2–3 с почти до полного выпрямления, без «провала» в локтях внизу.","err":"Бросать вес внизу: нагрузка уходит в локтевой сустав.","alt":"Скамья Скотта с EZ-грифом → сгибания на нижнем блоке.","wt":"mach"},"pushdown":{"name":"Разгибания рук на блоке с канатом","group":"Руки","how":"Верхний блок, канатная насадка. Локти прижаты к бокам. Разгибай руки до конца, внизу разводи концы каната в стороны, пауза 1 с, медленно вверх до 90° в локтях.","err":"Локти уходят вперёд, помогаешь корпусом.","alt":"Разгибания с прямой рукоятью → разгибания гантели из-за головы сидя.","wt":"mach"},"pallof":{"name":"Паллоф-пресс","group":"Кор","how":"Блок на уровне груди, встань боком к нему, рукоять у груди обеими руками. Стопы на ширине плеч, ягодицы и пресс напряжены. Выжми рукоять вперёд до прямых рук, задержи 2 с, не давая блоку развернуть корпус, вернись. Все повторы в одну сторону, потом в другую.","err":"Поворот корпуса к блоку, задержка дыхания.","alt":"Боковая планка 2 × 30 с на сторону.","wt":"mach"},"chop":{"name":"«Дровосек» на блоке, взрывной","group":"Кор","how":"Рукоять или канат на верхнем блоке, встань боком. Движение начинают бёдра и корпус, руки только передают усилие: резко тяни рукоять по диагонали вниз к противоположному бедру, как удар; вверх — медленно, 2 с. Таз и рёбра поворачиваются вместе, поясница отдельно не скручивается. Это перенос силы ног в корпус — основа удара.","err":"Тянуть руками без бёдер, скручивать поясницу.","alt":"Паллоф-пресс → медленный «дровосек» с гантелью.","wt":"mach"},"ab_wheel":{"name":"Ролик для пресса с колен","group":"Кор","how":"Стоя на коленях (под ними коврик), ролик под плечами. Сначала подкрути таз и напряги ягодицы — при лордозе это главное. Катись вперёд, пока держишь поясницу без прогиба, и вернись тем же путём. Амплитуду увеличивай постепенно, от цикла к циклу.","err":"Провисание поясницы, таз остаётся позади.","alt":"Дед баг с удержанием 3 с → планка на предплечьях с медленной «пилой» вперёд-назад.","wt":"bw"},"knee_raise":{"name":"Подъём коленей в стойке с подкруткой таза","group":"Кор","how":"Спина прижата к спинке стойки, предплечья на упорах. Подними колени к груди и в конце подкрути таз вверх, отрывая его от спинки. Опускай 2–3 с, без раскачки. Работает пресс, а не только сгибатели бедра.","err":"Махи ногами, раскачка, прогиб в пояснице внизу.","alt":"Обратные скручивания на наклонной доске → тренажёр для сгибаний пресса.","wt":"bw"},"dead_bug":{"name":"Дед баг","group":"Кор","how":"Лёжа на спине, руки вертикально вверх, ноги согнуты 90/90. Выдохни и прижми поясницу к полу. Медленно, за 3 с, опусти противоположные руку и ногу почти до пола, вернись, смени сторону. Как только поясница отрывается — уменьши амплитуду.","err":"Быстрый темп, отрыв поясницы, задержка дыхания.","alt":"Двигать только ногами, руки держать вверху.","wt":"bw"},"side_plank":{"name":"Боковая планка","group":"Кор","how":"Локоть под плечом, тело — прямая линия от головы до стоп, таз не провисает и не уходит назад. Верхняя рука на поясе, дыхание ровное. Тяжело — вариант с колен.","err":"Таз провисает или уходит назад, плечо «проваливается».","alt":"Боковая планка с колен.","wt":"bw"},"farmer":{"name":"Прогулка фермера","group":"Хват и кор","how":"Тяжёлые гантели в обе руки. Встань высоко, плечи и рёбра вниз, пресс напряжён. Иди короткими быстрыми шагами, не раскачиваясь. Хват, трапеции, кор и выносливость в одном упражнении — Ли тренировал хват при любой возможности. Нет места для ходьбы — стой с гантелями на месте столько же по времени (30–45 с).","err":"Сутулость, раскачка, задержка дыхания.","alt":"Удержание гантелей стоя 30–45 с → удержание штанги в стойке на уровне бёдер.","wt":"db"},"suitcase":{"name":"Переноска одной гантели («чемодан»)","group":"Хват и кор","how":"Тяжёлая гантель в одной руке, вторая свободна. Иди ровно, не наклоняясь к гантели и не отклоняясь от неё: кор держит корпус вертикально. Пройди отрезок, смени руку.","err":"Наклон в сторону гантели, поднятое плечо.","alt":"Удержание одной гантели стоя 30 с на руку.","wt":"db"},"wall_sit":{"name":"Присед у стены","group":"Давление","how":"Спина по стене, стопы на полшага впереди, колени 90–100°. Дыши ровно и спокойно, без задержки дыхания, лицо расслаблено. Отдых между подходами 2 мин. Это изометрия умеренной силы: по данным исследований она лучше других тренировок снижает давление.","err":"Задержка дыхания и натуживание.","alt":"Если колени возражают — угол 110–120°, неглубоко.","wt":"bw"},"db_swing":{"name":"Махи гантелью","group":"Мощность","how":"Держи гантель обеими руками за верхний диск. Стопы чуть шире плеч. Отведи таз назад, гантель проходит между бёдер, спина ровная. Резко выпрями бёдра — гантель взлетает до уровня груди за счёт таза, руки только держат. Наверху тело прямое, ягодицы сжаты, без прогиба назад.","err":"Поднимать руками, приседать вместо наклона, прогиб наверху.","alt":"Ягодичный мост в тренажёре с взрывным подъёмом → велоспринт 6 с.","wt":"db"},"plyo_push":{"name":"Взрывные отжимания","group":"Мощность","how":"Руки на скамье или на грифе в Смите на уровне пояса (с 8-го цикла — с пола). Тело прямое, пресс напряжён. Опустись под контролем и оттолкнись так резко, чтобы ладони оторвались от опоры. Мягко поймай себя, пауза, следующий повтор. Каждый повтор с максимальной скоростью: это замена броскам медбола.","err":"Провисание таза, медленные «усталые» повторы.","alt":"Скоростной жим лёжа 40–50% × 3 максимально быстро.","wt":"bw"},"bike_sprint":{"name":"Велоспринт с места","group":"Мощность","how":"Вертикальный велотренажёр, высокое сопротивление — такое, чтобы за 8 с не раскрутиться вхолостую. Старт с почти неподвижных педалей, 6–10 с максимального усилия сидя, потом 90–120 с очень легко. Записывай пиковые ватты, если тренажёр их показывает.","err":"Слишком лёгкое сопротивление, короткий отдых.","alt":"Эллипс с тем же протоколом.","wt":"watt"},"jump":{"name":"Прыжок вверх с места (по желанию)","group":"Мощность","how":"Только если ахилл, колени и стопы без боли. Стопы на ширине таза, быстрый мах руками и неглубокий подсед, прыжок максимально вверх. Приземляйся мягко на всю стопу, колени по линии носков, и «застынь» на 2 с. Каждый прыжок отдельно, отдых 30–60 с.","err":"Жёсткое приземление на прямые ноги, колени внутрь.","alt":"Велоспринт с места 6 с — равноценная замена, если прыгать не хочется.","wt":"bw"}},"days":[{"d":1,"c":1,"w":1,"k":"C","p":0,"dl":false,"test":false,"diet":false,"title":"Смена 1 · сессия C после работы","time":"8 мин утром + 40–45 мин в зале","goal":"Аэробная база, давление и «достройка» плеч, рук и икр без нагрузки на нервную систему. После этой сессии ты бодрее, чем до неё.","items":[{"cond":{"kind":"z2","n":20,"inten":null,"title":"Зона 2 — 20 мин","mins":20,"lines":["Любой свободный кардиотренажёр: горизонтальный велотренажёр, эллипс или дорожка в горку 8–12% на 4,5–5,5 км/ч.","Пульс 118–135, можешь говорить фразами. Нет пульсометра — дыши только носом: если не получается, сбавь."],"segs":[{"l":"Зона 2","s":1200,"k":"work","t":"пульс 118–135, можешь говорить фразами"}]}},{"ex":"face_pull","sets":"2 × 15","load":"лёгкий вес, идеальная техника","rest":"без отдыха → 1b","note":"","lab":"1a","spec":{"wt":"mach","unit":"reps","side":null,"rows":[{"kind":"work","lo":15,"hi":15,"rpe":null},{"kind":"work","lo":15,"hi":15,"rpe":null}],"rest":0,"pairNext":true,"main":false,"deload":false,"test":false}},{"ex":"calf","sets":"2 × 15","load":"лёгкий вес, вниз 3 с, пауза 2 с внизу","rest":"60–90 с","note":"","lab":"1b","spec":{"wt":"mach","unit":"reps","side":null,"rows":[{"kind":"work","lo":15,"hi":15,"rpe":null},{"kind":"work","lo":15,"hi":15,"rpe":null}],"rest":75,"pairNext":false,"main":false,"deload":false,"test":false}},{"ex":"zottman","sets":"2 × 10–12","load":"RPE 6","rest":"без отдыха → 2b","note":"","lab":"2a","spec":{"wt":"db","unit":"reps","side":null,"rows":[{"kind":"work","lo":10,"hi":12,"rpe":6.0},{"kind":"work","lo":10,"hi":12,"rpe":6.0}],"rest":0,"pairNext":true,"main":false,"deload":false,"test":false}},{"ex":"pushdown","sets":"2 × 12–15","load":"RPE 6","rest":"60 с","note":"","lab":"2b","spec":{"wt":"mach","unit":"reps","side":null,"rows":[{"kind":"work","lo":12,"hi":15,"rpe":6.0},{"kind":"work","lo":12,"hi":15,"rpe":6.0}],"rest":60,"pairNext":false,"main":false,"deload":false,"test":false}},{"ex":"pallof","sets":"2 × 8 на сторону","load":"пауза 2 с в вытянутых руках","rest":"30 с","note":"","lab":"3","spec":{"wt":"mach","unit":"reps","side":"сторону","rows":[{"kind":"work","lo":8,"hi":8,"rpe":null},{"kind":"work","lo":8,"hi":8,"rpe":null}],"rest":30,"pairNext":false,"main":false,"deload":false,"test":false}},{"ex":"wall_sit","sets":"2 × 1 мин","load":"ровное дыхание","rest":"2 мин","note":"Тот же присед у стены сделаешь завтра дома.","lab":"4","spec":{"wt":"bw","unit":"sec","side":null,"rows":[{"kind":"work","lo":60,"hi":60,"rpe":null},{"kind":"work","lo":60,"hi":60,"rpe":null}],"rest":120,"pairNext":false,"main":false,"deload":false,"test":false}}]},{"d":2,"c":1,"w":1,"k":"R","p":0,"dl":false,"test":false,"diet":false,"title":"Смена 2 · восстановление","time":"8 мин утром + 30–40 мин вечером","goal":"Восстановиться. Впереди две главные тренировки, и они пройдут настолько хорошо, насколько ты отдохнёшь сегодня.","wall":"2 × 1 м function suggest(day, it, idx){

  var today = (rec(day.d).sets[setKey(it)] || []);

  var prev = null; for(var j = idx - 1; j >= 0; j--){ if(today[j] && today[j].done && today[j].w != null){ prev = {st:today[j], row:sp.rows[j]}; break; } }

    var topW = today[0] && today[0].done && today[0].w ? today[0].w : null;
    var base = topW || (suggest(day, it, 0) || {}).w;
    if(prev && prev.row.kind === "back") return {w:prev.st.w, why:"как прошлый подход добивки"};
    if(base) return {w:rnd(base * (1 - (row.drop || 10) / 100), step, wt), why:"топ " + fkg(base) + " кг − " + (row.drop || 10) + "%"};
  }
  if(prev && row.kind === "work"){
    var w = prev.st.w, why = "как прошлый подход";
    if(sp.main && row.rpe && prev.st.rpe){
      var diff = row.rpe - prev.st.rpe;
      if(diff >= 2){ w = rnd(w * 1.05, step, wt); if(w <= prev.st.w) w = prev.st.w + step; why = "прошлый подход был легче цели на 2+ — +5%"; }

    }

    if(!L && it.ex === "deadlift"){ var R = latestE1rm("rdl", day.d); if(R) L = {e:R.e * 1.15, s:null, rough:true}; }
    if(!L) return {w:null, why:"первый раз — подбери по ориентиру и RPE, дальше посчитаю сам"};
    var rpeT = row.rpe || 8, reps = row.hi || row.lo;

  }

  }

}

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Брюс Ли 5.0</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url("fonts/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:600;src:url("fonts/Inter-SemiBold.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("fonts/Inter-Bold.otf")}
@font-face{font-family:"Inter";font-weight:800;src:url("fonts/Inter-ExtraBold.otf")}
@font-face{font-family:"Inter Display";font-weight:800;src:url("fonts/InterDisplay-ExtraBold.otf")}
/* Layout: a gym logbook app. Bottom tab bar; the Day screen is a stack of interactive sections; one timer bar docks above the tabs. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E8E2; --ink:#16201B; --muted:#56635C; --line:#D3D9D1;
  --p0:#5F7180; --p1:#1D7560; --p2:#A23E27; --p3:#9A6A0B; --dl:#7E8781;
  --ok:#1D7560; --warn:#9A6A0B; --bad:#A23E27; --timer:#16201B; --timer-ink:#EEF0EC;
  --f-display:"Inter Display","Inter",Roboto,system-ui,sans-serif;
  --f-body:"Inter",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:14px 190px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
.chip.fill{background:var(--c);color:var(--bg);border-color:var(--c)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar button{border:0;background:none;padding:9px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button b{font-family:var(--f-display);font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] b{color:var(--p1)}

/* timer bar */
.tbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 10px 8px}
.tbar-in{max-width:740px;margin:0 auto;background:var(--timer);color:var(--timer-ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tbar .tl{font-size:14px;font-weight:700;line-height:1.25}
.tbar .tt{font-size:12.5px;opacity:.8;line-height:1.3}
.tbar .tc{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;text-align:right}
.tbar .tb{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tbar .tb button{flex:1;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;min-width:0}
.tbar.work .tbar-in{background:var(--p2);color:#fff}
.tbar.warm .tbar-in,.tbar.easy .tbar-in{background:var(--p0);color:#fff}
.tbar.done .tbar-in{background:var(--ok);color:#fff}
.tbar .prog{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.tbar .prog i{display:block;height:100%;background:currentColor;width:0}

/* ruler of 6 blocks, grid of 6 cycles × 4 days */
.ruler{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:12px}
.cell{border:0;padding:0;height:38px;border-radius:6px;background:var(--pc);opacity:.42;position:relative;font-size:13px;font-weight:800;color:var(--bg)}
.cell[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.cell .dlm{position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);background:var(--bg)}
.cell.today::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.weekhead{margin-top:14px;display:grid;gap:6px}
.weekhead .row h2{font-size:20px}
.cycgrid{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}
.cyl{font-size:11px;font-weight:800;color:var(--muted);display:grid;place-items:center;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.cyl.dlc{color:var(--dl)}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 2px 5px;display:grid;justify-items:center;gap:1px;min-width:0}
.dayb .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.dayb .k{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.dayb .k b{display:block;font-family:var(--f-display);font-size:14px;color:var(--pc)}
.dayb .dt{font-size:10px;color:var(--muted)}
.dayb[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dayb.done{background:var(--sunk)} .dayb.done .n::after{content:" ✓";color:var(--ok)}
.dayb.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* day */
.day{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-top{padding:16px 14px 14px;border-top:6px solid var(--pc);display:grid;gap:8px}
.day-top .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.day-top .big h2{font-size:34px;line-height:1}
.day-top h3{font-family:var(--f-body);font-weight:800;font-size:18px}
.goal{max-width:65ch}
.sec{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.sec > h4{margin:0;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
details.sec > summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:800}
details.sec[open] > summary::after{content:"−"}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.step .sb{display:grid;gap:6px;min-width:0}
.step.on .st{opacity:.55}
.st b{font-weight:700}
.foot{font-size:13.5px;color:var(--muted)}

/* exercise */
.hdr{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:10px;border-top:1px dashed var(--line)}
.hdr:first-child{border-top:0;padding-top:0}
.group{display:grid;gap:8px;border-left:3px solid var(--pc);padding-left:9px}
.group.single{border-left-color:transparent;padding-left:0}
.gl{font-size:12.5px;color:var(--muted);font-weight:700}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0}
.ex.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 9px;align-items:start}
.lab{font-weight:800;font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 6px;color:var(--pc);font-variant-numeric:tabular-nums}
.ex-name{font-weight:800;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.ex-name .pg{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sets{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;max-width:7.5em;text-wrap:balance}
.ex-load{font-size:14px}
.ex-rest{font-size:13px;color:var(--muted)}
.ex-note{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.sugg{font-size:14px;border-left:3px solid var(--ok);padding:4px 0 4px 9px}
.sugg b{font-size:16px}
.ex details{font-size:14px}
.ex details summary{cursor:pointer;color:var(--muted);font-weight:700}
.ex details > div{display:grid;gap:6px;margin-top:6px}
.setlist{display:grid;gap:6px}
.set{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 76px 42px;gap:6px;align-items:center}
.set.nowt{grid-template-columns:58px minmax(0,1fr) 76px 42px}
.set.norpe{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 44px}
.set.nowt.norpe{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}
.set.only{grid-template-columns:minmax(0,1fr) 44px}
.set .sl{font-size:12px;line-height:1.2;color:var(--muted);font-weight:700;min-width:0}
.set .sl b{display:block;color:var(--ink);font-size:13px}
.set input,.set select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums;text-align:center}
.set select{padding:8px 2px}
.set .ok{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px}
.set.isdone .ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.isdone input,.set.isdone select{background:var(--sunk)}
.set .tbtn{height:40px;border-radius:9px;border:1px solid var(--ink);background:var(--surface);font-weight:800}
.hint{font-size:12.5px;color:var(--muted)}
.cond{border:1px solid var(--pc);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.cond .ch{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.cond ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.seglist{display:grid;gap:2px;max-height:220px;overflow:auto;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.seglist div{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;border-radius:5px}
.seglist div.cur{background:var(--sunk);font-weight:800}
.seglist div.past{opacity:.45}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.trow b{font-size:15px}
.trow input,.trow select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;text-align:center}
.trow.has input,.trow.has select{border-color:var(--ok)}
.journal textarea,.field textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}

/* panels */
.panel{display:grid;gap:14px}
.panel h2{font-size:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-body);font-size:17px;font-weight:800}
.card.alert{border-color:var(--warn)}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:280px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.ex-grid{display:grid;gap:10px}
@media (min-width:700px){.ex-grid{grid-template-columns:1fr 1fr}}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.colors button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px}
.colors button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface)}
.banner{border-left:4px solid var(--c);background:var(--sunk);padding:9px 11px;border-radius:8px;font-size:14px}
.ztbl td.r{font-weight:700}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
@media (max-width:380px){.set{grid-template-columns:50px minmax(0,1fr) minmax(0,1fr) 58px 40px;gap:4px}.dayb .k{font-size:9.5px}.trow{grid-template-columns:minmax(0,1fr) 104px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="tbar" id="tbar" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <button type="button" data-tab="day"><b>Д</b>День</button>
  <button type="button" data-tab="progress"><b>↗</b>Прогресс</button>
  <button type="button" data-tab="ref"><b>Т</b>Техника</button>
  <button type="button" data-tab="profile"><b>П</b>Профиль</button>

<script id="plan-data" type="application/json">{"ex":{"deadbug":{"name":"«Мёртвый жук»","group":"Дыхание и кор","page":"🟢 зелёный список","wt":"band","how":"Лёжа на спине, руки вверх, колени над тазом под 90°. Жгут закреплён за головой, руки держат его натянутым. Выдохни, опусти рёбра и прижми поясницу к полу; медленно отведи одну ногу вперёд, не касаясь пола, и верни. Поясница не отрывается от пола ни на миг. Сложнее — нога уходит дальше и прямее.","err":"Поясница отрывается от пола, когда нога уходит далеко, — сократи амплитуду.","alt":"Тяжело — опускай согнутую ногу пяткой к полу. Без жгута — просто руки вверх."},"curlup":{"name":"Скручивание по Макгиллу (curl-up)","group":"Дыхание и кор","page":"🟢 зелёный список — вместо скручиваний","wt":"bw","how":"Лёжа на спине, одна нога согнута, другая прямая; ладони под поясницей, чтобы сохранить её естественный изгиб. Напряги пресс, как перед ударом в живот, и приподними голову и плечи на 2–3 см как одно целое — без сгибания шеи и поясницы. Держи 10 с, дыши коротко. Схема 6-4-2: 6 удержаний, отдых, 4, отдых, 2; на середине поменяй ноги. Сложнее — локти подняты над полом; ещё сложнее — глубокий вдох и выдох прямо во время удержания.","err":"Подбородок к груди и подъём корпуса высоко — это уже обычное скручивание.","alt":"Тянет шею (протрузии в шейном отделе) — голова остаётся на полу, напрягается только пресс."},"splank":{"name":"Боковая планка","group":"Дыхание и кор","page":"🟢 зелёный список — вместо тренажёра для косых","wt":"bw","how":"Лёжа на боку, локоть под плечом. Подними таз, чтобы голова, таз и колени (или стопы) были на одной линии; живот напряжён, таз не уходит назад. Держи 10 с, опусти на 2–3 с и повтори. С колен — колени согнуты; полная — опора на стопы, верхняя впереди; сложный вариант — с поднятой верхней ногой.","err":"Таз проваливается или уходит назад, плечо «висит».","alt":"Болит плечо — стоя у стены, опираясь на неё предплечьем."},"birddog":{"name":"«Птица-собака» (bird dog)","group":"Дыхание и кор","page":"🟢 зелёный список — вместо гиперэкстензий","wt":"bw","how":"На четвереньках, ладони под плечами, колени под тазом, спина ровная. Напряги пресс и вытяни вперёд руку, а назад противоположную ногу — до горизонтали, не выше. Держи 8 с, сжимая кулак и ягодицу, верни и поменяй стороны. Сложнее — «квадраты»: рисуй рукой и ногой небольшие квадраты, не двигая поясницей.","err":"Нога выше горизонтали, прогиб в пояснице, таз поворачивается.","alt":"Трудно держать равновесие — поднимай только ногу."},"bearplank":{"name":"Медвежья планка","group":"Дыхание и кор","page":"🟢 зелёный список","wt":"bw","how":"На четвереньках подними колени на 3–5 см над полом, спина ровная, как стол. Рёбра опущены, дыхание спокойное. Сложнее — поочерёдно отрывай ладонь от пола на 2 с, не раскачивая таз.","err":"Таз выше плеч или прогиб в пояснице.","alt":"Тяжело — колени на полу, просто держи напряжённый пресс."},"pallof_cable":{"name":"Паллоф-пресс в кроссовере","group":"Дыхание и кор","page":"🟢 зелёный список — антиротация","wt":"mc","how":"Блок на уровне груди, встань к нему боком на шаг. Рукоять у груди обеими руками: выжми вперёд, держи 2–3 с, верни. Корпус не поворачивается к блоку, таз и рёбра неподвижны. Сложнее — в разножке или с шагом в сторону от блока.","err":"Поворот корпуса к блоку, прогиб в пояснице.","alt":"Блок занят — Паллоф-пресс со жгутом."},"suitcase":{"name":"«Чемоданная» переноска гири","group":"Дыхание и кор","page":"🟡 гири — только переноски","wt":"kb","how":"Гиря в одной руке. Бери её со скамьи или подставки, а не с пола в наклоне: если с пола — присядь с прямой спиной. Иди ровно 20–30 м (30–40 с): плечи на одном уровне, корпус не наклоняется к гире, рёбра опущены. Смени руку.","err":"Наклон в сторону гири и поднятое плечо.","alt":"Нет гири нужного веса — гантель."},"bottoms_up":{"name":"Переноска гири дном вверх","group":"Дыхание и кор","page":"🟡 гири — только переноски","wt":"kb","how":"Гиря дном вверх перед плечом, локоть под гирей, предплечье вертикально. Иди медленно 20–30 м: гиря не качается, корпус ровный, рёбра опущены. Начни с лёгкой гири: держать её трудно даже при небольшом весе.","err":"Гиря валится в сторону, а корпус наклоняется за ней.","alt":"Не получается удержать — переноска на согнутой руке дном вниз."},"breath9090":{"name":"Дыхание 90/90 у стены","group":"Мобильность и растяжка","page":"🟢 зелёный список","wt":"none","how":"Лёжа на спине, стопы на стене, колени и бёдра согнуты под 90°. Слегка прижми пятки к стене и подкрути таз — поясница мягко ложится на пол. Вдох носом 4 с, рёбра расходятся в стороны, а не вверх; выдох ртом 6–8 с до конца, рёбра опускаются; пауза 2 с. Вариант со жгутом над коленями — колени мягко давят в стороны.","err":"Прогиб в пояснице на вдохе и подъём рёбер к подбородку.","alt":"Нет стены — голени на стуле или диване."},"hipflex":{"name":"Растяжка сгибателя бедра в полувыпаде","group":"Мобильность и растяжка","page":"🟢 зелёный список","wt":"none","how":"Колено задней ноги на мягком, передняя стопа впереди, корпус вертикален. Подкрути таз (копчик вниз) и сожми ягодицу задней ноги — растяжение появится спереди бедра. Подавайся вперёд на 2–3 см, не прогибая поясницу. Сложнее — наклон корпуса в сторону передней ноги.","err":"Подача таза вперёд с прогибом в пояснице: растягивается поясница, а не мышца.","alt":"Больно колену — подложи сложенное полотенце или делай стоя у опоры."},"couch":{"name":"Растяжка у дивана с подкрученным тазом","group":"Мобильность и растяжка","page":"🟢 зелёный список","wt":"none","how":"Колено задней ноги у спинки дивана или скамьи, голень вертикально вдоль опоры, передняя стопа впереди. Подкрути таз и сожми ягодицу, корпус поднимай к вертикали ровно настолько, насколько не появляется прогиб. Сильнее предыдущей растяжки — начинай осторожно.","err":"Прогиб в пояснице ради вертикального корпуса.","alt":"Слишком сильно — растяжка в полувыпаде."},"lying9090":{"name":"Лёжа 90/90 — медленное дыхание","group":"Мобильность и растяжка","page":"🟢 зелёный список — разгрузка диска","wt":"none","how":"Лёжа на спине, голени на стуле или диване, бёдра и колени под 90°. Поясница расслаблена. Дыши около 6 раз в минуту: вдох 4 с, выдох 6 с. В этой позе давление в поясничном диске минимальное, а медленное дыхание успокаивает перед сном.","err":"","alt":""},"croc":{"name":"«Крокодилье» дыхание","group":"Мобильность и растяжка","page":"🟢 зелёный список","wt":"none","how":"Лёжа на животе, лоб на сложенных ладонях. Вдыхай носом в живот и поясницу: она должна приподниматься на вдохе. Вдох 4 с, выдох 6 с.","err":"Дыхание грудью и поднятые плечи.","alt":"Неудобно на животе — лёжа 90/90."},"openbook":{"name":"«Открытая книга»","group":"Мобильность и растяжка","page":"🟢 зелёный список — грудной отдел","wt":"bw","how":"Лёжа на боку, колени согнуты под 90° и прижаты друг к другу, руки вытянуты вперёд вместе. Верхнюю руку медленно открывай назад по дуге, поворачивая грудной отдел и провожая её взглядом; колени не отрываются от пола. 3 с в повороте, вернись.","err":"Колени расходятся и поворачивается таз — тогда скручивается поясница, а не грудной отдел.","alt":"Плечо не достаёт до пола — нормально, поворачивай без усилия."},"tspine_quad":{"name":"Ротация грудного отдела на четвереньках","group":"Мобильность и растяжка","page":"🟢 зелёный список — грудной отдел","wt":"bw","how":"На четвереньках, таз отведён к пяткам, одна ладонь на затылке. Поворачивай локоть вверх, раскрывая грудную клетку, и опускай к противоположному локтю. Поясница неподвижна — таз на пятках не даёт ей крутиться.","err":"Таз уходит вперёд и скручивается поясница.","alt":"Тянет плечо — ладонь на грудь вместо затылка."},"pecstretch":{"name":"Растяжка грудных","group":"Мобильность и растяжка","page":"🟢 зелёный список","wt":"none","how":"Предплечье на косяке двери или на стойке кроссовера, локоть на уровне плеча. Шаг вперёд, корпус чуть отворачивается — растяжение в груди. Рёбра опущены, без прогиба.","err":"Прогиб в пояснице вместо растяжения груди.","alt":"Неприятно в плече — локоть ниже."},"latstretch":{"name":"Растяжка широчайших на фитболе","group":"Мобильность и растяжка","page":"🟢 зелёный список","wt":"none","how":"На коленях, предплечья на фитболе перед собой. Откатывай мяч вперёд, опуская грудь, таз остаётся над коленями. Поясница не прогибается.","err":"Таз уходит назад и прогибается поясница.","alt":"Нет фитбола — ладони на скамье."},"hip9090":{"name":"Ротации бёдер 90/90 сидя","group":"Мобильность и растяжка","page":"🟢 зелёный список — тазобедренные","wt":"bw","how":"Сидя на полу с опорой руками сзади, обе ноги согнуты под 90°. Медленно переваливай колени из стороны в сторону, корпус ровный. Работают тазобедренные суставы, поясница неподвижна.","err":"Округление спины и рывки.","alt":"Тяжело сидеть — делай лёжа на спине, колени влево-вправо."},"hamstring_band":{"name":"Задняя поверхность бедра лёжа со жгутом","group":"Мобильность и растяжка","page":"🟢 зелёный список — только без симптомов в ноге","wt":"band","how":"Лёжа на спине, жгут на стопе. Поднимай прямую ногу до лёгкого растяжения, вторая нога на полу, поясница прижата. Только если в ноге нет боли, онемения или «прострела»: натяжение седалищного нерва при грыже может их спровоцировать.","err":"Тянуть ногу до боли и отрывать таз.","alt":"Есть симптомы в ноге — пропусти и скажи врачу."},"pigeon_bench":{"name":"«Голубь» на скамье","group":"Мобильность и растяжка","page":"🟢 зелёный список — тазобедренные","wt":"none","how":"Голень передней ноги лежит поперёк скамьи, задняя нога стоит на полу. Корпус прямой, медленно наклоняйся вперёд от бедра до растяжения в ягодице.","err":"Скручивание корпуса и округление спины.","alt":"Больно колену — ягодичная растяжка лёжа на спине."},"incline_mc":{"name":"Тренажёр для наклонного жима","group":"Грудь","page":"🟢 зелёный список — тренажёр жима","wt":"mc","how":"Сиденье — рукояти на уровне верха груди. Ягодицы и лопатки прижаты, лопатки сведены и опущены, рёбра опущены, голова на спинке. Выжимай вверх-вперёд, локти под 45–60° к корпусу; внизу — до лёгкого растяжения груди, не выкручивая плечо вперёд. Ногами не толкайся. Если есть педаль подачи рукоятей — выводи вес в исходное положение ею.","err":"Таз и поясница отрываются от спинки на тяжёлых повторах.","alt":"Тренажёр занят — жим гантелей на скамье под 30°, стопы на скамье."},"chest_mc":{"name":"Тренажёр для горизонтального жима","group":"Грудь","page":"🟢 зелёный список — тренажёр жима","wt":"mc","how":"Сиденье — рукояти на уровне середины груди. Ягодицы и лопатки прижаты, рёбра опущены, голова на спинке, стопы на полу без упора ногами. Выжимай вперёд, локти под 45–60°; внизу — до лёгкого растяжения груди. Кластер: 2 повтора, 20 с отдыха с весом на стопке, ещё 2 и ещё 2.","err":"Отрыв поясницы от спинки и толчок ногами.","alt":"Тренажёр занят — жим штанги лёжа со стопами на скамье с весом на 10% меньше."},"bench_bb":{"name":"Жим штанги лёжа, стопы на скамье","group":"Грудь","page":"🟡 жим без «моста»","wt":"bar","how":"Стопы на скамье, колени согнуты — поясница не может прогнуться. Лопатки сведены и опущены, рёбра опущены. Снимай штангу с помощником или в силовой раме с выставленными страховочными упорами. Опускай к нижней части груди, локти 45–60°, выжимай без отрыва таза.","err":"«Мост» в пояснице — при грыже это главный риск жима.","alt":"Самые тяжёлые подходы — в тренажёре горизонтального жима."},"db_bench":{"name":"Жим гантелей лёжа, стопы на скамье","group":"Грудь","page":"🟢 зелёный список — скамья и гантели","wt":"db","how":"Сядь на край скамьи, гантели на бёдрах, ляг назад, прижимая их к груди, и только потом поставь стопы на скамью. Жми вверх, сводя гантели над грудью, локти 45–60°. После подхода — гантели на грудь, стопы на пол, сядь вместе с гантелями.","err":"Рывок гантелей коленями в исходное положение с прогибом.","alt":"Гантели стало трудно заносить — тренажёр горизонтального жима."},"smith_incline":{"name":"Жим в Смите на скамье 30°, стопы на скамье","group":"Грудь","page":"🟡 Смит — только жимы","wt":"sm","how":"Скамья под 30°, гриф над верхом груди, стопы на скамье или на подставке. Лопатки сведены, рёбра опущены. Выставь ограничители чуть ниже груди. Опускай гриф к верху груди, выжимай вверх.","err":"Прогиб в пояснице и поднятые плечи.","alt":"Тренажёр для наклонного жима."},"dips_grav":{"name":"Брусья в гравитроне","group":"Грудь","page":"🟡 неглубоко, только с противовесом","wt":"gv","how":"Колени на платформе, корпус вертикален, плечи опущены. Опускайся, пока плечо не станет параллельно полу, — не глубже; выжимайся без раскачки. Прогресс — меньше противовеса. Ноют плечи — упражнение пропускается.","err":"Слишком глубокое опускание и поднятые к ушам плечи.","alt":"Болят плечи — разгибание на трицепс с канатом."},"pecdeck_sd":{"name":"Бабочка — статодинамика","group":"Грудь","page":"🟢 зелёный список — тренажёр","wt":"mc","how":"Спина прижата, рукояти на уровне груди. Своди руки 3 с и разводи 3 с, не доходя до полного сведения и разведения: мышцы не расслабляются весь подход. Вес — около 40–50% от максимума; к концу подхода появляется жжение. Подход длится 30–50 с.","err":"Пауза в крайних точках: мышца отдыхает, а смысл метода — в постоянном напряжении.","alt":"Бабочка занята — сведение рук в кроссовере."},"cable_fly":{"name":"Сведение рук в кроссовере в шаге","group":"Грудь","page":"🟢 зелёный список — блоки","wt":"mc","how":"Блоки на уровне плеч, шаг вперёд в разножке, корпус слегка наклонён, но спина ровная. Своди руки перед грудью 3 с и разводи 3 с, не расслабляясь в крайних точках. Локти чуть согнуты и не меняют угол.","err":"Жим руками вместо сведения и прогиб в пояснице.","alt":"Бабочка."},"tbar_cs":{"name":"Тяга Т-грифа с упором грудью","group":"Спина","page":"🟢 зелёный список — главная тяга","wt":"pl","how":"Грудь плотно на подушке, стопы на платформе. Нейтральный хват, сведи лопатки и тяни к низу груди, локти вдоль корпуса. Пауза 1 с вверху, опускай под контролем до прямых рук, не отрывая грудь от подушки.","err":"Отрыв груди от подушки и рывок поясницей.","alt":"Тренажёр занят — рычажная тяга."},"tbar_wide":{"name":"Тяга Т-грифа с упором, широкий хват","group":"Спина","page":"🟢 зелёный список — главная тяга","wt":"pl","how":"Как обычная тяга Т-грифа с упором, но широкий хват и локти под 60–70° к корпусу: больше работают задние дельты и середина спины. Вес меньше, чем нейтральным хватом.","err":"Отрыв груди от подушки.","alt":"Рычажная тяга широким хватом."},"lever_row1":{"name":"Рычажная тяга одной рукой","group":"Спина","page":"🟢 зелёный список — рычажный тренажёр","wt":"pl","how":"Грудь на упоре (если есть), вторая рука держится за тренажёр. Тяни рукоять к поясу, локоть вдоль корпуса, без поворота корпуса. Опускай медленно до полного растяжения широчайшей.","err":"Скручивание корпуса за рукой.","alt":"Горизонтальная тяга одной рукой."},"lever_row2":{"name":"Рычажная тяга двумя руками","group":"Спина","page":"🟢 зелёный список — рычажный тренажёр","wt":"pl","how":"Грудь на упоре, хват по ширине тренажёра. Сведи лопатки и тяни к низу груди; пауза 1 с, опускай под контролем. Корпус неподвижен — опора забирает нагрузку с поясницы.","err":"Рывок корпусом назад.","alt":"Тяга Т-грифа с упором грудью."},"latpd_n":{"name":"Вертикальная тяга нейтральным хватом","group":"Спина","page":"🟢 зелёный список — блок","wt":"mc","how":"Бёдра под валиками, корпус вертикален или с наклоном назад до 10°. Тяни рукоять к верху груди, опуская лопатки; вверху выпрямляй руки полностью. Кластер: 3 повтора, 20 с отдыха, ещё 3 и ещё 3.","err":"Раскачка и откидывание корпуса назад, чтобы «досадить» вес.","alt":"Нет нейтральной рукояти — средний хват."},"gravitron_pu":{"name":"Подтягивания в гравитроне","group":"Спина","page":"🟢 зелёный список — противовес","wt":"gv","how":"Колени на платформе, хват нейтральный или средний. Из виса с опущенными плечами тянись грудью к рукоятям, подбородок над ними; опускайся 2 с до прямых рук. Корпус вертикален, без раскачки. Прогресс — меньше противовеса.","err":"Рывки и неполная амплитуда.","alt":"Гравитрон занят — вертикальная тяга."},"seatrow_sd":{"name":"Горизонтальная тяга — статодинамика","group":"Спина","page":"🟢 зелёный список — блок","wt":"mc","how":"Сидя, колени чуть согнуты, корпус вертикален и неподвижен. Тяни 3 с к животу, отпускай 3 с, не выпрямляя руки до конца: мышцы не расслабляются весь подход. Вес около 40–50% от максимума, подход 30–50 с.","err":"Наклон вперёд за рукоятью и откидывание назад: нагрузка уходит в поясницу.","alt":"Рычажная тяга лёгким весом в том же темпе."},"cable_row1":{"name":"Горизонтальная тяга одной рукой","group":"Спина","page":"🟢 зелёный список — блок","wt":"mc","how":"Сидя или стоя в разножке у среднего блока. Тяни рукоять к поясу, локоть вдоль корпуса, корпус не поворачивается. Опускай 3 с.","err":"Скручивание корпуса за рукой.","alt":"Рычажная тяга одной рукой."},"hipthrust_sm":{"name":"Hip thrust в машине Смита","group":"Ноги и ягодицы","page":"🟡 с подушкой, без прогиба","wt":"sm","how":"Спина на краю скамьи на уровне лопаток, гриф на мягкой подушке в сгибе бёдер, стопы на ширине таза. Подкрути таз, выдохни и подними таз до прямой линии плеч, таза и коленей; голени вертикальны. Вверху таз подкручен, поясница не прогибается. Опускайся под контролем.","err":"Переразгибание поясницы вверху вместо работы ягодиц.","alt":"Ноет поясница — ягодичный мост на полу с гантелью на бёдрах. Упражнение — в списке для согласования с врачом."},"split_db":{"name":"Сплит-присед с гантелями","group":"Ноги и ягодицы","page":"🟡 гантели в опущенных руках","wt":"db","how":"Длинный шаг, гантели в опущенных руках, корпус вертикален. Опускайся прямо вниз, пока заднее колено почти не коснётся пола; переднее колено над стопой. Поднимайся за счёт передней ноги. На старте суммарный вес гантелей — до 30% веса тела.","err":"Наклон вперёд и толчок задней ногой.","alt":"Ноет поясница — без гантелей или придерживаясь за стойку. Упражнение — в списке для согласования с врачом."},"stepup_db":{"name":"Зашагивания на скамью с гантелями","group":"Ноги и ягодицы","page":"🟡 гантели в опущенных руках","wt":"db","how":"Скамья 30–40 см, вся стопа на скамье. Поднимайся за счёт ноги на скамье, не отталкиваясь нижней, корпус вертикален. Опускайся медленно, 2 с.","err":"Толчок нижней ногой и наклон корпуса.","alt":"Сплит-присед без гантелей."},"fitball_curl":{"name":"Сгибание ног на фитболе в мосте","group":"Ноги и ягодицы","page":"🟢 зелёный список — фитбол","wt":"bw","how":"Лёжа на спине, пятки на фитболе. Подними таз до прямой линии и, удерживая таз, подкати мяч пятками к себе, затем откати. Таз не опускается и не прогибается. Сложнее — откатывай 3 с.","err":"Таз проваливается на каждом повторе.","alt":"Тяжело — таз опускается между повторами."},"fitball_curl1":{"name":"Сгибание одной ноги на фитболе","group":"Ноги и ягодицы","page":"🟢 зелёный список — фитбол","wt":"bw","how":"Как сгибание на фитболе, но работает одна нога, вторая поднята. Таз ровный и не проваливается на стороне свободной ноги.","err":"Перекос таза.","alt":"Сгибание двумя ногами медленнее."},"abd_band":{"name":"Отведение бедра со жгутом лёжа на боку","group":"Ноги и ягодицы","page":"🟢 зелёный список","wt":"band","how":"Лёжа на боку, жгут над коленями, нижняя нога согнута. Поднимай верхнюю прямую ногу чуть назад, носок вниз, таз не заваливается назад. Пауза 1 с.","err":"Нога уходит вперёд, таз поворачивается.","alt":"Без жгута, медленнее."},"bridge":{"name":"Ягодичный мост со жгутом","group":"Ноги и ягодицы","page":"🟢 зелёный список","wt":"band","how":"Лёжа на спине, стопы на ширине таза, жгут над коленями. Подкрути таз, выдохни и подними его за счёт ягодиц до прямой линии плеч, таза и коленей. Колени давят в жгут наружу. Вверху пауза, опускайся медленно.","err":"Подъём слишком высоко с прогибом в пояснице — ягодицы при этом выключаются.","alt":"Нет жгута — без него, сжимая ягодицы вверху."},"bridge_sl":{"name":"Ягодичный мост на одной ноге","group":"Ноги и ягодицы","page":"🟢 зелёный список","wt":"bw","how":"Одна стопа на полу, вторая нога согнута и поднята. Подкрути таз и подними его на опорной ноге до прямой линии, ,"kind":"breath"}}]},{"t":"ready","mode":"gym","title":"Утро — светофор, 3 минуты","lines":["<b>Пульс покоя<\/b> (лёжа, сразу после пробуждения): норма — ±5 от среднего за неделю; жёлтый — +6–9; красный — +10 и больше или простуда.","<b>Сон:<\/b> норма — 7 ч и больше; жёлтый — 5,5–7 ч; красный — меньше 5,5 ч.","<b>Боль в пояснице или шее (0–10):<\/b> норма — 0–2; жёлтый — 3–4 или скованность дольше 30 мин; красный — 5 и выше.","<b>Самочувствие<\/b> — энергия, настроение, мышцы, каждое от 1 до 5: норма — сумма 11 и больше; жёлтый — 8–10; красный — 7 и меньше.","<b>ВСР (если есть датчик):<\/b> жёлтый — ниже нормы 1 день; красный — 2 дня подряд.","<b>Контрольный подход в зале:<\/b> Т-гриф с весом на 10 повторов с запасом 2 — получилось на 1–2 повтора хуже обычного — жёлтый; на 3 и больше — красный.","<b>Решение.<\/b> Всё в норме — по плану. Один жёлтый — по плану, но в волне Т запас на 1 больше и минус 1 подход. Два жёлтых — веса −15–20%, интервалы заменить зоной 2. Три жёлтых или один красный — восстановление вместо зала: 30 мин зоны 1–2, протокол Дня 1 и растяжка.","<b>Онемение, слабость или боль в ноге или руке — не жёлтый, а стоп<\/b>: тренировку отменить, план действий — в «Красных флагах» профиля."],"y":"Жёлтый день: приложение снизило рабочие веса на 15%. Интервалы замени 20 минутами зоны 2; в волне Т — запас на 1 больше и минус 1 подход.","r":"Красный день: вместо зала — восстановление: 30 мин зоны 1–2 (прогулка или велотренажёр), протокол домашнего Дня 1 и растяжка. Онемение, слабость или боль в ноге — тренировку отменить и к врачу."},{"t":"steps","title":"Разминка — 8 мин","id":"warm","warm":true,"steps":[{"t":"<b>Горизонтальный велотренажёр — 3 мин:<\/b> от зоны 1 к нижней границе зоны 2 ({Z1} → {Z2}).","segs":[{"l":"Велотренажёр: зона 1 → зона 2","s":180,"k":"warm","t":"{Z1} → {Z2}"}]},{"t":"<b>Большая тройка Макгилла — короткий круг:<\/b> curl-up 2 × 10 с, боковая планка 10 с на сторону, bird dog 2 раза на сторону по 8 с.","segs":[{"l":"Curl-up 1/2","s":10 <script>
(function(){
"use strict";
/* ================= данные ================= */
var DATA = JSON.parse(document.getElementById("plan-data").textContent);
var EX = DATA.ex, DAYS = DATA.days, SECS = DATA.secs, BLOCKS = DATA.blocks, PH = DATA.phases, N = DAYS.length;
var PCOL = ["var(--p0)","var(--p1)","var(--p2)","var(--p3)"];
var NATIVE = (typeof window.Android !== "undefined" && window.Android) ? window.Android : null;
var BIGSTEP = {hipthrust_sm:1, calf_seat:1};
var KIND = {H1:["Д1","таз·кор"], H2:["Д2","зона 2"], A:["А","зал"], B:["Б","зал"], T:["Т","тесты"]};
var WNAME = {"Л":"лёгкая", "С":"средняя", "Т":"тяжёлая", "Р":"разгрузка"};
function whereOf(day){ var p = (day.d - 1) % 4; return ["Смена 1","Смена 2","Выходной 1","Выходной 2"][p]; }
function secsOf(day){ return day.secs.map(function(i){ return SECS[i]; }); }
function itemsOf(day){ var out = []; secsOf(day).forEach(function(s){ if(s.t === "ex") s.items.forEach(function(it){ if(it.ex) out.push(it); }); }); return out; }

/* ================= хранение ================= */
var LS = "bl5-app-v1", LS_OLD = "bl4-app-v1";
var S = {profile:{start:"", bench:"", bw:"", rhr:"", age:"39", hrmax:"", stepDb:2, stepMc:5, sound:true, watch:"rest", startOk:false}, days:{}, c0:{tests:{}, checks:{}}, body:[]};
var LEGACY_D0 = null; // поля «Дня 0» старой версии: в облаке не трогаем
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function load(){
  try{
    var raw = JSON.parse(lsGet(LS) || "null");
    if(raw){ S.profile = Object.assign(S.profile, raw.profile || {}); S.days = raw.days || {}; S.c0 = Object.assign(S.c0, raw.c0 || {}); S.body = raw.body || []; }
    else {
      var old = JSON.parse(lsGet(LS_OLD) || "null");
      if(old){
        var op = old.profile || {};
        ["bench","bw","stepDb","sound","watch"].forEach(function(k){ if(op[k] !== undefined && op[k] !== null) S.profile[k] = op[k]; });
        S.profile.startOk = false; S.body = old.body || [];
      }
    }
    S.c0.tests = S.c0.tests || {}; S.c0.checks = S.c0.checks || {};
  }catch(e){}
})();
function key(d){ return "s" + String(d).padStart(3, "0"); }
function rec(d){ var k = key(d); if(!S.days[k]) S.days[k] = {done:false, note:"", sets:{}, steps:{}, cond:{}, tests:{}}; var r = S.days[k]; r.sets = r.sets || {}; r.steps = r.steps || {}; r.cond = r.cond || {}; r.tests = r.tests || {}; return r; }
function persist(){ lsSet(LS, JSON.stringify(S)); }

/* облако (только в веб-версии внутри Claude) */
var CLOUD = {db:null, uid:null, timers:{}, chains:{}};
function save(docId){
  persist();
  if(!CLOUD.db) return;
  clearTimeout(CLOUD.timers[docId]);
  CLOUD.timers[docId] = setTimeout(function(){ delete CLOUD.timers[docId]; pushDoc(docId); }, 800);
}
function docBody(id){
  if(id === "settings") return {profile:S.profile, d0:LEGACY_D0 || {}};
  if(id === "body") return {list:S.body};
  if(id === "cycle0") return {tests:S.c0.tests, checks:S.c0.checks};
  return S.days[id] || {};
}
function pushDoc(id){
  if(!CLOUD.db) return;
  var ref; try{ ref = CLOUD.db.collection("data/users/" + CLOUD.uid).doc(id); }catch(e){ return; }
  var body = JSON.parse(JSON.stringify(docBody(id)));
  CLOUD.chains[id] = (CLOUD.chains[id] || Promise.resolve()).then(function(){ return ref.set(body); }).catch(function(){});
}
function connectCloud(){
  if(NATIVE || !window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1]; if(!db || !user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      CLOUD.db = db; CLOUD.uid = uid; var first = true;
      db.collection("data/users/" + uid).onSnapshot(function(snap){
        var have = {};
        snap.docs.forEach(function(doc){
          have[doc.id] = true; if(CLOUD.timers[doc.id]) return;
          var b = doc.data(); if(!b) return;
          if(doc.id === "settings"){ if(b.profile) S.profile = Object.assign(S.profile, b.profile); LEGACY_D0 = b.d0 || LEGACY_D0; }
          else if(doc.id === "body"){ S.body = b.list || []; }
          else if(doc.id === "cycle0"){ S.c0 = {tests:b.tests || {}, checks:b.checks || {}}; }
          else if(/^s\d{3}$/.test(doc.id)){ S.days[doc.id] = b; }
        });
        if(first){
          first = false;
          Object.keys(S.days).forEach(function(id){ if(!have[id]) pushDoc(id); });
          if(!have.settings) pushDoc("settings");
          if(!have.body && S.body.length) pushDoc("body");
          if(!have.cycle0 && (Object.keys(S.c0.tests).length || Object.keys(S.c0.checks).length)) pushDoc("cycle0");
        }
        persist(); if(!busyTyping()) render(true);
      }, function(){ CLOUD.db = null; });
    });
  }).catch(function(){});
}
function busyTyping(){ var a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"); }

/* ================= расчёт веса ================= */
var P10 = [0,100,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,73.9,71.7,69.4,67.2,65,62.8,60.6,58.4,56.2,54,51.8,49.6];
function pct(reps, rpe){
  if(!reps) return null; rpe = rpe || 8;
  var x = Math.max(1, Math.min(20, reps + (10 - rpe)));
  var lo = Math.floor(x), hi = Math.ceil(x);
  return P10[lo] + (P10[hi] - P10[lo]) * (x - lo);
}
/* mc — стек тренажёра или блок, pl — тренажёр на блинах, sm — Смит, bar — штанга, db — гантель, kb — гиря, gv — противовес гравитрона */

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk "BruceLee-6.0.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: Брюс Ли 6.0 — версия 6.0.${{ github.run_number }}
          body: |
            Брюс Ли 6.0: гайды Сарычева 100 → 150 → 200 на графике 2/2 с адаптивными весами.
            Скачай файл BruceLee-6.0.${{ github.run_number }}.apk на телефон и открой его, чтобы установить.
            Обновление ставится поверх прошлой версии: профиль, пульс, вес тела и талия переносятся; записи версии 5 остаются в телефоне.
          files: BruceLee-6.0.${{ github.run_number }}.apk
          make_latest: true

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk "BruceLee-5.0.${{ github.run_number }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: Брюс Ли 5.0 — версия 5.0.${{ github.run_number }}
          body: |
            Программа 5.0 «Позвоночник прежде всего»: 20 недель, график 2/2.
            Скачай файл BruceLee-5.0.${{ github.run_number }}.apk на телефон и открой его, чтобы установить.
            Обновление ставится поверх прошлой версии: профиль, вес тела и настройки сохраняются.
          files: BruceLee-5.0.${{ github.run_number }}.apk
          make_latest: true

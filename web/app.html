<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Брюс Ли 5.0</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url("fonts/Inter-Regular.otf")}
@font-face{font-family:"Inter";font-weight:600;src:url("fonts/Inter-SemiBold.otf")}
@font-face{font-family:"Inter";font-weight:700;src:url("fonts/Inter-Bold.otf")}
@font-face{font-family:"Inter";font-weight:800;src:url("fonts/Inter-ExtraBold.otf")}
@font-face{font-family:"Inter Display";font-weight:800;src:url("fonts/InterDisplay-ExtraBold.otf")}
/* Layout: a gym logbook app. Bottom tab bar; the Day screen is a stack of interactive sections; one timer bar docks above the tabs. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E8E2; --ink:#16201B; --muted:#56635C; --line:#D3D9D1;
  --p0:#5F7180; --p1:#1D7560; --p2:#A23E27; --p3:#9A6A0B; --dl:#7E8781;
  --ok:#1D7560; --warn:#9A6A0B; --bad:#A23E27; --timer:#16201B; --timer-ink:#EEF0EC;
  --f-display:"Inter Display","Inter",Roboto,system-ui,sans-serif;
  --f-body:"Inter",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181E1B; --sunk:#141917; --ink:#E5EAE6; --muted:#9AA69F; --line:#2A332E;
  --p0:#9DB0BF; --p1:#55C3A2; --p2:#E98466; --p3:#E2B44E; --dl:#9AA39E; --ok:#55C3A2; --warn:#E2B44E; --bad:#E98466;
  --timer:#E5EAE6; --timer-ink:#101412; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:14px;padding-block:14px 190px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px;padding:9px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.big{width:100%;padding:13px;font-size:17px}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;border:1px solid var(--c,var(--line));color:var(--c,var(--muted))}
.chip.fill{background:var(--c);color:var(--bg);border-color:var(--c)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar button{border:0;background:none;padding:9px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tabbar button b{font-family:var(--f-display);font-size:17px;line-height:1}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar button[aria-current="true"] b{color:var(--p1)}

/* timer bar */
.tbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:21;padding:0 10px 8px}
.tbar-in{max-width:740px;margin:0 auto;background:var(--timer);color:var(--timer-ink);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tbar .tl{font-size:14px;font-weight:700;line-height:1.25}
.tbar .tt{font-size:12.5px;opacity:.8;line-height:1.3}
.tbar .tc{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center;text-align:right}
.tbar .tb{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tbar .tb button{flex:1;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:700;min-width:0}
.tbar.work .tbar-in{background:var(--p2);color:#fff}
.tbar.warm .tbar-in,.tbar.easy .tbar-in{background:var(--p0);color:#fff}
.tbar.done .tbar-in{background:var(--ok);color:#fff}
.tbar .prog{grid-column:1 / -1;height:4px;border-radius:2px;background:rgba(127,127,127,.35);overflow:hidden}
.tbar .prog i{display:block;height:100%;background:currentColor;width:0}

/* ruler of 6 blocks, grid of 6 cycles × 4 days */
.ruler{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:12px}
.cell{border:0;padding:0;height:38px;border-radius:6px;background:var(--pc);opacity:.42;position:relative;font-size:13px;font-weight:800;color:var(--bg)}
.cell[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.cell .dlm{position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);background:var(--bg)}
.cell.today::after{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.weekhead{margin-top:14px;display:grid;gap:6px}
.weekhead .row h2{font-size:20px}
.cycgrid{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}
.cyl{font-size:11px;font-weight:800;color:var(--muted);display:grid;place-items:center;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.cyl.dlc{color:var(--dl)}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 2px 5px;display:grid;justify-items:center;gap:1px;min-width:0}
.dayb .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.dayb .k{font-size:10.5px;color:var(--muted);line-height:1.15;text-align:center}
.dayb .k b{display:block;font-family:var(--f-display);font-size:14px;color:var(--pc)}
.dayb .dt{font-size:10px;color:var(--muted)}
.dayb[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dayb.done{background:var(--sunk)} .dayb.done .n::after{content:" ✓";color:var(--ok)}
.dayb.today .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* day */
.day{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-top{padding:16px 14px 14px;border-top:6px solid var(--pc);display:grid;gap:8px}
.day-top .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.day-top .big h2{font-size:34px;line-height:1}
.day-top h3{font-family:var(--f-body);font-weight:800;font-size:18px}
.goal{max-width:65ch}
.sec{border-top:1px solid var(--line);padding:14px;display:grid;gap:10px}
.sec > h4{margin:0;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
details.sec > summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";color:var(--muted);font-weight:800}
details.sec[open] > summary::after{content:"−"}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok)}
.step .sb{display:grid;gap:6px;min-width:0}
.step.on .st{opacity:.55}
.st b{font-weight:700}
.foot{font-size:13.5px;color:var(--muted)}

/* exercise */
.hdr{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:10px;border-top:1px dashed var(--line)}
.hdr:first-child{border-top:0;padding-top:0}
.group{display:grid;gap:8px;border-left:3px solid var(--pc);padding-left:9px}
.group.single{border-left-color:transparent;padding-left:0}
.gl{font-size:12.5px;color:var(--muted);font-weight:700}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0}
.ex.next{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 9px;align-items:start}
.lab{font-weight:800;font-size:13px;background:var(--sunk);border-radius:6px;padding:2px 6px;color:var(--pc);font-variant-numeric:tabular-nums}
.ex-name{font-weight:800;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.ex-name .pg{display:block;font-size:12px;color:var(--muted);font-weight:600}
.sets{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;max-width:7.5em;text-wrap:balance}
.ex-load{font-size:14px}
.ex-rest{font-size:13px;color:var(--muted)}
.ex-note{font-size:14px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.sugg{font-size:14px;border-left:3px solid var(--ok);padding:4px 0 4px 9px}
.sugg b{font-size:16px}
.ex details{font-size:14px}
.ex details summary{cursor:pointer;color:var(--muted);font-weight:700}
.ex details > div{display:grid;gap:6px;margin-top:6px}
.setlist{display:grid;gap:6px}
.set{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 76px 42px;gap:6px;align-items:center}
.set.nowt{grid-template-columns:58px minmax(0,1fr) 76px 42px}
.set.norpe{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 44px}
.set.nowt.norpe{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}
.set.only{grid-template-columns:minmax(0,1fr) 44px}
.set .sl{font-size:12px;line-height:1.2;color:var(--muted);font-weight:700;min-width:0}
.set .sl b{display:block;color:var(--ink);font-size:13px}
.set input,.set select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums;text-align:center}
.set select{padding:8px 2px}
.set .ok{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px}
.set.isdone .ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.set.isdone input,.set.isdone select{background:var(--sunk)}
.set .tbtn{height:40px;border-radius:9px;border:1px solid var(--ink);background:var(--surface);font-weight:800}
.hint{font-size:12.5px;color:var(--muted)}
.cond{border:1px solid var(--pc);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.cond .ch{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.cond ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.seglist{display:grid;gap:2px;max-height:220px;overflow:auto;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.seglist div{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;border-radius:5px}
.seglist div.cur{background:var(--sunk);font-weight:800}
.seglist div.past{opacity:.45}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.trow b{font-size:15px}
.trow input,.trow select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--bg);font-size:16px;text-align:center}
.trow.has input,.trow.has select{border-color:var(--ok)}
.journal textarea,.field textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.nav{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}

/* panels */
.panel{display:grid;gap:14px}
.panel h2{font-size:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card h3{font-family:var(--f-body);font-size:17px;font-weight:800}
.card.alert{border-color:var(--warn)}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-size:16px;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:280px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:2px;background:var(--surface)}
.kpi b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.ex-grid{display:grid;gap:10px}
@media (min-width:700px){.ex-grid{grid-template-columns:1fr 1fr}}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.colors button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px}
.colors button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface)}
.banner{border-left:4px solid var(--c);background:var(--sunk);padding:9px 11px;border-radius:8px;font-size:14px}
.ztbl td.r{font-weight:700}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
@media (max-width:380px){.set{grid-template-columns:50px minmax(0,1fr) minmax(0,1fr) 58px 40px;gap:4px}.dayb .k{font-size:9.5px}.trow{grid-template-columns:minmax(0,1fr) 104px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="tbar" id="tbar" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Разделы">
  <button type="button" data-tab="day"><b>Д</b>День</button>
  <button type="button" data-tab="progress"><b>↗</b>Прогресс</button>
  <button type="button" data-tab="ref"><b>Т</b>Техника</button>
  <button type="button" data-tab="profile"><b>П</b>Профиль</button>
</nav>
<script id="plan-data" type="application/json">__PLAN_DATA__</script>
<script>
(function(){
"use strict";
/* ================= данные ================= */
var DATA = JSON.parse(document.getElementById("plan-data").textContent);
var EX = DATA.ex, DAYS = DATA.days, SECS = DATA.secs, BLOCKS = DATA.blocks, PH = DATA.phases, N = DAYS.length;
var PCOL = ["var(--p0)","var(--p1)","var(--p2)","var(--p3)"];
var NATIVE = (typeof window.Android !== "undefined" && window.Android) ? window.Android : null;
var BIGSTEP = {hipthrust_sm:1, calf_seat:1};
var KIND = {H1:["Д1","таз·кор"], H2:["Д2","зона 2"], A:["А","зал"], B:["Б","зал"], T:["Т","тесты"]};
var WNAME = {"Л":"лёгкая", "С":"средняя", "Т":"тяжёлая", "Р":"разгрузка"};
function whereOf(day){ var p = (day.d - 1) % 4; return ["Смена 1","Смена 2","Выходной 1","Выходной 2"][p]; }
function secsOf(day){ return day.secs.map(function(i){ return SECS[i]; }); }
function itemsOf(day){ var out = []; secsOf(day).forEach(function(s){ if(s.t === "ex") s.items.forEach(function(it){ if(it.ex) out.push(it); }); }); return out; }

/* ================= хранение ================= */
var LS = "bl5-app-v1", LS_OLD = "bl4-app-v1";
var S = {profile:{start:"", bench:"", bw:"", rhr:"", age:"39", hrmax:"", stepDb:2, stepMc:5, sound:true, watch:"rest", startOk:false}, days:{}, c0:{tests:{}, checks:{}}, body:[]};
var LEGACY_D0 = null; // поля «Дня 0» старой версии: в облаке не трогаем
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
(function load(){
  try{
    var raw = JSON.parse(lsGet(LS) || "null");
    if(raw){ S.profile = Object.assign(S.profile, raw.profile || {}); S.days = raw.days || {}; S.c0 = Object.assign(S.c0, raw.c0 || {}); S.body = raw.body || []; }
    else {
      var old = JSON.parse(lsGet(LS_OLD) || "null");
      if(old){
        var op = old.profile || {};
        ["bench","bw","stepDb","sound","watch"].forEach(function(k){ if(op[k] !== undefined && op[k] !== null) S.profile[k] = op[k]; });
        S.profile.startOk = false; S.body = old.body || [];
      }
    }
    S.c0.tests = S.c0.tests || {}; S.c0.checks = S.c0.checks || {};
  }catch(e){}
})();
function key(d){ return "s" + String(d).padStart(3, "0"); }
function rec(d){ var k = key(d); if(!S.days[k]) S.days[k] = {done:false, note:"", sets:{}, steps:{}, cond:{}, tests:{}}; var r = S.days[k]; r.sets = r.sets || {}; r.steps = r.steps || {}; r.cond = r.cond || {}; r.tests = r.tests || {}; return r; }
function persist(){ lsSet(LS, JSON.stringify(S)); }

/* облако (только в веб-версии внутри Claude) */
var CLOUD = {db:null, uid:null, timers:{}, chains:{}};
function save(docId){
  persist();
  if(!CLOUD.db) return;
  clearTimeout(CLOUD.timers[docId]);
  CLOUD.timers[docId] = setTimeout(function(){ delete CLOUD.timers[docId]; pushDoc(docId); }, 800);
}
function docBody(id){
  if(id === "settings") return {profile:S.profile, d0:LEGACY_D0 || {}};
  if(id === "body") return {list:S.body};
  if(id === "cycle0") return {tests:S.c0.tests, checks:S.c0.checks};
  return S.days[id] || {};
}
function pushDoc(id){
  if(!CLOUD.db) return;
  var ref; try{ ref = CLOUD.db.collection("data/users/" + CLOUD.uid).doc(id); }catch(e){ return; }
  var body = JSON.parse(JSON.stringify(docBody(id)));
  CLOUD.chains[id] = (CLOUD.chains[id] || Promise.resolve()).then(function(){ return ref.set(body); }).catch(function(){});
}
function connectCloud(){
  if(NATIVE || !window.claude || !window.claude.use) return;
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(r){
    var db = r[0], user = r[1]; if(!db || !user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      CLOUD.db = db; CLOUD.uid = uid; var first = true;
      db.collection("data/users/" + uid).onSnapshot(function(snap){
        var have = {};
        snap.docs.forEach(function(doc){
          have[doc.id] = true; if(CLOUD.timers[doc.id]) return;
          var b = doc.data(); if(!b) return;
          if(doc.id === "settings"){ if(b.profile) S.profile = Object.assign(S.profile, b.profile); LEGACY_D0 = b.d0 || LEGACY_D0; }
